# ============================================================================
# 企业内部钱包系统 - API路由配置示例
#
# Swagger 生成约定：
# - 每条 route 必须设置 `tag: ...`
# - 每条 route 可选设置 `summary` / `description`（用于 Swagger operation 的 summary/description）
# - 每个 service 维护 `tag_descriptions`（用于 Swagger tags 描述）
# - 通过 `./scripts/sync-swagger-http-yaml.sh` 生成 docs/swagger/*，不要手改产物
# ============================================================================

services:
  # ==================== Business Service - 业务服务 ====================
   # 用户管理、资金账户、内部转账、闪兑等
  business:
    tag_descriptions:
      Auth: 登录、令牌、密码与2FA
      Assets: 资产概览、充值、提现、记录
      InternalTransfer: 内部转账（用户之间的资产转移）
      Notifications: 消息通知相关
      Me: 个人资料与概览
      LinkedWallets: 第三方钱包绑定与管理
      Settings: 账号设置与偏好
      WithdrawAuditWhitelist: 提现免审白名单（自绑定）
      Swap: Web3 Swap（DEX 聚合报价/交易）
      Web3Wallet: Web3 自托管钱包（用户管理、资产、交易记录）
    routes:
      - path: /api/v1/business/get_country_codes
        method: POST
        service: Business
        rpc: GetCountryCodes
        tag: Auth
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: 获取支持的国家/地区区号
        description: 返回系统支持的手机号国家/地区区号列表（E.164，带 + 前缀）
      - path: /api/v1/business/send_sms_code
        method: POST
        service: Business
        rpc: SendSMSCode
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 发送手机验证码
        description: 向手机号发送验证码
      - path: /api/v1/business/send_email_code
        method: POST
        service: Business
        rpc: SendEmailCode
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 发送邮箱验证码
        description: 向邮箱发送验证码（请求体需提供 email）
      - path: /api/v1/business/login_by_email_code
        method: POST
        service: Business
        rpc: LoginByEmailCode
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 邮箱验证码登录/注册
        description: 使用邮箱与验证码登录，首次使用自动注册
      - path: /api/v1/business/login_by_phone_code
        method: POST
        service: Business
        rpc: LoginByPhoneCode
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 手机验证码登录/注册
        description: 使用手机号（country_code + phone）与验证码登录，首次使用自动注册
      - path: /api/v1/business/login_by_google
        method: POST
        service: Business
        rpc: LoginByGoogle
        tag: Auth
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Google OAuth 登录
        description: 使用 Google OAuth ID Token 登录或注册，支持自动注册新用户
      - path: /api/v1/business/refresh_token
        method: POST
        service: Business
        rpc: RefreshToken
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 刷新令牌
        description: 使用刷新令牌获取新的访问令牌
      - path: /api/v1/business/forgot_password_by_email
        method: POST
        service: Business
        rpc: ForgotPasswordByEmail
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 忘记密码（邮箱）
        description: 通过邮箱验证码重置登录密码
      - path: /api/v1/business/forgot_password_by_phone
        method: POST
        service: Business
        rpc: ForgotPasswordByPhone
        tag: Auth
        auth: false
        rate_limit: 5
        rate_limit_type: ip
        summary: 忘记密码（手机）
        description: 通过短信验证码重置登录密码
      - path: /api/v1/business/geetest/validate
        method: POST
        service: Business
        rpc: ValidateGeetest
        tag: Auth
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Geetest 验证
        description: 校验 Geetest v4 验证参数
      - path: /api/v1/business/logout
        method: POST
        service: Business
        rpc: Logout
        tag: Auth
        auth: true
        summary: 登出
        description: 销毁会话并使令牌失效
      - path: /api/v1/business/get_my_overview
        method: POST
        service: Business
        rpc: GetMyOverview
        tag: Me
        auth: true
        rate_limit: 10
        summary: 我的页
        description: 获取我的页面概览信息
      - path: /api/v1/business/get_asset_overview
        method: POST
        service: Business
        rpc: GetAssetOverview
        tag: Assets
        auth: true
        summary: 资产页
        description: 获取用户资产概览
      - path: /api/v1/business/get_asset_detail
        method: POST
        service: Business
        rpc: GetAssetDetail
        tag: Assets
        auth: true
        summary: 资产页-详情
        description: 获取资产详情与交易记录
      - path: /api/v1/business/get_asset_config
        method: POST
        service: Business
        rpc: GetAssetConfig
        tag: Assets
        auth: false
        summary: 获取所有资产配置
        description: 获取所有资产配置信息（包含精度、状态等）
      - path: /api/v1/business/list_transaction_records
        method: POST
        service: Business
        rpc: ListTransactionRecords
        tag: Assets
        auth: true
        summary: 资产页-交易记录
        description: 分页获取资产相关的交易记录
      - path: /api/v1/business/get_transaction_record_detail
        method: POST
        service: Business
        rpc: GetTransactionRecordDetail
        tag: Assets
        auth: true
        summary: 资产页-交易记录-详情
        description: 获取交易记录的详细信息
      - path: /api/v1/business/get_deposit_info
        method: POST
        service: Business
        rpc: GetDepositInfo
        tag: Assets
        auth: true
        summary: 资产-充值
        description: 获取可充值资产与网络信息
      - path: /api/v1/business/create_deposit
        method: POST
        service: Business
        rpc: CreateDeposit
        tag: Assets
        auth: true
        summary: CreateDeposit
      - path: /api/v1/business/list_deposit_records
        method: POST
        service: Business
        rpc: ListDepositRecords
        tag: Assets
        auth: true
        summary: 资产-充值记录
        description: 分页获取充值记录
      - path: /api/v1/business/get_deposit_detail
        method: POST
        service: Business
        rpc: GetDepositDetail
        tag: Assets
        auth: true
        summary: 资产-充值详情
        description: 获取指定充值记录详情
      - path: /api/v1/business/list_deposit_address_book
        method: POST
        service: Business
        rpc: ListDepositAddressBook
        tag: Assets
        auth: true
        summary: 资产-充值地址簿列表
        description: 获取用户充值地址簿（支持同链多地址，按链/币种统计）
      - path: /api/v1/business/create_deposit_address_book
        method: POST
        service: Business
        rpc: CreateDepositAddressBook
        tag: Assets
        auth: true
        summary: 资产-新增充值地址
        description: 为指定链生成新的充值地址（可设为默认）
      - path: /api/v1/business/get_deposit_address_book_detail
        method: POST
        service: Business
        rpc: GetDepositAddressBookDetail
        tag: Assets
        auth: true
        summary: 资产-充值地址详情
        description: 获取单个充值地址详情（含累计收款统计）
      - path: /api/v1/business/update_deposit_address_book
        method: POST
        service: Business
        rpc: UpdateDepositAddressBook
        tag: Assets
        auth: true
        summary: 资产-更新充值地址备注
        description: 更新充值地址的标签/备注
      - path: /api/v1/business/delete_deposit_address_book
        method: POST
        service: Business
        rpc: DeleteDepositAddressBook
        tag: Assets
        auth: true
        summary: 资产-删除充值地址
        description: 删除充值地址（校验是否存在待确认充值、以及同链至少保留一个地址）
      - path: /api/v1/business/set_default_deposit_address_book
        method: POST
        service: Business
        rpc: SetDefaultDepositAddressBook
        tag: Assets
        auth: true
        summary: 资产-设置默认充值地址
        description: 设置同链默认充值地址（自动取消同链其他默认）
      - path: /api/v1/business/list_deposit_address_book_deposits
        method: POST
        service: Business
        rpc: ListDepositAddressBookDeposits
        tag: Assets
        auth: true
        summary: 资产-充值地址收款记录
        description: 获取指定充值地址的充值记录列表
      - path: /api/v1/business/list_withdraw_records
        method: POST
        service: Business
        rpc: ListWithdrawRecords
        tag: Assets
        auth: true
        summary: 资产-提现记录
        description: 分页获取提现记录
      - path: /api/v1/business/list_action_assets
        method: POST
        service: Business
        rpc: ListActionAssets
        tag: Assets
        auth: true
        summary: 资产页-币种列表
        description: 获取充值/提现相关资产列表
      - path: /api/v1/business/list_action_networks
        method: POST
        service: Business
        rpc: ListActionNetworks
        tag: Assets
        auth: true
        summary: 资产页-网络列表
        description: 获取指定资产的可用网络及费用
      - path: /api/v1/business/get_asset_withdraw_fee_config
        method: POST
        service: Business
        rpc: GetAssetWithdrawFeeConfig
        tag: Assets
        auth: true
        summary: 资产页-获取指定代币的可提现区间金额
        description: 获取指定代币的可提现区间金额（包含最小值、最大值）
      - path: /api/v1/business/get_exchange_rate
        method: POST
        service: Business
        rpc: GetExchangeRate
        tag: Assets
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: 资产页-汇率查询
        description: 查询两个币种之间的实时汇率（从 market 服务获取价格数据）
      - path: /api/v1/business/list_fiat_rates
        method: POST
        service: Business
        rpc: ListFiatRates
        tag: Assets
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: 资产页-法币汇率列表
        description: 查询 1 USDT = n 法币汇率列表（支持传入多个法币过滤；未命中返回 missing 列表）
      - path: /api/v1/business/get_withdraw_info
        method: POST
        service: Business
        rpc: GetWithdrawInfo
        tag: Assets
        auth: true
        summary: 资产页-提币
        description: 获取可提现资产与网络信息
      - path: /api/v1/business/estimate_withdraw_fee
        method: POST
        service: Business
        rpc: EstimateWithdrawFee
        tag: Assets
        auth: true
        summary: Web2 提币手续费预估
        description: 仅按后端提币手续费规则（fixed/percent）预估手续费，不构建链上交易，不使用 Web3 gas 接口
      - path: /api/v1/business/calc_withdraw_fee
        method: POST
        service: Business
        rpc: CalcWithdrawFee
        tag: Assets
        auth: true
        summary: Web2 提币手续费计算
        description: 校验资产/网络/余额后按后端规则计算手续费，返回 fee/min_withdraw_amount/required_amount
      - path: /api/v1/business/create_withdraw
        method: POST
        service: Business
        rpc: CreateWithdraw
        tag: Assets
        auth: true
        summary: 资产页-提币
        description: 创建提现请求
      - path: /api/v1/business/get_withdraw_audit_status
        method: POST
        service: Business
        rpc: GetWithdrawAuditStatus
        tag: Assets
        auth: true
        summary: 资产页-提币审核状态
        description: 查询提现审核状态
      - path: /api/v1/business/get_withdraw_detail
        method: POST
        service: Business
        rpc: GetWithdrawDetail
        tag: Assets
        auth: true
        summary: 资产页-提现详情
        description: 获取提现记录详情
      - path: /api/v1/business/list_notifications
        method: POST
        service: Business
        rpc: ListNotifications
        tag: Notifications
        auth: true
        summary: 资产页-消息通知
        description: 获取通知列表
      - path: /api/v1/business/mark_notification_read
        method: POST
        service: Business
        rpc: MarkNotificationRead
        tag: Notifications
        auth: true
        summary: 资产页-消息通知
        description: 标记单条通知为已读
      - path: /api/v1/business/mark_all_notifications_read
        method: POST
        service: Business
        rpc: MarkAllNotificationsRead
        tag: Notifications
        auth: true
        summary: 资产页-消息通知
        description: 标记所有通知为已读
      - path: /api/v1/business/delete_notification
        method: POST
        service: Business
        rpc: DeleteNotification
        tag: Notifications
        auth: true
        summary: 资产页-消息通知
        description: 删除单条通知
      - path: /api/v1/business/clear_all_notifications
        method: POST
        service: Business
        rpc: ClearAllNotifications
        tag: Notifications
        auth: true
        summary: 资产页-消息通知
        description: 清空所有通知
      - path: /api/v1/business/register_device
        method: POST
        service: Business
        rpc: RegisterDevice
        tag: Notifications
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 设备注册（Web3用户）
        description: 注册设备，绑定设备ID和极光registration_id，用于推送通知
      - path: /api/v1/business/send_push_notification_by_alias
        method: POST
        service: Business
        rpc: SendPushNotificationByAlias
        tag: Notifications
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: 通过别名批量推送通知
        description: 通过别名（user_id或设备ID）批量发送推送通知，最多支持1000个别名
      - path: /api/v1/business/send_push_notification_by_device_token
        method: POST
        service: Business
        rpc: SendPushNotificationByDeviceToken
        tag: Notifications
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: 推送通知（Web3用户）
        description: 通过设备ID发送推送通知，用于Web3用户场景
      - path: /api/v1/business/get_user_info
        method: POST
        service: Business
        rpc: GetUserInfo
        tag: Me
        auth: true
        summary: 我的页-资料
        description: 获取个人资料
      - path: /api/v1/business/update_user_info
        method: POST
        service: Business
        rpc: UpdateUserInfo
        tag: Me
        auth: true
        summary: 我的页-资料
        description: 更新个人资料
      - path: /api/v1/business/bind_email
        method: POST
        service: Business
        rpc: BindEmail
        tag: Settings
        auth: true
        summary: 我的页-邮箱
        description: 绑定邮箱
      - path: /api/v1/business/change_email
        method: POST
        service: Business
        rpc: ChangeEmail
        tag: Settings
        auth: true
        summary: 我的页-邮箱
        description: 更换邮箱
      - path: /api/v1/business/bind_phone
        method: POST
        service: Business
        rpc: BindPhone
        tag: Settings
        auth: true
        summary: 我的页-手机号
        description: 绑定手机号
      - path: /api/v1/business/change_phone
        method: POST
        service: Business
        rpc: ChangePhone
        tag: Settings
        auth: true
        summary: 我的页-手机号
        description: 更换手机号
      - path: /api/v1/business/list_wallet_providers
        method: POST
        service: Business
        rpc: ListWalletProviders
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 列出支持的钱包提供方
      - path: /api/v1/business/list_provider_accounts
        method: POST
        service: Business
        rpc: ListProviderAccounts
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 列出第三方钱包账号
      - path: /api/v1/business/link_wallet_account
        method: POST
        service: Business
        rpc: LinkWalletAccount
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 绑定并关联第三方钱包账号
      - path: /api/v1/business/unlink_wallet_account
        method: POST
        service: Business
        rpc: UnlinkWalletAccount
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 解除关联第三方钱包账号
      - path: /api/v1/business/set_primary_linked_wallet
        method: POST
        service: Business
        rpc: SetPrimaryLinkedWallet
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 设置主关联钱包账号
      - path: /api/v1/business/get_linked_wallet_accounts
        method: POST
        service: Business
        rpc: GetLinkedWalletAccounts
        tag: LinkedWallets
        auth: true
        summary: 我的页-关联钱包
        description: 获取已关联的钱包账号列表
      - path: /api/v1/business/change_password
        method: POST
        service: Business
        rpc: ChangePassword
        tag: Settings
        auth: true
        summary: 我的页-登录密码
        description: 修改登录密码
      - path: /api/v1/business/set_trade_password
        method: POST
        service: Business
        rpc: SetTradePassword
        tag: Settings
        auth: true
        summary: 我的页-交易密码
        description: 设置资金交易密码
      - path: /api/v1/business/reset_trade_password
        method: POST
        service: Business
        rpc: ResetTradePassword
        tag: Settings
        auth: true
        summary: 我的页-交易密码
        description: 重置资金交易密码
      - path: /api/v1/business/verify_trade_password
        method: POST
        service: Business
        rpc: VerifyTradePassword
        tag: Settings
        auth: true
        summary: 我的页-交易密码
        description: 验证资金交易密码
      - path: /api/v1/business/set_web3_trade_password
        method: POST
        service: Business
        rpc: SetWeb3TradePassword
        tag: Settings
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3用户-设置交易密码
        description: Web3用户设置交易密码（基于device_id）
      - path: /api/v1/business/verify_web3_trade_password
        method: POST
        service: Business
        rpc: VerifyWeb3TradePassword
        tag: Settings
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: Web3用户-验证交易密码
        description: Web3用户验证交易密码（用于swap等敏感操作前验证）
      - path: /api/v1/business/update_web3_trade_password
        method: POST
        service: Business
        rpc: UpdateWeb3TradePassword
        tag: Settings
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3用户-修改交易密码
        description: Web3用户修改交易密码（需要验证旧密码）
      - path: /api/v1/business/register_biometric_key
        method: POST
        service: Business
        rpc: RegisterBiometricKey
        tag: Settings
        auth: true
        rate_limit: 20
        rate_limit_type: ip
        summary: 我的页-生物识别
        description: 注册/更新生物识别公钥（需要交易密码校验）
      - path: /api/v1/business/create_withdraw_biometric_challenge
        method: POST
        service: Business
        rpc: CreateWithdrawBiometricChallenge
        tag: Settings
        auth: true
        rate_limit: 30
        rate_limit_type: ip
        summary: 我的页-生物识别
        description: 创建提币生物识别挑战（用于签名）
      - path: /api/v1/business/create_withdraw_audit_whitelist_binding_biometric_challenge
        method: POST
        service: Business
        rpc: CreateWithdrawAuditWhitelistBindingBiometricChallenge
        tag: Settings
        auth: true
        rate_limit: 30
        rate_limit_type: ip
        summary: 我的页-生物识别
        description: 创建提现免审白名单绑定生物识别挑战（用于签名）
      - path: /api/v1/business/create_reset_trade_password_biometric_challenge
        method: POST
        service: Business
        rpc: CreateResetTradePasswordBiometricChallenge
        tag: Settings
        auth: true
        rate_limit: 30
        rate_limit_type: ip
        summary: 我的页-生物识别
        description: 创建重置交易密码生物识别挑战（用于签名）
      - path: /api/v1/business/unbind_biometric
        method: POST
        service: Business
        rpc: UnbindBiometric
        tag: Settings
        auth: true
        rate_limit: 10
        rate_limit_type: user
        summary: 我的页-生物识别
        description: 解绑当前用户生物识别（仅交易密码）
      - path: /api/v1/business/get_google_auth_setup
        method: POST
        service: Business
        rpc: GetGoogleAuthSetup
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 获取 Google 验证器设置信息（生成 secret 和 QR 码）
      - path: /api/v1/business/bind_google_auth
        method: POST
        service: Business
        rpc: BindGoogleAuth
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 绑定谷歌验证器
      - path: /api/v1/business/unbind_google_auth
        method: POST
        service: Business
        rpc: UnbindGoogleAuth
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 解绑谷歌验证器
      - path: /api/v1/business/disable_google_auth_2fa
        method: POST
        service: Business
        rpc: DisableGoogleAuth2FA
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 关闭双重认证（不解绑谷歌验证器）
      - path: /api/v1/business/enable_google_auth_2fa
        method: POST
        service: Business
        rpc: EnableGoogleAuth2FA
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 开启双重认证（已绑定GA，传验证码开启）
      - path: /api/v1/business/disable_google_auth_2fa_with_code
        method: POST
        service: Business
        rpc: DisableGoogleAuth2FAWithCode
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 关闭双重认证（已绑定GA，传验证码关闭）
      - path: /api/v1/business/verify_google_auth_code
        method: POST
        service: Business
        rpc: VerifyGoogleAuthCode
        tag: Settings
        auth: true
        summary: 我的页-双重认证
        description: 校验Google验证器验证码（仅校验，不做任何状态修改）
      - path: /api/v1/business/list_login_records
        method: POST
        service: Business
        rpc: ListLoginRecords
        tag: Settings
        auth: true
        summary: 我的页-使用设置－登录记录
        description: 获取登录记录列表
      - path: /api/v1/business/list_wallet_addresses
        method: POST
        service: Business
        rpc: ListWalletAddresses
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 获取钱包地址列表
      - path: /api/v1/business/add_wallet_address
        method: POST
        service: Business
        rpc: AddWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 添加钱包地址
      - path: /api/v1/business/update_wallet_address
        method: POST
        service: Business
        rpc: UpdateWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 更新钱包地址
      - path: /api/v1/business/delete_wallet_address
        method: POST
        service: Business
        rpc: DeleteWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 删除钱包地址
      - path: /api/v1/business/set_default_wallet_address
        method: POST
        service: Business
        rpc: SetDefaultWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 设置默认钱包地址
      - path: /api/v1/business/validate_wallet_address
        method: POST
        service: Business
        rpc: ValidateWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－钱包地址
        description: 验证钱包地址有效性
      # 内部地址（通过UID/邮箱添加平台内用户）
      - path: /api/v1/business/list_internal_wallet_addresses
        method: POST
        service: Business
        rpc: ListInternalWalletAddresses
        tag: Settings
        auth: true
        summary: 我的页-使用设置－内部地址列表
        description: 获取内部地址列表（通过UID/邮箱添加的平台内用户）
      - path: /api/v1/business/add_internal_wallet_address
        method: POST
        service: Business
        rpc: AddInternalWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－添加内部地址
        description: 通过UID或邮箱添加平台内部用户地址
      - path: /api/v1/business/update_internal_wallet_address
        method: POST
        service: Business
        rpc: UpdateInternalWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－更新内部地址
        description: 更新内部地址标签/备注
      - path: /api/v1/business/delete_internal_wallet_address
        method: POST
        service: Business
        rpc: DeleteInternalWalletAddress
        tag: Settings
        auth: true
        summary: 我的页-使用设置－删除内部地址
        description: 删除内部地址
      - path: /api/v1/business/lookup_internal_user
        method: POST
        service: Business
        rpc: LookupInternalUser
        tag: Settings
        auth: true
        summary: 我的页-使用设置－查找内部用户
        description: 通过UID或邮箱查找平台内部用户（添加前预览）
      # 内部转账（用户之间的资产转移，支持审核）
      - path: /api/v1/business/validate_internal_transfer_target
        method: POST
        service: Business
        rpc: ValidateInternalTransferTarget
        tag: InternalTransfer
        auth: true
        summary: 校验内部转账目标用户
        description: 校验内部转账目标用户是否存在（支持 UID 和邮箱）
      - path: /api/v1/business/submit_internal_transfer
        method: POST
        service: Business
        rpc: SubmitInternalTransfer
        tag: InternalTransfer
        auth: true
        summary: 提交内部转账
        description: 提交内部转账请求（用户之间的资产转移，根据审核规则可能需要人工审核）
      - path: /api/v1/business/cancel_internal_transfer
        method: POST
        service: Business
        rpc: CancelInternalTransfer
        tag: InternalTransfer
        auth: true
        summary: 取消内部转账
        description: 取消待审核状态的内部转账订单
      - path: /api/v1/business/list_withdraw_audit_whitelist_bindable_networks
        method: POST
        service: Business
        rpc: ListWithdrawAuditWhitelistBindableNetworks
        tag: WithdrawAuditWhitelist
        auth: true
        summary: 提现免审白名单-可绑定网络
        description: 获取用户自绑定提现免审白名单支持的网络列表（数据源同提现）
      - path: /api/v1/business/set_my_withdraw_audit_whitelist_binding
        method: POST
        service: Business
        rpc: SetMyWithdrawAuditWhitelistBinding
        tag: WithdrawAuditWhitelist
        auth: true
        summary: 提现免审白名单-自绑定
        description: 用户自绑定/解绑提现免审白名单地址（同一资产+链仅保留一条）
      - path: /api/v1/business/get_my_withdraw_audit_whitelist_binding_status
        method: POST
        service: Business
        rpc: GetMyWithdrawAuditWhitelistBindingStatus
        tag: WithdrawAuditWhitelist
        auth: true
        summary: 提现免审白名单-绑定状态
        description: 获取当前登录用户的提现免审白名单自绑定状态
      - path: /api/v1/business/unbind_my_withdraw_audit_whitelist_bindings
        method: POST
        service: Business
        rpc: UnbindMyWithdrawAuditWhitelistBindings
        tag: WithdrawAuditWhitelist
        auth: true
        summary: 提现免审白名单-解绑全部
        description: 解绑当前登录用户的全部提现免审白名单自绑定数据
      - path: /api/v1/business/get_preferences
        method: POST
        service: Business
        rpc: GetPreferences
        tag: Settings
        auth: true
        summary: 我的页-偏好设置
        description: 获取用户偏好设置
      - path: /api/v1/business/set_preferences
        method: POST
        service: Business
        rpc: SetPreferences
        tag: Settings
        auth: true
        summary: 我的页-偏好设置
        description: 设置用户偏好
      - path: /api/v1/business/get_client_config
        method: POST
        service: Business
        rpc: GetClientConfig
        tag: Settings
        auth: false
        summary: 获取客户端配置
        description: 获取客户端配置（如is_show开关等）
      - path: /api/v1/business/list_language_options
        method: POST
        service: Business
        rpc: ListLanguageOptions
        tag: Settings
        auth: false
        summary: 我的页-偏好设置
        description: 获取语言可选项
      - path: /api/v1/business/list_price_unit_options
        method: POST
        service: Business
        rpc: ListPriceUnitOptions
        tag: Settings
        auth: false

      # ==================== Web3 Swap (Business -> Swap Microservice) ====================
      # 注意：这些接口不需要JWT认证，用户可以直接访问（仅依赖IP限流）
      - path: /api/v1/business/swap/get_quote
        method: POST
        service: Business
        rpc: SwapGetQuote
        tag: Swap
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: Web3 Swap - 获取报价
        description: 通过 swap 微服务（OKX）获取兑换报价
      - path: /api/v1/business/swap/execute_swap
        method: POST
        service: Business
        rpc: SwapExecuteSwap
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 构建交易
        description: 通过 swap 微服务构建未签名交易（含可选 approve 交易）
      - path: /api/v1/business/swap/get_approval_transaction
        method: POST
        service: Business
        rpc: SwapGetApprovalTransaction
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 获取授权交易
        description: 获取未签名的代币授权交易（支持重置授权、无限授权、指定额度授权）
      - path: /api/v1/business/swap/reset_approval
        method: POST
        service: Business
        rpc: SwapResetApproval
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 重置代币授权（广播）
        description: 广播已签名的重置授权交易到区块链
      - path: /api/v1/business/swap/get_status
        method: POST
        service: Business
        rpc: SwapGetSwapStatus
        tag: Swap
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: Web3 Swap - 查询状态
        description: 通过 swap 微服务按 tx_hash 查询链上确认状态（可选绑定 swap_id）
      - path: /api/v1/business/swap/get_detail
        method: POST
        service: Business
        rpc: SwapGetSwapDetail
        tag: Swap
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: Web3 Swap - 查询详情
        description: 从 swap_svc_transactions 按 tx_hash（可选 chain_id）查询交易详情
      - path: /api/v1/business/swap/get_history
        method: POST
        service: Business
        rpc: SwapGetSwapHistory
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 历史记录
        description: 通过 swap 微服务查询指定钱包地址的 swap 历史
      - path: /api/v1/business/swap/get_external_status
        method: POST
        service: Business
        rpc: SwapGetExternalSwapStatus
        tag: Swap
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: Web3 Swap - 查询外部交易状态
        description: 通过 OKX DEX API 查询链上交易历史详情（包含 token details, gas, dex router 等详细信息）
      - path: /api/v1/business/swap/get_supported_tokens
        method: POST
        service: Business
        rpc: SwapGetSupportedTokens
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 支持的 Token
        description: 通过 swap 微服务获取指定链支持的 token 列表（带缓存）
      - path: /api/v1/business/swap/get_supported_chains
        method: POST
        service: Business
        rpc: SwapGetSupportedChains
        tag: Swap
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: Web3 Swap - 支持的链
        description: 通过 swap 微服务获取支持的链列表

      # ==================== Web3 Wallet (自托管钱包) ====================
      # Web3 用户无需传统认证，仅通过 device_id 识别
      - path: /api/v1/business/web3/user/create
        method: POST
        service: Business
        rpc: CreateWeb3User
        tag: Web3Wallet
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: 创建 Web3 用户
        description: 基于设备 ID 创建 Web3 自托管钱包用户，用于链上交易记录追踪

      - path: /api/v1/business/web3/user/address/add
        method: POST
        service: Business
        rpc: BatchAddWeb3UserAddress
        tag: Web3Wallet
        auth: false
        rate_limit: 10
        rate_limit_type: ip
        summary: 批量添加 Web3 用户地址
        description: 为 Web3 用户批量添加钱包地址（一次添加多条链的地址，最多10个）

      - path: /api/v1/business/web3/chains
        method: GET
        service: Business
        rpc: ListWeb3Chains
        tag: Web3Wallet
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 获取 Web3 可用链列表
        description: 返回 Web3 可用链列表（无需鉴权）

      - path: /api/v1/business/web3/user/info
        method: POST
        service: Business
        rpc: GetWeb3UserByDeviceId
        tag: Web3Wallet
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 获取 Web3 用户信息
        description: 根据 device_id 获取 Web3 用户信息（设备信息、安全设置等）

      - path: /api/v1/business/web3/assets/overview
        method: POST
        service: Business
        rpc: GetWeb3AssetOverview
        tag: Web3Wallet
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 获取 Web3 用户资产概览
        description: 获取 Web3 用户的资产列表和总估值（包含多链多地址）

      - path: /api/v1/business/web3/transactions/list
        method: POST
        service: Business
        rpc: ListWeb3Transactions
        tag: Web3Wallet
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: 获取 Web3 交易记录列表
        description: 获取 Web3 用户的链上交易记录，支持按资产、类型、时间筛选和分页

      - path: /api/v1/business/web3/transactions/detail
        method: POST
        service: Business
        rpc: GetWeb3TransactionDetail
        tag: Web3Wallet
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: 获取 Web3 交易详情
        description: 根据交易哈希获取链上交易的完整详情（包含地址标签、确认数、区块浏览器链接等）

      - path: /api/v1/business/get_web3_transaction_result
        method: POST
        service: Business
        rpc: GetWeb3TransactionResult
        tag: Web3Wallet
        auth: false
        rate_limit: 30
        rate_limit_type: ip
        summary: Web3 交易结果查询
        description: 根据交易哈希查询 Web3 交易结果（状态、确认数等）。优先从数据库查询，如果数据库没有且提供了 network 参数，则实时查询链上状态

      - path: /api/v1/business/web3/assets/supported
        method: POST
        service: Business
        rpc: ListWeb3SupportedAssets
        tag: Web3Wallet
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 获取 Web3 支持的资产列表
        description: 根据链代码获取该链支持的资产列表（包含合约地址、图标、充值提现配置等）

      - path: /api/v1/business/web3/transaction/broadcast
        method: POST
        service: Business
        rpc: BroadcastWeb3Transaction
        tag: Web3Wallet
        auth: false
        rate_limit: 50
        rate_limit_type: ip
        summary: 广播 Web3 交易
        description: Web3 用户广播已签名的交易（自动记录到交易记录表）

      - path: /api/v1/business/web3/nonce
        method: POST
        service: Business
        rpc: GetWeb3Nonce
        tag: Web3Wallet
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        summary: 获取 Web3 地址的 Nonce
        description: 获取 Web3 用户地址的 Nonce 值（用于构建 EVM 交易）。返回已确认的 nonce 和 pending nonce（推荐使用 pending nonce 以包含待确认交易）

      - path: /api/v1/business/web3/tron/build-transaction
        method: POST
        service: Business
        rpc: BuildTronTransaction
        tag: Web3Wallet
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        summary: 构建 TRON 交易
        description: 构建 TRON 交易（支持 TRX 主币转账和 TRC20 代币转账），返回未签名的 rawData（hex编码的protobuf序列化数据），供客户端签名后广播。contract_address 为空时为 TRX 转账，有值时为 TRC20 代币转账

      - path: /api/v1/business/web3/token/detail
        method: POST
        service: Business
        rpc: GetWeb3TokenDetail
        tag: Web3Wallet
        auth: false
        rate_limit: 20
        rate_limit_type: ip
        summary: 获取 Web3 代币详细信息
        description: 获取 Web3 代币的详细信息，包括价格、基本信息（合约地址、网络、铸造时间、发行地址）和概览（总供应量、流通供应量、总市值、流通市值、持有者数量）。主币的 contract_address 可为空，代币必须提供合约地址。

  # ==================== ChainRPC Service - 链操作服务 ====================
  chainrpc:
    tag_descriptions:
      ChainTransaction: 链上交易构建与广播
      ChainGas: Gas 费用估算与价格查询
      ChainQuery: 链上数据查询（余额、交易状态、区块等）
    routes:
      # ---------- Gas 价格查询 ----------
      - path: /api/v1/chain/gas/price
        method: POST
        service: ChainRPC
        rpc: GetGasPrice
        tag: ChainGas
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        summary: 获取分级 Gas 价格
        description: 获取不同速度级别的 Gas 价格（慢/标准/快/极速），包含预估确认时间和 Gwei 价格。适用于 Swap 交易设置等场景（ETH/BSC）

      # ---------- Gas 估算 ----------
      - path: /api/v1/chain/gas/estimate
        method: POST
        service: ChainRPC
        rpc: EstimateGas
        tag: ChainGas
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        summary: 估算交易 Gas Limit
        description: 估算单笔交易的 Gas Limit 和当前费用（适用于后台系统和精确计算场景，不推荐移动端使用）

      # ---------- TRON 手续费/资源 ----------
      - path: /api/v1/chain/tron/estimate-fee
        method: POST
        service: ChainRPC
        rpc: EstimateTronFee
        tag: ChainGas
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        summary: 估算 TRON 手续费
        description: Estimate TRON transaction fee (bandwidth + energy + activation)

      - path: /api/v1/chain/tron/account-resources/{address}
        method: GET
        service: ChainRPC
        rpc: GetTronAccountResources
        tag: ChainQuery
        auth: false
        rate_limit: 100
        rate_limit_type: ip
        path_params: ["address"]
        summary: 查询 TRON 地址资源
        description: Query TRON address resources (bandwidth, energy, balance)
