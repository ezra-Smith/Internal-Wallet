# ============================================================================
# 自定义端点 - 无法通过标准 RPC 路由的接口（如文件上传）
# ============================================================================
custom_endpoints:
  business:
    # 用户头像上传
    - path: /api/v1/business/upload_avatar
      method: POST
      tag: Me
      summary: 我的页-头像上传
      description: 上传用户头像到 S3，返回公开访问 URL
      consumes: [multipart/form-data]
      produces: [application/json]
      parameters:
        - {name: file, in: formData, description: "头像文件（PNG、JPG、GIF、WEBP，最大 2MB）", required: true, type: file}
      responses:
        "200":
          description: 上传成功
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              message: {type: string}
              data:
                type: object
                properties:
                  avatar_url: {type: string, description: 头像的公开访问 URL}
              request_id: {type: string}
              timestamp: {type: string}
        "400":
          description: 文件类型不支持或文件过大
          schema: {$ref: "#/definitions/ErrorResponse"}
        "401":
          description: 未授权
          schema: {$ref: "#/definitions/ErrorResponse"}
  admin:
    # 批量转账导入
    - path: /api/v1/admin/transfer/import
      method: POST
      tag: Transfers
      summary: 批量转账导入
      description: 上传 Excel/CSV 文件批量导入转账记录，创建转账批次
      consumes: [multipart/form-data]
      produces: [application/json]
      parameters:
        - name: file
          in: formData
          description: Excel 或 CSV 文件（最大 5MB）
          required: true
          type: file
        - name: name
          in: formData
          description: 批次名称
          required: false
          type: string
        - name: network
          in: formData
          description: 网络标识（如 ETH、BSC）
          required: false
          type: string
        - name: currency
          in: formData
          description: 币种代码（如 USDT、ETH）
          required: false
          type: string
        - name: description
          in: formData
          description: 批次描述
          required: false
          type: string
        - name: transfer_type
          in: formData
          description: 转账类型
          required: false
          type: string
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer, format: int32}
              message: {type: string}
              data:
                type: object
                properties:
                  batch_id: {type: string, description: 批次ID}
                  total_count: {type: integer, format: int32, description: 总记录数}
                  valid_count: {type: integer, format: int32, description: 有效记录数}
                  invalid_count: {type: integer, format: int32, description: 无效记录数}
              request_id: {type: string}
              timestamp: {type: string, format: date-time}
        "400":
          description: 请求参数错误
          schema: {$ref: "#/definitions/ErrorResponse"}
        "401":
          description: 未授权
          schema: {$ref: "#/definitions/ErrorResponse"}

    # 批量转账导入预览
    - path: /api/v1/admin/transfer/import/preview
      method: POST
      tag: Transfers
      summary: 批量转账导入预览
      description: 上传文件并预览导入结果，不实际创建批次
      consumes: [multipart/form-data]
      produces: [application/json]
      parameters:
        - {name: file, in: formData, description: "Excel 或 CSV 文件（最大 5MB）", required: true, type: file}
        - {name: name, in: formData, type: string}
        - {name: network, in: formData, type: string}
        - {name: currency, in: formData, type: string}
        - {name: description, in: formData, type: string}
        - {name: transfer_type, in: formData, type: string}
      responses:
        "200":
          description: 成功响应
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              message: {type: string}
              data:
                type: object
                properties:
                  total_count: {type: integer}
                  valid_count: {type: integer}
                  invalid_count: {type: integer}
                  preview_items:
                    type: array
                    items:
                      type: object
                      properties:
                        row: {type: integer}
                        address: {type: string}
                        amount: {type: string}
                        status: {type: string}
                        error: {type: string}
              request_id: {type: string}
              timestamp: {type: string, format: date-time}

    # 货币图标上传
    - path: /api/v1/admin/currencies/icon/upload
      method: POST
      tag: Assets
      summary: 货币图标上传
      description: 上传货币图标到 S3，返回公开访问 URL
      consumes: [multipart/form-data]
      produces: [application/json]
      parameters:
        - {name: file, in: formData, description: "图标文件（PNG、JPG、GIF、WEBP，最大 2MB）", required: true, type: file}
        - {name: asset_code, in: formData, description: "货币代码（如 BTC、ETH、USDT）", type: string}
      responses:
        "200":
          description: 上传成功
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              message: {type: string}
              data:
                type: object
                properties:
                  url: {type: string, description: 图标的公开访问 URL}
              request_id: {type: string}
              timestamp: {type: string}
        "400":
          description: 文件类型不支持或文件过大
          schema: {$ref: "#/definitions/ErrorResponse"}
        "403":
          description: 权限不足
          schema: {$ref: "#/definitions/ErrorResponse"}

    # 链图标上传
    - path: /api/v1/admin/chains/icon/upload
      method: POST
      tag: Assets
      summary: 链图标上传
      description: 上传区块链图标到 S3，返回公开访问 URL
      consumes: [multipart/form-data]
      produces: [application/json]
      parameters:
        - {name: file, in: formData, description: "图标文件（PNG、JPG、GIF、WEBP，最大 2MB）", required: true, type: file}
        - {name: chain_code, in: formData, description: "链代码（如 ETH、BSC、POLYGON）", type: string}
      responses:
        "200":
          description: 上传成功
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              message: {type: string}
              data:
                type: object
                properties:
                  url: {type: string, description: 图标的公开访问 URL}
              request_id: {type: string}
              timestamp: {type: string}
        "400":
          description: 文件类型不支持或文件过大
          schema: {$ref: "#/definitions/ErrorResponse"}
        "403":
          description: 权限不足
          schema: {$ref: "#/definitions/ErrorResponse"}
