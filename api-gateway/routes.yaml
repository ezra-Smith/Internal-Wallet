  # ==================== Swap Service - Swap 服务（业务端 API Key 认证） ====================
  swap:
    tag_descriptions:
      Swap: Web3 Swap（API Key 接口）
    routes:
      # 业务端接口：使用 Swap Service 的 API Key 认证（非 Admin JWT）
      - path: /api/v1/swap/my/configs
        method: GET
        service: Swap
        rpc: GetMySwapConfigs
        tag: Swap
        auth: false  # 使用 Swap Service 的 API Key 认证（非 Admin JWT）
        rate_limit: 20
        rate_limit_type: ip
        summary: 查询我的Swap配置
        description: 业务端查询自己项目的生效Swap配置（从API Key自动获取项目名称）

  # ==================== Admin Service - 后台管理服务 ====================
  admin:
    tag_descriptions:
      Auth: 登录、令牌、验证码与2FA
      Admins: 后台管理员账号管理
      Users: Web2 用户管理
      RBAC: RBAC 菜单、角色、权限与授权
      Settings: 系统与账号设置
      Wallet: 热钱包初始化与 Signer 解锁
      Audit: 审计日志查询
      Swap: 闪兑配置与管理
      Assets: 钱包资产与配置
      Accounting: 记账/账户类型/余额
      Deposits: 充值记录管理
      Withdrawals: 提现记录管理
      Transfers: 批量转账批次管理
      InternalTransfers: 内部转账审核管理
      Web3Users: Web3 用户与地址管理
      SubAddresses: 子地址/派生地址与余额管理
      SweepTasks: 地址余额归集任务管理
      Consolidation: 归集（Consolidation）任务/日志/补给/能量租赁
      Blacklist: 链上敏感地址黑名单管理
      Vault: Vault 资金管理
      Dashboard: 仪表板统计数据
      Alert: 预警配置管理
    routes:
      # ---------- Dashboard ----------
      - path: /api/v1/admin/dashboard/overview
        method: GET
        service: Admin
        rpc: GetDashboardOverview
        tag: Dashboard
        auth: true
        summary: 获取仪表板核心概览数据
        description: 获取用户统计、金库余额、转账概览、审批统计等快速统计数据
      - path: /api/v1/admin/dashboard/trends
        method: GET
        service: Admin
        rpc: GetDashboardTrends
        tag: Dashboard
        auth: true
        summary: 获取仪表板趋势图表数据
        description: 获取资金流水趋势、转账批次趋势、审批分布、Vault币种余额Top 5
        query_params:
          - fund_flow_months
          - transfer_days
      - path: /api/v1/admin/dashboard/activities
        method: GET
        service: Admin
        rpc: GetDashboardActivities
        tag: Dashboard
        auth: true
        summary: 获取最近操作动态
        description: 获取转账批次、提现审批、用户注册、Vault调整等最近操作记录
        query_params:
