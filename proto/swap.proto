syntax = "proto3";

package swap;

option go_package = "./pb";

// ============================================================================
// Swap Service (Standalone, API-key authenticated)
// Phase 1: 1inch only (provider-extensible design)
// ============================================================================

service Swap {
  // ==================== Swap APIs ====================
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
  rpc ExecuteSwap(ExecuteSwapRequest) returns (ExecuteSwapResponse);
  rpc GetApprovalTransaction(GetApprovalTransactionRequest) returns (GetApprovalTransactionResponse);
  rpc ResetApproval(ResetApprovalRequest) returns (ResetApprovalResponse);
  rpc GetSwapStatus(GetSwapStatusRequest) returns (GetSwapStatusResponse);
  rpc GetSwapHistory(GetSwapHistoryRequest) returns (GetSwapHistoryResponse);
  // GetSwapDetail returns a swap transaction record stored in swap_svc_transactions.
  rpc GetSwapDetail(GetSwapDetailRequest) returns (GetSwapDetailResponse);
  rpc GetSupportedTokens(GetSupportedTokensRequest) returns (GetSupportedTokensResponse);
  rpc GetSupportedChains(GetSupportedChainsRequest) returns (GetSupportedChainsResponse);
  rpc BroadcastSwap(BroadcastSwapRequest) returns (BroadcastSwapResponse);
  // UpdateSwapBroadcastResult updates swap_svc_transactions after an external broadcast (e.g. client broadcast via /web3/transaction/broadcast).
  rpc UpdateSwapBroadcastResult(UpdateSwapBroadcastResultRequest) returns (UpdateSwapBroadcastResultResponse);

  // ==================== OKX DEX Specific APIs ====================
  rpc GetLiquiditySources(GetLiquiditySourcesRequest) returns (GetLiquiditySourcesResponse);
  rpc GetExternalSwapStatus(GetExternalSwapStatusRequest) returns (GetExternalSwapStatusResponse);

  // ==================== API Key Management (admin-protected) ====================
  rpc CreateSwapApiKey(CreateSwapApiKeyRequest) returns (CreateSwapApiKeyResponse);
  rpc RevokeSwapApiKey(RevokeSwapApiKeyRequest) returns (RevokeSwapApiKeyResponse);
  rpc ListSwapApiKeys(ListSwapApiKeysRequest) returns (ListSwapApiKeysResponse);

  // ==================== Provider管理 (Provider Management - Admin-protected) ====================
  rpc CreateSwapProvider(SwapCreateProviderRequest) returns (SwapCreateProviderResponse);
  rpc UpdateSwapProvider(SwapUpdateProviderRequest) returns (SwapUpdateProviderResponse);
  rpc ListSwapProviders(SwapListProvidersRequest) returns (SwapListProvidersResponse);
  rpc GetSwapProviderDetail(SwapGetProviderDetailRequest) returns (SwapGetProviderDetailResponse);
  rpc DeleteSwapProvider(SwapDeleteProviderRequest) returns (SwapDeleteProviderResponse);
  rpc EnableSwapProvider(SwapEnableProviderRequest) returns (SwapEnableProviderResponse);
  rpc DisableSwapProvider(SwapDisableProviderRequest) returns (SwapDisableProviderResponse);
  rpc ListSwapProvidersForDropdown(SwapListProvidersForDropdownRequest) returns (SwapListProvidersForDropdownResponse);

  // ==================== 简化配置管理 (Simplified Config Management - Admin-protected) ====================
  // 全局配置 CRUD（扁平化：provider+chain+token一体）
  rpc ListSwapConfigs(SwapListSwapConfigsRequest) returns (SwapListSwapConfigsResponse);
  rpc GetSwapConfigDetail(SwapGetSwapConfigDetailRequest) returns (SwapGetSwapConfigDetailResponse);
  rpc CreateSwapConfig(SwapCreateSwapConfigRequest) returns (SwapCreateSwapConfigResponse);
  rpc UpdateSwapConfigDetail(SwapUpdateSwapConfigDetailRequest) returns (SwapUpdateSwapConfigDetailResponse);
  rpc DeleteSwapConfig(SwapDeleteSwapConfigRequest) returns (SwapDeleteSwapConfigResponse);

  // 项目配置管理（启用/禁用开关）
  rpc ListProjectSwapConfigs(SwapListProjectSwapConfigsRequest) returns (SwapListProjectSwapConfigsResponse);
  rpc EnableSwapConfigForProject(SwapEnableSwapConfigForProjectRequest) returns (SwapEnableSwapConfigForProjectResponse);
  rpc DisableSwapConfigForProject(SwapDisableSwapConfigForProjectRequest) returns (SwapDisableSwapConfigForProjectResponse);

  // ==================== 业务端配置查询 (Business API - API Key authenticated) ====================
  // 业务端查询自己项目的生效配置（从 API Key context 自动获取 project_name）
  rpc GetMySwapConfigs(SwapGetMySwapConfigsRequest) returns (SwapGetMySwapConfigsResponse);

  // ==================== 统计与查询 (API Key authenticated) ====================
  // DEPRECATED: GetSwapStatistics - feature removed
  // rpc GetSwapStatistics(SwapGetSwapStatisticsRequest) returns (SwapGetSwapStatisticsResponse);
  rpc ListSwapTransactions(SwapListSwapTransactionsRequest) returns (SwapListSwapTransactionsResponse);
}

// ============================================================================
// Common
// ============================================================================

// SwapPagination 分页信息
message SwapPagination {
  int32 page = 1;              // 当前页码
  int32 page_size = 2;         // 每页条数
  int64 total = 3;             // 总记录数
  int32 total_pages = 4;       // 总页数
  bool has_next = 5;           // 是否有下一页
  bool has_prev = 6;           // 是否有上一页
}

// ============================================================================
// Types
// ============================================================================

// SwapTxStatus 交易状态
enum SwapTxStatus {
  SWAP_TX_STATUS_UNSPECIFIED = 0;  // 未指定
  SWAP_TX_STATUS_CREATED = 1;      // 已创建（未签名交易）
  SWAP_TX_STATUS_PENDING = 2;      // 待确认
  SWAP_TX_STATUS_SUCCESS = 3;      // 成功
  SWAP_TX_STATUS_FAILED = 4;       // 失败
}

// ChainInfo 链信息
message ChainInfo {
  int64 chain_id = 1;                    // 链ID
  string name = 2;                       // 链名称
  bool enabled = 3;                      // 是否启用
  uint64 required_confirmations = 4;     // 所需确认数
}

// LiquiditySource 流动性来源（DEX交易所）
message LiquiditySource {
  string id = 1;      // DEX ID（例如："34" 表示 Uniswap V2）
  string name = 2;    // DEX 名称（例如："Uniswap V2"）
  string logo = 3;    // DEX 图标URL
}

// ChainSwapStatus 链上交易状态
enum ChainSwapStatus {
  CHAIN_SWAP_STATUS_UNSPECIFIED = 0;  // 未指定
  CHAIN_SWAP_STATUS_PENDING = 1;      // 待确认
  CHAIN_SWAP_STATUS_SUCCESS = 2;      // 成功
  CHAIN_SWAP_STATUS_FAILED = 3;       // 失败
}

// ChainSwapHistoryItem 链上交易历史记录
message ChainSwapHistoryItem {
  string chain_index = 1;           // 链ID（例如："1" 表示以太坊）
  string tx_hash = 2;               // 交易哈希
  string block_height = 3;          // 区块高度
  int64 tx_time = 4;                // 交易时间（Unix毫秒时间戳）
  ChainSwapStatus status = 5;       // 交易状态
  string tx_type = 6;               // 交易类型（Approve/Wrap/Unwrap/Swap）
  string from_address = 7;          // 发送地址
  string dex_router = 8;            // DEX路由合约地址
  string to_address = 9;            // 接收地址
  repeated TokenDetail from_tokens = 10;   // 源代币详情
  repeated TokenDetail to_tokens = 11;     // 目标代币详情
  string referral_amount = 12;      // 推荐奖励金额
  string error_msg = 13;            // 错误信息（失败时）
  string gas_limit = 14;            // Gas 上限
  string gas_used = 15;             // 实际使用 Gas
  string gas_price = 16;            // Gas 价格
  string tx_fee = 17;               // 交易手续费
}

// TokenDetail 代币详情
message TokenDetail {
  string symbol = 1;                // 代币符号
  string amount = 2;                // 代币数量（最小单位，如 wei）
  string token_address = 3;         // 代币合约地址
}

// SwapTokenInfo 代币信息
message SwapTokenInfo {
  string address = 1;    // 代币合约地址
  string symbol = 2;     // 代币符号
  string name = 3;       // 代币名称
  uint32 decimals = 4;   // 代币精度
  string logo_uri = 5;   // 代币图标URI
  string min_swap_amount_usd = 6;   // 最小兑换金额（USD）
  string max_swap_amount_usd = 7;   // 最大兑换金额（USD）
}

// UnsignedTransaction 未签名交易
message UnsignedTransaction {
  int64 chain_id = 1;      // 链ID
  string from = 2;         // 发送地址
  string to = 3;           // 接收地址
  string data = 4;         // 交易数据（十六进制字符串，0x...）
  string value = 5;        // 转账金额（wei，十进制字符串）
  string gas = 6;          // Gas 限制（wei，十进制字符串，可选）
  string gas_price = 7;    // Gas 价格（wei，十进制字符串，可选）
}

// ============================================================================
// Swap APIs
// ============================================================================

// GetQuoteRequest 获取报价请求
message GetQuoteRequest {
  int64 chain_id = 1;                 // 链ID
  string from_token_address = 2;      // 源代币合约地址
  string to_token_address = 3;        // 目标代币合约地址
  string amount = 4;                  // 兑换数量（最小单位 wei，十进制字符串）
  bool include_protocols = 5;         // 是否包含协议路由信息（尽力而为）
}

// QuoteData 报价数据
message QuoteData {
  int64 chain_id = 1;              // 链ID
  SwapTokenInfo from_token = 2;    // 源代币信息
  SwapTokenInfo to_token = 3;      // 目标代币信息
  string from_amount = 4;          // 源代币数量（wei，十进制字符串）
  string to_amount = 5;            // 目标代币数量（wei，十进制字符串）
  uint64 estimated_gas = 6;        // 预估 Gas
  string provider = 7;             // 服务提供商（例如 "1inch"）
  string trade_fee = 8;            // DEX 交易手续费（USD 计价，例如 "0.5"）
  string price_impact = 9;         // 价格冲击百分比（例如 "0.5" 表示 0.5%）
}

// GetQuoteResponse 获取报价响应
message GetQuoteResponse {
  bool success = 1;      // 是否成功
  string message = 2;    // 响应消息
  QuoteData data = 3;    // 报价数据
}

// ExecuteSwapRequest 执行兑换请求
message ExecuteSwapRequest {
  int64 chain_id = 1;                 // 链ID
  string wallet_address = 2;          // 钱包地址（EVM地址，0x...）
  string from_token_address = 3;      // 源代币合约地址
  string to_token_address = 4;        // 目标代币合约地址
  string amount = 5;                  // 兑换数量（最小单位 wei，十进制字符串）
  int32 slippage_bps = 6;             // 滑点容差（1 = 0.01%，100 = 1%）
  string recipient = 7;               // 接收地址（可选，默认为 wallet_address）
  bool check_allowance = 8;           // 是否检查授权额度并在需要时返回授权交易
  bool include_approve_tx = 9;        // 是否在需要时包含授权交易
  uint64 estimated_gas = 10;          // 预估 gas（询价时返回，用于执行 swap 时设置 gasLimit）
}

// ExecuteSwapData 执行兑换数据
message ExecuteSwapData {
  string swap_id = 1;                 // 内部跟踪ID
  string provider = 2;                // 服务提供商（例如 "1inch"）
  QuoteData quote = 3;                // 使用的报价快照（尽力而为）
  UnsignedTransaction approve_tx = 4; // 授权交易（可选，ERC20授权）
  UnsignedTransaction swap_tx = 5;    // 兑换交易
}

// ExecuteSwapResponse 执行兑换响应
message ExecuteSwapResponse {
  bool success = 1;         // 是否成功
  string message = 2;       // 响应消息
  ExecuteSwapData data = 3; // 兑换数据
}

// GetApprovalTransactionRequest 获取授权交易请求
message GetApprovalTransactionRequest {
  int64 chain_id = 1;                 // 链ID
  string wallet_address = 2;          // 钱包地址
  string token_address = 3;           // 代币合约地址（需要授权的代币）
  string amount = 4;                  // 授权额度（"0"表示重置授权，不填或"max"表示无限授权，其他值表示具体授权额度）
}

// GetApprovalTransactionResponse 获取授权交易响应
message GetApprovalTransactionResponse {
  bool success = 1;                   // 是否成功
  string message = 2;                 // 响应消息
  UnsignedTransaction tx = 3;         // 未签名的授权交易
}

// ResetApprovalRequest 重置授权请求（广播签名后的重置授权交易）
message ResetApprovalRequest {
  int64 chain_id = 1;                 // 链ID
  string wallet_address = 2;          // 钱包地址
  string token_address = 3;           // 代币合约地址（需要重置授权的代币）
  string signed_tx_hex = 4;           // 必填：签名后的交易hex字符串（Web3用户提供）
}

// ResetApprovalData 重置授权数据（广播结果）
message ResetApprovalData {
  string tx_hash = 1;                       // 交易哈希
  int64 broadcasted_at = 2;                 // 广播时间戳（Unix秒）
}

// ResetApprovalResponse 重置授权响应
message ResetApprovalResponse {
  bool success = 1;           // 是否成功
  string message = 2;         // 响应消息
  ResetApprovalData data = 3; // 重置授权数据
}

// GetSwapStatusRequest 获取兑换状态请求
message GetSwapStatusRequest {
  int64 chain_id = 1;    // 链ID
  string tx_hash = 2;    // 交易哈希
  string swap_id = 3;    // 兑换ID（可选，用于绑定交易哈希到兑换记录）
}

// SwapStatusData 兑换状态数据
message SwapStatusData {
  string swap_id = 1;                  // 兑换ID
  int64 chain_id = 2;                  // 链ID
  string tx_hash = 3;                  // 交易哈希
  SwapTxStatus status = 4;             // 交易状态
  uint64 confirmations = 5;            // 当前确认数
  uint64 required_confirmations = 6;   // 所需确认数
  bool is_confirmed = 7;               // 是否已确认
  string block_number = 8;             // 区块号
  string provider = 9;                 // 服务提供商
}

// GetSwapStatusResponse 获取兑换状态响应
message GetSwapStatusResponse {
  bool success = 1;        // 是否成功
  string message = 2;      // 响应消息
  SwapStatusData data = 3; // 状态数据
}

// GetSwapHistoryRequest 获取兑换历史请求
message GetSwapHistoryRequest {
  string wallet_address = 1;  // 钱包地址
  int64 chain_id = 2;         // 链ID（可选，0表示所有链）
  int32 page = 3;             // 页码
  int32 page_size = 4;        // 每页条数
}

// SwapHistoryItem 兑换历史记录
message SwapHistoryItem {
  string swap_id = 1;              // 兑换ID
  int64 chain_id = 2;              // 链ID
  string provider = 3;             // 服务提供商
  string wallet_address = 4;       // 钱包地址
  string from_token_address = 5;   // 源代币合约地址
  string to_token_address = 6;     // 目标代币合约地址
  string from_amount = 7;          // 源代币数量
  string to_amount = 8;            // 目标代币数量
  string tx_hash = 9;              // 交易哈希
  SwapTxStatus status = 10;        // 交易状态
  string created_at = 11;          // 创建时间（RFC3339格式）
  string updated_at = 12;          // 更新时间（RFC3339格式）
}

// GetSwapHistoryResponse 获取兑换历史响应
message GetSwapHistoryResponse {
  bool success = 1;                 // 是否成功
  string message = 2;               // 响应消息
  repeated SwapHistoryItem items = 3;  // 历史记录列表
  SwapPagination pagination = 4;    // 分页信息
}

// GetSwapDetailRequest 获取交易详情请求（从 swap_svc_transactions 查询）
//
// - 如果 chain_id > 0：按 (chain_id, tx_hash) 精确查询
// - 如果 chain_id == 0：按 tx_hash 查询最新一条记录（不推荐，但兼容业务端历史调用）
message GetSwapDetailRequest {
  int64 chain_id = 1;  // 链ID（可选；0 表示不指定）
  string tx_hash = 2;  // 交易哈希（必填）
}

// SwapDetailData 交易详情（DB 记录）
message SwapDetailData {
  int64 id = 1;                // 记录ID（雪花ID）
  int64 api_key_id = 2;        // API Key ID（内部）
  string project_name = 3;     // 项目名称
  string wallet_address = 4;   // 钱包地址
  int64 chain_id = 5;          // 链ID
  string provider = 6;         // 服务商（例如 "okx" / "1inch"）

  // Swap pair + amount snapshot
  string from_token = 7;
  string to_token = 8;
  string from_amount = 9;
  string to_amount = 10;

  // Unsigned tx snapshot (from ExecuteSwap)
  string tx_from = 11;
  string tx_to = 12;
  string tx_data = 13;
  string tx_value = 14;
  string tx_gas = 15;
  string tx_gas_price = 16;
  string tx_nonce = 17;
  string tx_signature_data = 18;

  // Result
  string tx_hash = 19;
  string status = 20;
  string error_code = 21;
  string error_message = 22;
  string broadcasted_at = 23; // RFC3339; empty if null

  string created_at = 24; // RFC3339
  string updated_at = 25; // RFC3339

  // Token names from swap_configs
  string from_token_name = 26;  // 源代币名称
  string to_token_name = 27;    // 目标代币名称
}

// GetSwapDetailResponse 获取交易详情响应
message GetSwapDetailResponse {
  bool success = 1;
  string message = 2;
  SwapDetailData data = 3;
}

// GetSupportedTokensRequest 获取支持的代币列表请求
message GetSupportedTokensRequest {
  int64 chain_id = 1;  // 链ID
}

// GetSupportedTokensResponse 获取支持的代币列表响应
message GetSupportedTokensResponse {
  bool success = 1;                 // 是否成功
  string message = 2;               // 响应消息
  int64 chain_id = 3;               // 链ID
  repeated SwapTokenInfo tokens = 4;  // 代币列表
}

// GetSupportedChainsRequest 获取支持的链列表请求
message GetSupportedChainsRequest {}

// GetSupportedChainsResponse 获取支持的链列表响应
message GetSupportedChainsResponse {
  bool success = 1;              // 是否成功
  string message = 2;            // 响应消息
  repeated ChainInfo chains = 3; // 链列表
}

// BroadcastSwapRequest 广播兑换交易请求
message BroadcastSwapRequest {
  string swap_id = 1;    // ExecuteSwap返回的swap_id（必填）
  int64 chain_id = 2;    // 链ID（可选，用于验证）
  // 注意：交易数据已在ExecuteSwap时保存到数据库，无需重复传递
}

// BroadcastSwapData 广播兑换交易数据
message BroadcastSwapData {
  string swap_id = 1;          // 兑换ID
  string tx_hash = 2;          // 广播后的交易哈希
  SwapTxStatus status = 3;     // 交易状态（PENDING）
  int64 broadcasted_at = 4;    // 广播时间戳（Unix秒）
}

// BroadcastSwapResponse 广播兑换交易响应
message BroadcastSwapResponse {
  bool success = 1;            // 是否成功
  string message = 2;          // 响应消息
  BroadcastSwapData data = 3;  // 广播数据
}

// UpdateSwapBroadcastResultRequest 用于在“外部已广播”后补齐 swap_svc_transactions（不做签名/不做广播）
message UpdateSwapBroadcastResultRequest {
  string swap_id = 1;          // ExecuteSwap返回的swap_id（必填）
  int64 chain_id = 2;          // 链ID（可选，用于验证）
  string tx_hash = 3;          // 广播后的交易哈希（必填）
  int64 broadcasted_at = 4;    // 广播时间戳（Unix秒；可选，0表示用服务端当前时间）
  bool broadcast_success = 5;  // 是否广播成功（必填）
  string error_code = 6;       // 错误码（可选；broadcast_success=false 时使用）
  string error_message = 7;    // 错误信息（可选；broadcast_success=false 时使用）
}

message UpdateSwapBroadcastResultResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// OKX DEX Specific APIs
// ============================================================================

// GetLiquiditySourcesRequest 获取流动性来源请求（特定链支持的DEX列表）
message GetLiquiditySourcesRequest {
  int64 chain_id = 1;  // 链ID（例如：1 表示以太坊）
}

// GetLiquiditySourcesResponse 获取流动性来源响应
message GetLiquiditySourcesResponse {
  bool success = 1;                          // 是否成功
  string message = 2;                        // 响应消息
  repeated LiquiditySource liquidity_sources = 3;  // 流动性来源列表
}

// GetExternalSwapStatusRequest 获取外部兑换状态请求
message GetExternalSwapStatusRequest {
  int64 chain_id = 1;           // 链ID（例如：1 表示以太坊）
  string tx_hash = 2;           // 要查询的交易哈希
  bool is_from_my_project = 3;  // 是否仅返回当前API Key所属项目的订单
}

// GetExternalSwapStatusResponse 获取外部兑换状态响应
message GetExternalSwapStatusResponse {
  bool success = 1;              // 是否成功
  string message = 2;            // 响应消息
  ChainSwapHistoryItem data = 3; // 链上交易历史数据
}

// ============================================================================
// API Key Management (admin-protected)
// ============================================================================

// CreateSwapApiKeyRequest 创建Swap API密钥请求
message CreateSwapApiKeyRequest {
  string project_name = 1;     // 项目名称
  string key_name = 2;         // 密钥名称（可选但推荐，项目内唯一，如 "production"、"dev"）
  string rate_limit_tier = 3;  // 限流等级
  int64 expires_at_unix = 4;   // 过期时间（Unix秒时间戳，0表示永不过期）
}

// SwapApiKeyItem Swap API密钥项
message SwapApiKeyItem {
  int64 id = 1;                 // 密钥ID
  string project_name = 2;      // 项目名称
  string key_name = 3;          // 密钥名称（项目内唯一，如 "production"、"dev"）
  string rate_limit_tier = 4;   // 限流等级
  bool is_active = 5;           // 是否激活
  int64 created_at_unix = 6;    // 创建时间（Unix秒时间戳）
  int64 expires_at_unix = 7;    // 过期时间（Unix秒时间戳，0表示永不过期）
  string token_display = 8;     // 完整密钥（用于显示和引用）
}

// CreateSwapApiKeyResponse 创建Swap API密钥响应
message CreateSwapApiKeyResponse {
  bool success = 1;       // 是否成功
  string message = 2;     // 响应消息
  string api_key = 3;     // API密钥（仅返回一次，不以明文存储）
  SwapApiKeyItem item = 4;  // 密钥项详情
}

// RevokeSwapApiKeyRequest 撤销Swap API密钥请求
message RevokeSwapApiKeyRequest {
  int64 id = 1;  // 密钥ID
}

