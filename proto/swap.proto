  string min_swap_amount_usd = 19;   // 最小兑换金额（USD）
  string max_swap_amount_usd = 20;   // 最大兑换金额（USD）
  string default_slippage = 21;      // 默认滑点
  string max_slippage = 22;          // 最大滑点
  string fee_rate = 23;              // 手续费率
  string created_at = 24;            // 创建时间
  string updated_at = 25;            // 更新时间
}

// SwapListProjectSwapConfigsRequest 列出项目Swap配置请求
message SwapListProjectSwapConfigsRequest {
  string project_name = 1;  // 项目名称（必填）
  string provider = 2;      // 服务商代码（可选过滤）
  int64 chain_id = 3;       // 链ID（可选过滤）
  bool project_enabled = 4; // 项目是否启用（可选过滤，默认所有）
  int32 page = 5;           // 页码
  int32 page_size = 6;      // 每页条数
}

// SwapListProjectSwapConfigsResponse 列出项目Swap配置响应
message SwapListProjectSwapConfigsResponse {
  bool success = 1;                       // 是否成功
  string message = 2;                     // 响应消息
  repeated ProjectSwapConfigItem configs = 3;  // 配置列表
  SwapPagination pagination = 4;          // 分页信息
}

// SwapEnableSwapConfigForProjectRequest 为项目启用Swap配置请求
message SwapEnableSwapConfigForProjectRequest {
  string project_name = 1;  // 项目名称
  int64 config_id = 2;      // 配置ID
  bool is_enabled = 3;      // 是否启用
}

// SwapEnableSwapConfigForProjectResponse 为项目启用Swap配置响应
message SwapEnableSwapConfigForProjectResponse {
  bool success = 1;  // 是否成功
  string message = 2;  // 响应消息
  int64 id = 3;      // 启用记录ID
}

// SwapDisableSwapConfigForProjectRequest 为项目禁用Swap配置请求
message SwapDisableSwapConfigForProjectRequest {
  int64 id = 1;  // 启用记录ID（swap_project_enabled.id）
}

// SwapDisableSwapConfigForProjectResponse 为项目禁用Swap配置响应
message SwapDisableSwapConfigForProjectResponse {
  bool success = 1;  // 是否成功
  string message = 2;  // 响应消息
}

// ============================================================================
// Business API - My Swap Configs Query (API Key authenticated)
// ============================================================================

// SwapGetMySwapConfigsRequest 获取我的Swap配置请求
message SwapGetMySwapConfigsRequest {
  // 不需要 project_name，从 API Key context 自动获取
  string provider = 1;  // 服务商代码（可选过滤，例如 "1inch", "okx"）
  int64 chain_id = 2;   // 链ID（可选过滤）
  int32 page = 3;       // 页码
  int32 page_size = 4;  // 每页条数
}

// SwapGetMySwapConfigsResponse 获取我的Swap配置响应
message SwapGetMySwapConfigsResponse {
  bool success = 1;                       // 是否成功
  string message = 2;                     // 响应消息
  repeated ProjectSwapConfigItem configs = 3;  // 配置列表（复用已有的配置结构）
  SwapPagination pagination = 4;          // 分页信息
}

// ============================================================================
// 统计与查询 (Statistics and Queries)
// ============================================================================

// SwapSvcStatisticsSummary Swap服务统计摘要（已废弃）
message SwapSvcStatisticsSummary {
  int64 total_swaps = 1;           // 总兑换次数
  string total_volume_usd = 2;     // 总交易量（USD）
  string total_fee_usd = 3;        // 总手续费（USD）
  string avg_swap_amount_usd = 4;  // 平均兑换金额（USD）
  string success_rate = 5;         // 成功率
  int64 unique_wallets = 6;        // 唯一钱包数
}

// SwapSvcStatisticsByChain 按链统计（已废弃）
message SwapSvcStatisticsByChain {
  int64 chain_id = 1;      // 链ID
  string chain_name = 2;   // 链名称
  int64 swap_count = 3;    // 兑换次数
  string volume_usd = 4;   // 交易量（USD）
}

// SwapSvcStatisticsByProvider 按服务商统计（已废弃）
message SwapSvcStatisticsByProvider {
  string provider = 1;      // 服务商代码
  int64 swap_count = 2;     // 兑换次数
  string volume_usd = 3;    // 交易量（USD）
  string success_rate = 4;  // 成功率
}

// SwapSvcStatisticsTrend 统计趋势（已废弃）
message SwapSvcStatisticsTrend {
  string date = 1;         // 日期
  int64 swap_count = 2;    // 兑换次数
  string volume_usd = 3;   // 交易量（USD）
}

// SwapGetSwapStatisticsRequest 获取Swap统计请求（已废弃）
message SwapGetSwapStatisticsRequest {
  string period = 1;      // 时间周期（7d, 30d, 90d）
  string start_date = 2;  // 开始日期（可选，YYYY-MM-DD）
  string end_date = 3;    // 结束日期（可选，YYYY-MM-DD）
}

// SwapGetSwapStatisticsResponse 获取Swap统计响应（已废弃）
message SwapGetSwapStatisticsResponse {
  bool success = 1;                              // 是否成功
  string message = 2;                            // 响应消息
  SwapSvcStatisticsSummary summary = 3;          // 统计摘要
  repeated SwapSvcStatisticsByChain by_chain = 4;      // 按链统计
  repeated SwapSvcStatisticsByProvider by_provider = 5;  // 按服务商统计
  repeated SwapSvcStatisticsTrend trend = 6;     // 统计趋势
}

// ==================== 交易列表查询 ====================
// SwapTransactionItem Swap交易项
message SwapTransactionItem {
  int64 id = 1;                     // 交易ID
  string project_name = 2;          // 项目名称
  string wallet_address = 3;        // 钱包地址
  int64 chain_id = 4;               // 链ID
  string chain_name = 5;            // 链名称
  string provider = 6;              // 服务商代码
  string from_token_symbol = 7;     // 源代币符号
  string from_token_address = 8;    // 源代币合约地址
  int32 from_token_decimals = 9;    // 源代币精度
  string to_token_symbol = 10;      // 目标代币符号
  string to_token_address = 11;     // 目标代币合约地址
  int32 to_token_decimals = 12;     // 目标代币精度
  string from_amount = 13;          // 源代币数量
  string to_amount = 14;            // 目标代币数量
  string tx_hash = 15;              // 交易哈希
  string status = 16;               // 交易状态
  string fee_usd = 17;              // 手续费（USD）
  string gas = 18;                  // Gas消耗
  string created_at = 19;           // 创建时间
  string broadcasted_at = 20;       // 广播时间
}

// SwapListSwapTransactionsRequest 列出Swap交易请求
message SwapListSwapTransactionsRequest {
  string wallet_address = 1;  // 钱包地址（可选）
  int64 chain_id = 2;         // 链ID（可选）
  string provider = 3;        // 服务商代码（可选）
  string status = 4;          // 交易状态（可选）
  string start_date = 5;      // 开始日期（可选，YYYY-MM-DD）
  string end_date = 6;        // 结束日期（可选，YYYY-MM-DD）
  int32 page = 7;             // 页码
  int32 page_size = 8;        // 每页条数
}

// SwapListSwapTransactionsResponse 列出Swap交易响应
message SwapListSwapTransactionsResponse {
  bool success = 1;                     // 是否成功
  string message = 2;                   // 响应消息
  repeated SwapTransactionItem items = 3;  // 交易列表
  SwapPagination pagination = 4;        // 分页信息
}
