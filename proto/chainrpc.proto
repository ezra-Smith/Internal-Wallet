// ============================================================================
// 转账交易 - 消息定义
// ============================================================================

// ==================== 主币转账 ====================
message NativeTransferReq {
  ChainRpcType chain = 1;
  string from_address = 2;
  string to_address = 3;
  string amount = 4;                  // 金额（最小单位，如wei）
  uint64 gas_price = 5;               // Gas价格（可选，空则自动获取）
  uint64 gas_limit = 6;               // Gas限制（可选，空则自动估算）
  uint64 nonce = 7;                   // Nonce（可选，空则自动获取）
  GasSpeed gas_speed = 8;             // Gas速度（可选）
  string memo = 9;                    // 备注（TRON支持）
  int64 uid = 10;                    // 用户ID
  bool wait_for_receipt = 11;         // 是否等待交易收据
}

// ==================== 代币转账 ====================
message TokenTransferReq {
  ChainRpcType chain = 1;
  string from_address = 2;
  string to_address = 3;
  string token_contract = 4;          // 代币合约地址
  string amount = 5;                  // 金额（最小单位）
  uint64 gas_price = 6;               // Gas价格（可选）
  uint64 gas_limit = 7;               // Gas限制（可选）
  uint64 nonce = 8;                   // Nonce（可选）
  GasSpeed gas_speed = 9;
  int64 uid = 10;                    // 用户ID
  bool wait_for_receipt = 11;         // 是否等待交易收据
}

// ==================== 交易响应 ====================
message TransactionResp {
//  bool success = 1;
//  string message = 2;
//  string tx_hash = 3;
//  string raw_transaction = 4;         // 未签名交易（hex编码）
//  string tx_hash_preview = 5;         // 预计的交易hash
//  string gas_price = 6;               // 实际使用的Gas价格
//  uint64 gas_limit = 7;               // 实际使用的Gas限制
//  string estimated_fee = 8;           // 预估手续费
//  uint64 nonce = 9;                   // 实际使用的Nonce
//  map<string, string> extra_data = 10; // 额外数据（链特定）
//  int64 uid = 11;                    // 用户ID

    bool success = 1;
    string message = 2;
    string tx_hash = 3;                 // 交易hash
    uint64 nonce = 4;
    TxStatus status = 5;
    int64 broadcasted_at = 6;
    string block_number = 7;            // 如果wait_for_receipt=true
    uint64 gas_used = 8;                // 如果wait_for_receipt=true
}

// ==================== 批量交易 ====================
message BatchTransferReq {
  ChainRpcType chain = 1;
  string from_address = 2;
  repeated TransferItem transfers = 3;
  string gas_price = 4;               // 统一Gas价格
  GasSpeed gas_speed = 5;
}

message TransferItem {
  string to_address = 1;
  string amount = 2;
  string token_contract = 3;          // 空表示主币
}

message BatchTransferResp {
  bool success = 1;
  string message = 2;
  repeated TransactionResp transactions = 3;
  int32 total = 4;
  string total_estimated_fee = 5;
}

// ==================== Gas估算 ====================
message EstimateGasReq {
  ChainRpcType chain = 1;
  string from_address = 2;
  string to_address = 3;
  string value = 4;                   // 金额
  string data = 5;                    // 交易数据（可选）
  string token_contract = 6;          // 代币合约（可选）
}

message EstimateGasResp {
  bool success = 1;
  string message = 2;
  uint64 gas_limit = 3;               // 估算的Gas限制
  string gas_price = 4;               // 当前Gas价格
  string estimated_fee = 5;           // 预估费用
  string estimated_fee_usd = 6;       // 预估费用（USD）
}

// ==================== Gas价格 ====================
message GetGasPriceReq {
  ChainRpcType chain = 1;
  GasSpeed speed = 2;                 // 速度级别
  string transaction_type = 3;        // 交易类型（可选）：native_transfer, token_transfer, swap, approve 等，用于估算 gas_limit
  string token_address = 4;           // 代币地址（可选，token_transfer 或 swap 时需要）
}

message GasPriceInfo {
  GasSpeed speed = 1;
  string gas_price = 2;               // Wei
  string gas_price_gwei = 3;          // Gwei
  int32 estimated_time_seconds = 4;   // 预估确认时间
  uint64 gas_limit = 5;               // 预估 Gas Limit（根据 transaction_type 返回典型值）
  string max_fee_wei = 6;             // 最大费用（Wei）= gas_price * gas_limit
  string max_fee_gwei = 7;            // 最大费用（Gwei）
}

message GetGasPriceResp {
  bool success = 1;
  string message = 2;
  repeated GasPriceInfo prices = 3;   // 不同速度的价格
  string current_block = 4;
  int64 timestamp = 5;
}

// ==================== TRON 手续费估算 ====================
message EstimateTronFeeReq {
  string from_address = 1;      // Sender's TRON address (Base58 format)
  string to_address = 2;        // Recipient's TRON address (Base58 format)
  string amount = 3;            // Amount in smallest unit (SUN for TRX, token decimals for TRC20)
  string contract_address = 4;  // Optional: TRC20 contract address (empty = native TRX transfer)
}

message EstimateTronFeeResp {
  bool success = 1;
  string message = 2;

  uint64 bandwidth_required = 3;      // Estimated bandwidth consumption
  uint64 energy_required = 4;         // Estimated energy consumption (0 for TRX)
  string estimated_fee_sun = 5;       // Total fee in SUN (smallest unit)
  string estimated_fee_trx = 6;       // Total fee in TRX (for display)
  string estimated_fee_usd = 7;       // USD equivalent

  bool to_address_activated = 8;      // Whether recipient is activated
  string activation_fee_sun = 9;      // Activation fee if needed (0 if activated)

  // Resource breakdown (optional, for debugging)
  uint64 from_bandwidth_available = 10;
  uint64 from_energy_available = 11;
}

// ==================== TRON 地址资源查询 ====================
message GetTronAccountResourcesReq {
  string address = 1;  // TRON address to query (Base58 format)
}

message GetTronAccountResourcesResp {
  bool success = 1;
  string message = 2;

  // Bandwidth resources
  uint64 bandwidth_total = 3;       // Total bandwidth limit
  uint64 bandwidth_used = 4;        // Bandwidth consumed
  uint64 bandwidth_available = 5;   // Remaining bandwidth

  // Energy resources
  uint64 energy_total = 6;          // Total energy limit
  uint64 energy_used = 7;           // Energy consumed
  uint64 energy_available = 8;      // Remaining energy

  // Account info
  string trx_balance_sun = 9;       // TRX balance in SUN
  string trx_balance_trx = 10;      // TRX balance in TRX (for display)
  bool is_activated = 11;           // Whether address has been activated
}

// ============================================================================
// 交易广播 - 消息定义
// ============================================================================

// ==================== 广播交易 ====================
message BroadcastTransactionReq {
  ChainRpcType chain = 1;
  string signed_transaction = 2;      // 已签名交易（hex编码，ETH/BSC为RLP编码，TRON为protobuf编码）
  string request_id = 3;              // 请求ID（幂等性，可选）
  bool wait_for_receipt = 4;          // 是否等待交易收据（默认false）
  int32 timeout_seconds = 5;          // 超时时间（秒，默认30）
}

message BroadcastTransactionResp {
  bool success = 1;
  string message = 2;
  string tx_hash = 3;                 // 交易hash
  uint64 nonce = 4;                   // Nonce（ETH/BSC）
  TxStatus status = 5;                // 交易状态
  int64 broadcasted_at = 6;           // 广播时间戳
  string block_number = 7;            // 区块号（如果wait_for_receipt=true且已确认）
  uint64 gas_used = 8;                // Gas使用量（如果wait_for_receipt=true）
}

