syntax = "proto3";

package chainrpc;

option go_package = "./pb";

// ============================================================================
// 链操作服务定义 - 区块链交互服务
// ============================================================================

// 链RPC服务 - 地址生成、转账交易、链上查询
service ChainRPC {
  // ==================== 地址管理 ====================
//  // 生成充值地址（HD钱包派生）
//  rpc GenerateAddress(GenerateAddressReq) returns (GenerateAddressResp);
//
//  // 批量生成地址
//  rpc GenerateAddressBatch(GenerateAddressBatchReq) returns (GenerateAddressBatchResp);
//
//  // 验证地址有效性
//  rpc ValidateAddress(ValidateAddressReq) returns (ValidateAddressResp);
//
//  // 从公钥生成地址
//  rpc GetAddressFromPubkey(GetAddressFromPubkeyReq) returns (GetAddressFromPubkeyResp);

  // ==================== 转账交易 ====================
  // 主币转账交易
  rpc NativeTransfer(NativeTransferReq) returns (TransactionResp);

  // 代币转账交易
  rpc TokenTransfer(TokenTransferReq) returns (TransactionResp);
  // 批量转账交易（归集用）
  rpc BatchTransfer(BatchTransferReq) returns (BatchTransferResp);

  // 估算Gas费用
  rpc EstimateGas(EstimateGasReq) returns (EstimateGasResp);

  // 获取推荐Gas价格
  rpc GetGasPrice(GetGasPriceReq) returns (GetGasPriceResp);

  // ==================== TRON 资源/手续费 ====================
  // 估算 TRON 手续费（Bandwidth + Energy + 激活费）
  rpc EstimateTronFee(EstimateTronFeeReq) returns (EstimateTronFeeResp);

  // 查询 TRON 地址资源（Bandwidth/Energy/余额）
  rpc GetTronAccountResources(GetTronAccountResourcesReq) returns (GetTronAccountResourcesResp);

  // ==================== 交易广播 ====================
  // 广播已签名交易
  rpc BroadcastTransaction(BroadcastTransactionReq) returns (BroadcastTransactionResp);

  // 批量广播交易
  //  rpc BroadcastBatch(BroadcastBatchReq) returns (BroadcastBatchResp);

  // 加速交易（Replace-By-Fee）
  rpc SpeedUpTransaction(SpeedUpTransactionReq) returns (SpeedUpTransactionResp);

  // 取消交易
  rpc CancelTransaction(CancelTransactionReq) returns (CancelTransactionResp);

  // ==================== 链上查询 ====================
  // 查询地址余额（主币）
  rpc GetBalance(GetBalanceReq) returns (GetBalanceResp);

  // 查询代币余额
  rpc GetTokenBalance(GetTokenBalanceReq) returns (GetTokenBalanceResp);

  // 查询多地址余额
  rpc GetMultiBalance(GetMultiBalanceReq) returns (GetMultiBalanceResp);

  // 查询交易详情
  rpc GetTransaction(GetTransactionReq) returns (GetTransactionResp);

  // 查询交易状态
  rpc GetTransactionStatus(GetTransactionStatusReq) returns (GetTransactionStatusResp);

  // 查询交易收据
  rpc GetTransactionReceipt(GetTransactionReceiptReq) returns (GetTransactionReceiptResp);

  // 查询区块高度
  rpc GetBlockHeight(GetBlockHeightReq) returns (GetBlockHeightResp);

  // 查询区块信息
  rpc GetBlock(GetBlockReq) returns (GetBlockResp);

  // 查询Nonce
  rpc GetNonce(GetNonceReq) returns (GetNonceResp);

  // 构建 EVM 交易（ETH/BSC，返回未签名 rawTx，供 Signer 签名）
  rpc BuildTransaction(BuildTransactionReq) returns (BuildTransactionResp);

  // 构建 TRON 交易（返回未签名的 rawData，供客户端签名）
  rpc BuildTronTransaction(ChainRpcBuildTronTransactionReq) returns (ChainRpcBuildTronTransactionResp);

  // ==================== 代币信息 ====================
  // 查询代币信息（symbol, decimals, totalSupply）
  rpc GetTokenInfo(GetTokenInfoReq) returns (GetTokenInfoResp);

  // 批量查询代币信息
  rpc GetTokenInfoBatch(GetTokenInfoBatchReq) returns (GetTokenInfoBatchResp);

  // ==================== 节点管理 ====================
  // 节点健康检查
  rpc HealthCheck(HealthCheckReq) returns (HealthCheckResp);

  // 获取节点状态
  rpc GetNodeStatus(GetNodeStatusReq) returns (GetNodeStatusResp);

  // 切换节点
  rpc SwitchNode(SwitchNodeReq) returns (SwitchNodeResp);

  // 测试节点连接
  rpc TestNode(TestNodeReq) returns (TestNodeResp);
}

// ============================================================================
// 枚举定义
// ============================================================================

// 区块链类型
enum ChainRpcType {
  CHAIN_TYPE_UNSPECIFIED = 0;
  CHAIN_TYPE_TRON = 1;      // TRON (TRX/TRC20)
  CHAIN_TYPE_BSC = 2;       // Binance Smart Chain (BNB/BEP20)
  CHAIN_TYPE_ETHEREUM = 3;  // Ethereum (ETH/ERC20)
  CHAIN_TYPE_POLYGON = 4;   // Polygon (MATIC/ERC20)
}

// 交易状态
enum TxStatus {
  TX_STATUS_UNSPECIFIED = 0;
  TX_STATUS_PENDING = 1;     // 待确认
  TX_STATUS_CONFIRMED = 2;   // 已确认
  TX_STATUS_FAILED = 3;      // 失败
  TX_STATUS_DROPPED = 4;     // 被丢弃
  TX_STATUS_REPLACED = 5;    // 被替换
}

// Gas速度级别
enum GasSpeed {
  GAS_SPEED_UNSPECIFIED = 0;
  GAS_SPEED_SLOW = 1;        // 慢（省钱）
  GAS_SPEED_STANDARD = 2;    // 标准
  GAS_SPEED_FAST = 3;        // 快速
  GAS_SPEED_INSTANT = 4;     // 极速
}

// 节点类型
enum NodeType {
  NODE_TYPE_UNSPECIFIED = 0;
  NODE_TYPE_QUICKNODE = 1;
  NODE_TYPE_INFURA = 2;
  NODE_TYPE_ALCHEMY = 3;
  NODE_TYPE_ANKR = 4;
  NODE_TYPE_CUSTOM = 5;      // 自建节点
}

// 地址类型
enum AddressType {
  ADDRESS_TYPE_UNSPECIFIED = 0;
  ADDRESS_TYPE_EOA = 1;      // 外部账户
  ADDRESS_TYPE_CONTRACT = 2; // 合约地址
}

