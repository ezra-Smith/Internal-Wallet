// ==================== 加速交易 ====================
message SpeedUpTransactionReq {
  ChainRpcType chain = 1;
  string original_tx_hash = 2;
  string new_gas_price = 3;           // 新的Gas价格（必须更高）
  GasSpeed gas_speed = 4;
}

message SpeedUpTransactionResp {
  bool success = 1;
  string message = 2;
  string new_tx_hash = 3;
  string old_tx_hash = 4;
  string new_gas_price = 5;
  string old_gas_price = 6;
}

// ==================== 取消交易 ====================
message CancelTransactionReq {
  ChainRpcType chain = 1;
  string tx_hash = 2;
  string from_address = 3;
  string nonce = 4;
  string gas_price = 5;               // 必须比原交易高
}

message CancelTransactionResp {
  bool success = 1;
  string message = 2;
  string cancel_tx_hash = 3;
  string original_tx_hash = 4;
}

// ============================================================================
// 链上查询 - 消息定义
// ============================================================================

// ==================== 查询余额 ====================
message GetBalanceReq {
  ChainRpcType chain = 1;
  string address = 2;
  uint64 block_number = 3;            // 可选：查询指定区块的余额
}

message GetBalanceResp {
  bool success = 1;
  string message = 2;
  string balance = 3;                 // 余额（最小单位）
  string balance_formatted = 4;       // 格式化余额（如 1.5 ETH）
  double balance_usd = 5;             // USD价值
  uint64 block_number = 6;
}

// ==================== 查询代币余额 ====================
message GetTokenBalanceReq {
  ChainRpcType chain = 1;
  string address = 2;
  string token_contract = 3;
  string block_number = 4;            // 可选
}

message GetTokenBalanceResp {
  bool success = 1;
  string message = 2;
  string balance = 3;                 // 余额（最小单位）
  string balance_formatted = 4;       // 格式化余额
  double balance_usd = 5;
  string token_symbol = 6;
  uint32 token_decimals = 7;
}

// ==================== 查询多地址余额 ====================
message GetMultiBalanceReq {
  ChainRpcType chain = 1;
  repeated string addresses = 2;
  repeated string token_contracts = 3; // 空数组则只查主币
}

message BalanceInfo {
  string address = 1;
  string native_balance = 2;
  repeated TokenBalanceInfo tokens = 3;
  double total_usd = 4;
}

message TokenBalanceInfo {
  string token_contract = 1;
  string token_symbol = 2;
  uint32 decimals = 3;
  string balance = 4;
  string balance_formatted = 5;
  double balance_usd = 6;
}

message GetMultiBalanceResp {
  bool success = 1;
  string message = 2;
  repeated BalanceInfo balances = 3;
  double total_usd = 4;
}

// ==================== 查询交易详情 ====================
message GetTransactionReq {
  ChainRpcType chain = 1;
  string tx_hash = 2;
  bool include_logs = 3;              // 是否包含事件日志
}

message TransactionDetail {
  string tx_hash = 1;
  ChainRpcType chain = 2;
  string block_number = 3;
  string block_hash = 4;
  int64 block_timestamp = 5;
  uint64 transaction_index = 6;
  string from_address = 7;
  string to_address = 8;
  string value = 9;                   // 金额
  string gas_price = 10;
  uint64 gas_limit = 11;
  uint64 gas_used = 12;
  string gas_fee = 13;                // 实际手续费
  TxStatus status = 14;
  string nonce = 15;
  bytes input_data = 16;
  uint64 confirmations = 17;
  string contract_address = 18;       // 合约地址（代币转账时）
  repeated EventLog logs = 19;
  string error_message = 20;
}

message EventLog {
  string log_index = 1;
  string address = 2;                 // 合约地址
  repeated string topics = 3;
  bytes data = 4;
  string decoded_event = 5;           // 解码后的事件名称
  map<string, string> decoded_params = 6;
}

message GetTransactionResp {
  bool success = 1;
  string message = 2;
  TransactionDetail transaction = 3;
}

// ==================== 查询交易状态 ====================
message GetTransactionStatusReq {
  ChainRpcType chain = 1;
  string tx_hash = 2;
}

message GetTransactionStatusResp {
  bool success = 1;
  string message = 2;
  TxStatus status = 3;
  uint64 confirmations = 4;
  uint64 required_confirmations = 5;  // 要求的确认数
  bool is_confirmed = 6;
  string block_number = 7;
}

// ==================== 查询交易收据 ====================
message GetTransactionReceiptReq {
  ChainRpcType chain = 1;
  string tx_hash = 2;
}

message TransactionReceipt {
  string tx_hash = 1;
  string block_number = 2;
  string block_hash = 3;
  uint64 transaction_index = 4;
  string from_address = 5;
  string to_address = 6;
  uint64 gas_used = 7;
  string gas_fee = 8;
  TxStatus status = 9;
  repeated EventLog logs = 10;
  string contract_address = 11;       // 合约创建时的地址
}

message GetTransactionReceiptResp {
  bool success = 1;
  string message = 2;
  TransactionReceipt receipt = 3;
}

// ==================== 查询区块高度 ====================
message GetBlockHeightReq {
  ChainRpcType chain = 1;
}

message GetBlockHeightResp {
  bool success = 1;
  string message = 2;
  uint64 block_height = 3;
  string block_hash = 4;
  int64 timestamp = 5;
}

// ==================== 查询区块信息 ====================
message GetBlockReq {
  ChainRpcType chain = 1;
  string block_number = 2;            // 区块号
  string block_hash = 3;              // 区块hash（二选一）
  bool include_transactions = 4;      // 是否包含交易详情
}

message BlockInfo {
  string block_number = 1;
  string block_hash = 2;
  string parent_hash = 3;
  int64 timestamp = 4;
  uint64 transaction_count = 5;
  string miner = 6;
  string difficulty = 7;
  uint64 gas_limit = 8;
  uint64 gas_used = 9;
  string size = 10;
  repeated string transaction_hashes = 11;
  repeated TransactionDetail transactions = 12; // 如果include_transactions=true
}

message GetBlockResp {
  bool success = 1;
  string message = 2;
  BlockInfo block = 3;
}

// ==================== 查询Nonce ====================
message GetNonceReq {
  ChainRpcType chain = 1;
  string address = 2;
  bool pending = 3;                   // 是否查询pending状态的nonce
}

message GetNonceResp {
  bool success = 1;
  string message = 2;
  string nonce = 3;
  string pending_nonce = 4;           // pending状态的nonce
}

// ==================== 构建 EVM 交易（ETH/BSC） ====================
message BuildTransactionReq {
  ChainRpcType chain = 1;             // ETH/BSC
  string from_address = 2;            // 发送方地址（必填）
  string to_address = 3;              // 接收方地址（必填）
  string amount = 4;                  // 转账金额（必填，单位：wei/代币最小单位）
  string token_contract = 5;          // 代币合约地址（可选，为空则为主币转账）
  string gas_price = 6;               // GasPrice（可选，单位：wei）
  uint64 gas_limit = 7;               // GasLimit（可选，为0则自动估算）
  string nonce = 8;                   // Nonce（可选，十进制字符串）
}

message BuildTransactionResp {
  bool success = 1;
  string message = 2;
  string raw_transaction = 3;         // 未签名交易（hex编码，0x前缀，RLP编码）
  uint64 nonce = 4;
  uint64 gas_limit = 5;
  string gas_price = 6;
  string estimated_fee = 7;           // 预估手续费（wei）
}

// ==================== 构建 TRON 交易 ====================
message ChainRpcBuildTronTransactionReq {
  string from_address = 1;            // 发送方地址（必填）
  string to_address = 2;              // 接收方地址（必填）
  string amount = 3;                  // 转账金额（必填，单位：SUN（TRX）或代币最小单位（TRC20））
  string contract_address = 4;       // 代币合约地址（可选，为空则为 TRX 转账，有值则为 TRC20 代币转账）
}

message ChainRpcBuildTronTransactionResp {
  bool success = 1;
  string message = 2;
  string raw_data = 3;                // 未签名的交易 rawData（hex编码的protobuf序列化数据）
}

// ============================================================================
// 代币信息 - 消息定义
// ============================================================================

// ==================== 查询代币信息 ====================
message GetTokenInfoReq {
  ChainRpcType chain = 1;
  string token_contract = 2;
}

message TokenInfo {
  string contract_address = 1;
  string name = 2;
  string symbol = 3;
  uint32 decimals = 4;
  string total_supply = 5;
  string total_supply_formatted = 6;
  string owner = 7;                   // 合约所有者
  bool verified = 8;                  // 是否验证
  double price_usd = 9;               // USD价格
}

message GetTokenInfoResp {
  bool success = 1;
  string message = 2;
  TokenInfo token_info = 3;
}

// ==================== 批量查询代币信息 ====================
message GetTokenInfoBatchReq {
  ChainRpcType chain = 1;
  repeated string token_contracts = 2;
}

message GetTokenInfoBatchResp {
  bool success = 1;
  string message = 2;
  repeated TokenInfo tokens = 3;
  int32 total = 4;
}

// ============================================================================
// 节点管理 - 消息定义
// ============================================================================

// ==================== 健康检查 ====================
message HealthCheckReq {
  ChainRpcType chain = 1;                // 可选，空则检查所有链
}

message ChainHealth {
  ChainRpcType chain = 1;
  bool healthy = 2;
  string current_node = 3;
  int64 response_time_ms = 4;
  uint64 block_height = 5;
  int64 last_block_time = 6;
  string error_message = 7;
}

message HealthCheckResp {
  bool success = 1;
  string message = 2;
  repeated ChainHealth chains = 3;
  int32 healthy_count = 4;
  int32 total_count = 5;
}

// ==================== 节点状态 ====================
message GetNodeStatusReq {
  ChainRpcType chain = 1;
}

message NodeInfo {
  string node_id = 1;
  NodeType node_type = 2;
  string endpoint = 3;
  bool healthy = 4;
  int64 response_time_ms = 5;
  int32 success_rate = 6;             // 成功率（百分比）
  int64 total_requests = 7;
  int64 failed_requests = 8;
  int64 last_success_time = 9;
  string last_error = 10;
  bool is_primary = 11;               // 是否为主节点
  double weight = 12;                 // 权重
}

message GetNodeStatusResp {
  bool success = 1;
  string message = 2;
  repeated NodeInfo nodes = 3;
  string active_node = 4;
}

// ==================== 切换节点 ====================
message SwitchNodeReq {
  ChainRpcType chain = 1;
  string node_id = 2;                 // 目标节点ID
  bool force = 3;                     // 强制切换
}

message SwitchNodeResp {
  bool success = 1;
  string message = 2;
  string old_node = 3;
  string new_node = 4;
  int64 switched_at = 5;
}

// ==================== 测试节点 ====================
message TestNodeReq {
  ChainRpcType chain = 1;
  string endpoint = 2;                // 节点RPC端点
  map<string, string> headers = 3;    // 请求头（如API Key）
  int32 timeout_seconds = 4;
}

message TestNodeResp {
  bool success = 1;
  string message = 2;
  bool healthy = 3;
  int64 response_time_ms = 4;
  uint64 block_height = 5;
  string chain_id = 6;
  map<string, string> node_info = 7;
}
