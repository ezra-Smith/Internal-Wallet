// 枚举定义
// ============================================================================

// 用户状态
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_NORMAL = 1;     // 正常
  USER_STATUS_FROZEN = 2;     // 冻结
  USER_STATUS_DISABLED = 3;   // 注销
}

// KYC等级
enum KYCLevel {
  KYC_LEVEL_UNSPECIFIED = 0;
  KYC_LEVEL_L0 = 1;  // 基础认证（仅邮箱/手机验证）
  KYC_LEVEL_L1 = 2;  // 初级认证（实名）
  KYC_LEVEL_L2 = 3;  // 高级认证（人脸）
  KYC_LEVEL_L3 = 4;  // 机构认证
}

// 验证码类型
enum CodeType {
  CODE_TYPE_UNSPECIFIED = 0;
  CODE_TYPE_AUTH = 1;            // 认证（注册/登录统一类型）
  CODE_TYPE_RESET_PASSWORD = 2;  // 重置密码
  CODE_TYPE_BIND_EMAIL = 3;      // 绑定邮箱
  CODE_TYPE_BIND_PHONE = 4;      // 绑定手机
  CODE_TYPE_WITHDRAW = 5;        // 提现
  CODE_TYPE_2FA = 6;             // 二次验证
  CODE_TYPE_RESET_TRADE_PASSWORD = 7; // 重置交易密码（资金密码）
}

// 解绑GA验证方式（四选一）
enum UnbindVerifyMethod {
  UNBIND_VERIFY_METHOD_UNSPECIFIED = 0;
  UNBIND_VERIFY_METHOD_GOOGLE_AUTH = 1;  // GA验证码
  UNBIND_VERIFY_METHOD_EMAIL = 2;        // 邮箱验证码
  UNBIND_VERIFY_METHOD_PHONE = 3;        // 手机验证码
  UNBIND_VERIFY_METHOD_BIOMETRIC = 4;    // 生物识别（Face ID/Touch ID/指纹等）
}

// 登录方式
enum LoginMethod {
  LOGIN_METHOD_UNSPECIFIED = 0;
  LOGIN_METHOD_PHONE_CODE = 1;      // 手机验证码登录
  LOGIN_METHOD_OAUTH_GOOGLE = 2;    // Google OAuth 登录
  LOGIN_METHOD_EMAIL_CODE = 3;      // 邮箱验证码登录
  LOGIN_METHOD_EMAIL_PASSWORD = 4;  // 邮箱密码登录
}

// 账号类型
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_EMAIL = 1;
  ACCOUNT_TYPE_PHONE = 2;
}

// 平台类型
enum PlatformType {
  PLATFORM_TYPE_UNSPECIFIED = 0;
  PLATFORM_TYPE_WEB = 1;
  PLATFORM_TYPE_IOS = 2;
  PLATFORM_TYPE_ANDROID = 3;
  PLATFORM_TYPE_API = 4;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_ZH_CN = 1;
  LANGUAGE_EN = 2;
}

enum PriceUnit {
  PRICE_UNIT_UNSPECIFIED = 0;
  PRICE_UNIT_USDT = 1;  // 数据库中的 id=1 对应 USDT
  PRICE_UNIT_USD = 2;   // 数据库中的 id=2 对应 USD
  PRICE_UNIT_CNY = 3;   // 数据库中的 id=3 对应 CNY
}

// 交易类型
// 注意：内部转账不再使用独立的类型，转出方使用 TRANSACTION_TYPE_WITHDRAW，转入方使用 TRANSACTION_TYPE_DEPOSIT
enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_DEPOSIT = 1;
  TRANSACTION_TYPE_WITHDRAW = 2;
  // TRANSACTION_TYPE_INTERNAL_TRANSFER = 3; // 已废弃：内部转账转出方使用 WITHDRAW，转入方使用 DEPOSIT
}

