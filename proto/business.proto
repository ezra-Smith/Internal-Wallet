// SendPushNotificationByAliasReq 通过别名发送推送通知请求
// 说明：用于业务逻辑调用推送服务，通过别名（user_id或设备ID）发送推送
message SendPushNotificationByAliasReq {
  repeated string aliases = 1;  // 别名列表（user_id或设备ID），最多1000个，每个最大40字节
  string notification_type = 2; // 通知类型：transaction|security|system|price_alert
  string title = 3;             // 推送标题
  string content = 4;           // 推送内容
  map<string, string> data = 5; // 扩展数据（用于跳转等）
  string device_id = 6;         // 设备ID（用于查询Web3用户设置，可选）
}

message SendPushNotificationByAliasResp {
  bool success = 1;           // 是否成功
  string message = 2;         // 返回消息
  string jpush_msg_id = 3;    // 极光消息ID
}

// SendPushNotificationByDeviceTokenReq 通过设备ID发送推送通知请求（Web3用户专用）
// 说明：通过设备ID（device_token）查询设备的 registration_id，然后发送推送
message SendPushNotificationByDeviceTokenReq {
  string device_token = 1;    // 设备ID（必填）
  string notification_type = 2; // 通知类型：transaction|security|system|price_alert
  string title = 3;           // 推送标题
  string content = 4;         // 推送内容
  map<string, string> data = 5; // 扩展数据（用于跳转等）
}

message SendPushNotificationByDeviceTokenResp {
  bool success = 1;           // 是否成功
  string message = 2;         // 返回消息
  string jpush_msg_id = 3;    // 极光消息ID
}

// RegisterDeviceReq 注册设备请求（Web3用户专用）
// 说明：用于Web3用户在登录或启动时注册设备，绑定设备ID和极光registration_id
// 平台信息从 HTTP Header X-Platform 获取，无需在请求体中传递
message RegisterDeviceReq {
  string registration_id = 1; // 极光 Registration ID（必填）
  string device_token = 2;    // 设备唯一标识/设备ID（必填）
  string device_model = 3;    // 设备型号（可选）
  string os_version = 4;      // 操作系统版本（可选）
  string app_version = 5;     // 应用版本（可选，优先使用入参，为空则使用 X-App-Version）
}

message RegisterDeviceResp {
  bool success = 1;           // 是否成功
  string message = 2;         // 返回消息
  int64 device_id = 3;        // 设备ID（数据库记录ID）
  bool is_new_device = 4;     // 是否新设备
}

