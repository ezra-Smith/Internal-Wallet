// 提交内部转账请求
message SubmitInternalTransferReq {
  string to_user_id = 1;       // 目标用户ID（从内部地址簿选择或直接输入）
  string asset_code = 2;       // 资产代码（如 USDT、BTC）
  string amount = 3;           // 转账数量（字符串，支持高精度）
  string note = 4;             // 转账备注（可选，最多200字符）
  string security_code = 5;    // 安全验证码（短信/邮箱/2FA，可选配置）
  string trade_password = 6;   // 资金密码（可选配置）
}

// 提交内部转账响应
message SubmitInternalTransferResp {
  bool success = 1;
  string message = 2;
  string order_id = 3;         // 转账订单ID
  string status = 4;           // 状态：pending/processing/completed/failed
  bool needs_audit = 5;        // 是否需要人工审核
  string strategy = 6;         // 审核策略：auto/manual_auto
}

// 校验内部转账目标用户请求
message ValidateInternalTransferTargetReq {
  string to_user_id = 1; // 目标用户标识符（支持 UID 或邮箱）
}

// 校验内部转账目标用户响应
message ValidateInternalTransferTargetResp {
  bool success = 1;
  string message = 2;
  bool exists = 3;        // 用户是否存在
  string user_id = 4;     // 用户UID（如果存在）
  string display_name = 5; // 显示名称（用于前端展示，如脱敏的邮箱或昵称）
  string email = 6;       // 目标用户邮箱（脱敏，如 a***b@example.com）
}

// 取消内部转账请求（仅限待审核状态）
message CancelInternalTransferReq {
  string order_id = 1;         // 订单ID
}

// 取消内部转账响应
message CancelInternalTransferResp {
  bool success = 1;
  string message = 2;
}

