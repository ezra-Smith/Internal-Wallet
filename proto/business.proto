  string min_withdraw = 4;         // 最小提现额度（如配置）
  string fee_rule_source = 5;      // global / asset（与 CreateWithdraw 的 FeeRuleSource 一致）
  string fee_rule_summary = 6;     // 用于 UI 展示的规则说明（i18n 文案可由前端处理
  string matched_rule_min_amount = 7;  // 当前匹配规则的最小金额（用于前端限制判断）
  string matched_rule_max_amount = 8;  // 当前匹配规则的最大金额（用于前端限制判断，空表示无上限）
}

