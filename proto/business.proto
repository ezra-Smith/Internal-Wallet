message GetCountryCodesRequest {}

message GetCountryCodesResponse {
  bool success = 1; // 是否成功
  string message = 2; // 返回消息
  repeated string country_codes = 3; // 支持的国家/地区区号列表（E.164，带 + 前缀）
}

// ==================== 登录 ====================
message LoginByEmailCodeRequest {
  string email = 1; // 邮箱（RFC5322）
  string code = 2;  // 验证码
  string lot_number = 3;    // Geetest lot_number
  string captcha_output = 4; // Geetest captcha_output
  string pass_token = 5;    // Geetest pass_token
  string gen_time = 6;      // Geetest gen_time
}

message LoginByEmailCodeResponse {
  bool success = 1; // 是否成功
  string message = 2; // 返回消息
  string user_id = 3; // 用户ID
  string access_token = 4; // 访问令牌
  int64 expires_in = 5; // 访问令牌过期时间（秒）
}

message LoginByPhoneCodeRequest {
  string country_code = 1; // 国际区号（E.164，带 + 前缀）
  string phone = 2;        // 手机号（仅数字，不含区号前缀）
  string code = 3;         // 验证码
  string lot_number = 4;    // Geetest lot_number
  string captcha_output = 5; // Geetest captcha_output
  string pass_token = 6;    // Geetest pass_token
  string gen_time = 7;      // Geetest gen_time
}

message LoginByPhoneCodeResponse {
  bool success = 1; // 是否成功
  string message = 2; // 返回消息
  string user_id = 3; // 用户ID
  string access_token = 4; // 访问令牌
  int64 expires_in = 5; // 访问令牌过期时间（秒）
}

// Google OAuth 登录请求
message LoginByGoogleRequest {
  string id_token = 1;    // Google ID Token (前端从 Google OAuth 获取)
  string access_token = 2; // Google Access Token (可选，用于获取更多用户信息)
  string lot_number = 3;    // Geetest lot_number
  string captcha_output = 4; // Geetest captcha_output
  string pass_token = 5;    // Geetest pass_token
  string gen_time = 6;      // Geetest gen_time
}

// Google OAuth 登录响应
message LoginByGoogleResponse {
  bool success = 1;         // 是否成功
  string message = 2;       // 返回消息
  string user_id = 3;       // 用户ID
  string access_token = 4;  // 访问令牌 (JWT)
  int64 expires_in = 5;     // 访问令牌过期时间（秒）
  bool is_new_user = 6;     // 是否为新注册用户
  string email = 7;         // 用户邮箱
  string name = 8;          // 用户姓名
  string avatar = 9;        // 用户头像URL
}

message RefreshTokenReq {
  string refresh_token = 1; // 刷新令牌
}

message RefreshTokenResp {
  bool success = 1; // 是否成功
  string message = 2; // 返回消息
  string access_token = 3; // 新访问令牌
  string refresh_token = 4; // 新刷新令牌（如下发）
  int64 expires_in = 5; // 新访问令牌过期时间（秒）
}

