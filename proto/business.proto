syntax = "proto3";

package business;

option go_package = "./pb";

import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Internal Wallet Business API"
    version: "v1"
    description: "企业内部钱包系统 业务服务 API 文档"
  }
  host: "127.0.0.1:8080"
  schemes: HTTP
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Bearer Token，格式：Bearer {token}"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
};

// 业务服务
service Business {
  // ==================== Auth ====================
  // 登录（邮箱+验证码）
  rpc LoginByEmailCode(LoginByEmailCodeRequest) returns (LoginByEmailCodeResponse);
  // 登录（手机+验证码）
  rpc LoginByPhoneCode(LoginByPhoneCodeRequest) returns (LoginByPhoneCodeResponse);
  // 登录（Google OAuth）
  rpc LoginByGoogle(LoginByGoogleRequest) returns (LoginByGoogleResponse);
  // 忘记密码（邮箱+验证码）
  rpc ForgotPasswordByEmail(ForgotPasswordByEmailRequest) returns (ForgotPasswordByEmailResponse);
  // 忘记密码（手机+验证码）
  rpc ForgotPasswordByPhone(ForgotPasswordByPhoneRequest) returns (ForgotPasswordByPhoneResponse);
  // Geetest 验证
  rpc ValidateGeetest(ValidateGeetestRequest) returns (ValidateGeetestResponse);
  // 获取支持的国家/地区区号
  rpc GetCountryCodes(GetCountryCodesRequest) returns (GetCountryCodesResponse);

  rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenResp);
  // 发送手机验证码

  rpc SendSMSCode(SendSMSCodeReq) returns (SendSMSCodeResp);
  // 发送邮箱验证码

  rpc SendEmailCode(SendEmailCodeReq) returns (SendEmailCodeResp);
  // 登出
  rpc Logout(LogoutReq) returns (LogoutResp);
  // 资产页
  rpc GetAssetOverview(GetAssetOverviewReq) returns (GetAssetOverviewResp);
  // 资产页-详情

  rpc GetAssetDetail(GetAssetDetailReq) returns (GetAssetDetailResp);
  // 获取所有资产配置（包含精度等信息）
  rpc GetAssetConfig(GetAssetConfigReq) returns (GetAssetConfigResp);
  // 资产页-交易记录

  rpc ListTransactionRecords(ListTransactionRecordsReq) returns (ListTransactionRecordsResp);
  // 资产页-交易记录-详情

  rpc GetTransactionRecordDetail(GetTransactionRecordDetailReq) returns (GetTransactionRecordDetailResp);
  // 资产-充值

  rpc GetDepositInfo(GetDepositInfoReq) returns (GetDepositInfoResp);
  rpc CreateDeposit(CreateDepositReq) returns (CreateDepositResp);

  rpc ListDepositRecords(ListDepositRecordsReq) returns (ListDepositRecordsResp);

  rpc GetDepositDetail(GetDepositDetailReq) returns (GetDepositDetailResp);
  // 资产-充值地址簿（同链多地址）
  rpc ListDepositAddressBook(ListDepositAddressBookReq) returns (ListDepositAddressBookResp);
  rpc CreateDepositAddressBook(CreateDepositAddressBookReq) returns (CreateDepositAddressBookResp);
  rpc GetDepositAddressBookDetail(GetDepositAddressBookDetailReq) returns (GetDepositAddressBookDetailResp);
  rpc UpdateDepositAddressBook(UpdateDepositAddressBookReq) returns (UpdateDepositAddressBookResp);
  rpc DeleteDepositAddressBook(DeleteDepositAddressBookReq) returns (DeleteDepositAddressBookResp);
  rpc SetDefaultDepositAddressBook(SetDefaultDepositAddressBookReq) returns (SetDefaultDepositAddressBookResp);
  rpc ListDepositAddressBookDeposits(ListDepositAddressBookDepositsReq) returns (ListDepositAddressBookDepositsResp);
  // 资产页-币种列表

  rpc ListActionAssets(ListActionAssetsReq) returns (ListActionAssetsResp);
  // 资产页-网络列表

  rpc ListActionNetworks(ListActionNetworksReq) returns (ListActionNetworksResp);
  // 资产页-币种提现手续费规则配置查询
  rpc GetAssetWithdrawFeeConfig(GetAssetWithdrawFeeConfigReq) returns (GetAssetWithdrawFeeConfigResp);
  // 资产页-汇率查询
  rpc GetExchangeRate(GetExchangeRateReq) returns (GetExchangeRateResp);
  // 资产页-法币汇率列表（1 USDT = n 法币）
  rpc ListFiatRates(ListFiatRatesReq) returns (ListFiatRatesResp);
  // 资产页-提币

  rpc GetWithdrawInfo(GetWithdrawInfoReq) returns (GetWithdrawInfoResp);
  // Web2 提币手续费预估（仅计算手续费规则，不构建链上交易，不使用 Web3 gas 接口）
  rpc EstimateWithdrawFee(EstimateWithdrawFeeReq) returns (EstimateWithdrawFeeResp);
  // Web2 提币手续费计算（校验余额；返回 fee/min_withdraw_amount/required_amount）
  rpc CalcWithdrawFee(CalcWithdrawFeeReq) returns (CalcWithdrawFeeResp);
  rpc CreateWithdraw(CreateWithdrawReq) returns (CreateWithdrawResp);
  rpc ListWithdrawRecords(ListWithdrawRecordsReq) returns (ListWithdrawRecordsResp);

  rpc GetWithdrawAuditStatus(GetWithdrawAuditStatusReq) returns (GetWithdrawAuditStatusResp);

  rpc GetWithdrawDetail(GetWithdrawDetailReq) returns (GetWithdrawDetailResp);
  // 资产页-消息通知（Web2 用户）
  rpc ListNotifications(ListNotificationsReq) returns (ListNotificationsResp);

  rpc MarkNotificationRead(MarkNotificationReadReq) returns (MarkNotificationReadResp);

  rpc MarkAllNotificationsRead(MarkAllNotificationsReadReq) returns (MarkAllNotificationsReadResp);

  rpc DeleteNotification(DeleteNotificationReq) returns (DeleteNotificationResp);

  rpc ClearAllNotifications(ClearAllNotificationsReq) returns (ClearAllNotificationsResp);
  
  // 内部接口：创建消息通知（供业务逻辑调用）
  rpc CreateUserNotification(CreateUserNotificationReq) returns (CreateUserNotificationResp);
  
  // 推送通知：通过别名发送推送（供业务逻辑调用）
  rpc SendPushNotificationByAlias(SendPushNotificationByAliasReq) returns (SendPushNotificationByAliasResp);
  
  // 推送通知：通过设备ID发送推送（Web3用户专用）
  rpc SendPushNotificationByDeviceToken(SendPushNotificationByDeviceTokenReq) returns (SendPushNotificationByDeviceTokenResp);
  
  // 设备管理：注册设备（Web3用户专用）
  rpc RegisterDevice(RegisterDeviceReq) returns (RegisterDeviceResp);
  
  // 我的页

  rpc GetMyOverview(GetMyOverviewReq) returns (GetMyOverviewResp);
  // 我的页-资料

  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);

  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoResp);
  // 我的页-邮箱

  rpc BindEmail(BindEmailReq) returns (BindEmailResp);

  rpc ChangeEmail(ChangeEmailReq) returns (ChangeEmailResp);
  // 我的页-手机号
  rpc BindPhone(BindPhoneReq) returns (BindPhoneResp);
  rpc ChangePhone(ChangePhoneReq) returns (ChangePhoneResp);
  // 我的页-关联钱包

  rpc ListWalletProviders(ListWalletProvidersReq) returns (ListWalletProvidersResp);

  rpc ListProviderAccounts(ListProviderAccountsReq) returns (ListProviderAccountsResp);

  rpc LinkWalletAccount(LinkWalletAccountReq) returns (LinkWalletAccountResp);

  rpc UnlinkWalletAccount(UnlinkWalletAccountReq) returns (UnlinkWalletAccountResp);

  rpc SetPrimaryLinkedWallet(SetPrimaryLinkedWalletReq) returns (SetPrimaryLinkedWalletResp);

  rpc GetLinkedWalletAccounts(GetLinkedWalletAccountsReq) returns (GetLinkedWalletAccountsResp);
  // 我的页-登录密码
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordResp);
  // 我的页-交易密码

  rpc SetTradePassword(SetTradePasswordReq) returns (SetTradePasswordResp);

  rpc ResetTradePassword(ResetTradePasswordReq) returns (ResetTradePasswordResp);

  rpc VerifyTradePassword(VerifyTradePasswordReq) returns (VerifyTradePasswordResp);

  // 我的页-Web3交易密码
  rpc SetWeb3TradePassword(SetWeb3TradePasswordReq) returns (SetWeb3TradePasswordResp);
  rpc VerifyWeb3TradePassword(VerifyWeb3TradePasswordReq) returns (VerifyWeb3TradePasswordResp);
  rpc UpdateWeb3TradePassword(UpdateWeb3TradePasswordReq) returns (UpdateWeb3TradePasswordResp);

  // 我的页-使用设置-生物识别（Web2）
  // 注册/更新生物识别公钥（需要交易密码校验）
  rpc RegisterBiometricKey(RegisterBiometricKeyReq) returns (RegisterBiometricKeyResp);
  // 创建提币生物识别挑战（用于签名）
  rpc CreateWithdrawBiometricChallenge(CreateWithdrawBiometricChallengeReq) returns (CreateBiometricChallengeResp);
  // 创建提现免审白名单绑定生物识别挑战（用于签名）
  rpc CreateWithdrawAuditWhitelistBindingBiometricChallenge(CreateWithdrawAuditWhitelistBindingBiometricChallengeReq) returns (CreateBiometricChallengeResp);
  // 创建重置交易密码生物识别挑战（用于签名）
  rpc CreateResetTradePasswordBiometricChallenge(CreateResetTradePasswordBiometricChallengeReq) returns (CreateBiometricChallengeResp);
  // 解绑当前用户生物识别（仅交易密码）
  rpc UnbindBiometric(UnbindBiometricReq) returns (UnbindBiometricResp);

  // 我的页-使用设置-双重认证
  // 获取 Google 验证器设置信息（生成 secret 和 QR 码）
  rpc GetGoogleAuthSetup(GetGoogleAuthSetupReq) returns (GetGoogleAuthSetupResp);
  // 绑定 Google 验证器
  rpc BindGoogleAuth(BindGoogleAuthReq) returns (BindGoogleAuthResp);
  // 解绑 Google 验证器
  rpc UnbindGoogleAuth(UnbindGoogleAuthReq) returns (UnbindGoogleAuthResp);
  // 关闭双重认证（不解绑 Google 验证器）
  rpc DisableGoogleAuth2FA(DisableGoogleAuth2FAReq) returns (DisableGoogleAuth2FAResp);
  // 开启双重认证（已绑定GA，传验证码开启）
  rpc EnableGoogleAuth2FA(EnableGoogleAuth2FAReq) returns (EnableGoogleAuth2FAResp);
  // 关闭双重认证（已绑定GA，传验证码关闭）
  rpc DisableGoogleAuth2FAWithCode(DisableGoogleAuth2FAWithCodeReq) returns (DisableGoogleAuth2FAWithCodeResp);
  // 校验Google验证器验证码（仅校验，不做任何状态修改）
  rpc VerifyGoogleAuthCode(VerifyGoogleAuthCodeReq) returns (VerifyGoogleAuthCodeResp);
  // 我的页-使用设置－登录记录
  rpc ListLoginRecords(ListLoginRecordsReq) returns (ListLoginRecordsResp);
  // 我的页-使用设置－钱包地址（链上地址）
  rpc ListWalletAddresses(ListWalletAddressesReq) returns (ListWalletAddressesResp);
  rpc AddWalletAddress(AddWalletAddressReq) returns (AddWalletAddressResp);
  rpc UpdateWalletAddress(UpdateWalletAddressReq) returns (UpdateWalletAddressResp);
  rpc DeleteWalletAddress(DeleteWalletAddressReq) returns (DeleteWalletAddressResp);
  rpc SetDefaultWalletAddress(SetDefaultWalletAddressReq) returns (SetDefaultWalletAddressResp);
  rpc ValidateWalletAddress(ValidateWalletAddressReq) returns (ValidateWalletAddressResp);

  // 我的页-使用设置－钱包地址（内部地址，通过UID/邮箱添加平台内用户）
  rpc ListInternalWalletAddresses(ListInternalWalletAddressesReq) returns (ListInternalWalletAddressesResp);
  rpc AddInternalWalletAddress(AddInternalWalletAddressReq) returns (AddInternalWalletAddressResp);
  rpc UpdateInternalWalletAddress(UpdateInternalWalletAddressReq) returns (UpdateInternalWalletAddressResp);
  rpc DeleteInternalWalletAddress(DeleteInternalWalletAddressReq) returns (DeleteInternalWalletAddressResp);
  rpc LookupInternalUser(LookupInternalUserReq) returns (LookupInternalUserResp);

  // 内部转账（用户之间的资产转移，支持审核）
  // 校验内部转账目标用户是否存在（支持 UID 和邮箱）
  rpc ValidateInternalTransferTarget(ValidateInternalTransferTargetReq) returns (ValidateInternalTransferTargetResp);
  rpc SubmitInternalTransfer(SubmitInternalTransferReq) returns (SubmitInternalTransferResp);
  rpc CancelInternalTransfer(CancelInternalTransferReq) returns (CancelInternalTransferResp);

  // 提现免审白名单（用户自绑定）
  rpc ListWithdrawAuditWhitelistBindableNetworks(ListWithdrawAuditWhitelistBindableNetworksReq) returns (ListWithdrawAuditWhitelistBindableNetworksResp);
  rpc SetMyWithdrawAuditWhitelistBinding(SetMyWithdrawAuditWhitelistBindingReq) returns (SetMyWithdrawAuditWhitelistBindingResp);
  rpc GetMyWithdrawAuditWhitelistBindingStatus(GetMyWithdrawAuditWhitelistBindingStatusReq) returns (GetMyWithdrawAuditWhitelistBindingStatusResp);
  rpc UnbindMyWithdrawAuditWhitelistBindings(UnbindMyWithdrawAuditWhitelistBindingsReq) returns (UnbindMyWithdrawAuditWhitelistBindingsResp);
  // 我的页-偏好设置
  rpc GetPreferences(GetPreferencesReq) returns (GetPreferencesResp);
  rpc ListLanguageOptions(ListLanguageOptionsReq) returns (ListLanguageOptionsResp);
  rpc ListPriceUnitOptions(ListPriceUnitOptionsReq) returns (ListPriceUnitOptionsResp);
  rpc SetPreferences(SetPreferencesReq) returns (SetPreferencesResp);
  // 获取客户端配置
  rpc GetClientConfig(GetClientConfigReq) returns (GetClientConfigResp);

  // ==================== Web3 Swap (proxy to swap microservice) ====================
  rpc SwapGetQuote(BusinessSwapGetQuoteRequest) returns (BusinessSwapGetQuoteResponse);
  rpc SwapExecuteSwap(BusinessSwapExecuteSwapRequest) returns (BusinessSwapExecuteSwapResponse);
  rpc SwapGetApprovalTransaction(BusinessSwapGetApprovalTransactionRequest) returns (BusinessSwapGetApprovalTransactionResponse);
  rpc SwapResetApproval(BusinessSwapResetApprovalRequest) returns (BusinessSwapResetApprovalResponse);
  rpc SwapGetSwapStatus(BusinessSwapGetSwapStatusRequest) returns (BusinessSwapGetSwapStatusResponse);
  rpc SwapGetSwapDetail(BusinessSwapGetSwapDetailRequest) returns (BusinessSwapGetSwapDetailResponse);
  rpc SwapGetSwapHistory(BusinessSwapGetSwapHistoryRequest) returns (BusinessSwapGetSwapHistoryResponse);
  rpc SwapGetSupportedTokens(BusinessSwapGetSupportedTokensRequest) returns (BusinessSwapGetSupportedTokensResponse);
  rpc SwapGetSupportedChains(BusinessSwapGetSupportedChainsRequest) returns (BusinessSwapGetSupportedChainsResponse);
  rpc SwapGetExternalSwapStatus(BusinessSwapGetExternalSwapStatusRequest) returns (BusinessSwapGetExternalSwapStatusResponse);

  // ==================== Web3 User Management ====================
  // 创建 Web3 用户（基于设备）
  rpc CreateWeb3User(CreateWeb3UserReq) returns (CreateWeb3UserResp);
  // 添加 Web3 用户地址
  rpc AddWeb3UserAddress(AddWeb3UserAddressReq) returns (AddWeb3UserAddressResp);
  // 批量添加 Web3 用户地址（一次添加多条链的地址）
  rpc BatchAddWeb3UserAddress(BatchAddWeb3UserAddressReq) returns (BatchAddWeb3UserAddressResp);
  // 查询可用链列表（Web3 用户）
  rpc ListWeb3Chains(ListWeb3ChainsReq) returns (ListWeb3ChainsResp);
  // 根据 device_id 获取 Web3 用户信息
  rpc GetWeb3UserByDeviceId(GetWeb3UserByDeviceIdReq) returns (GetWeb3UserByDeviceIdResp);
  // 获取 Web3 用户资产概览
  rpc GetWeb3AssetOverview(GetWeb3AssetOverviewReq) returns (GetWeb3AssetOverviewResp);
  // 获取 Web3 用户交易记录列表
  rpc ListWeb3Transactions(ListWeb3TransactionsReq) returns (ListWeb3TransactionsResp);
  // 获取 Web3 交易详情
  rpc GetWeb3TransactionDetail(GetWeb3TransactionDetailReq) returns (GetWeb3TransactionDetailResp);
  // Web3 交易结果查询（根据交易哈希查询状态和结果）
  rpc GetWeb3TransactionResult(GetWeb3TransactionResultReq) returns (GetWeb3TransactionResultResp);
  // 广播 Web3 交易（Web3 用户专用）
  rpc BroadcastWeb3Transaction(BroadcastWeb3TransactionReq) returns (BroadcastWeb3TransactionResp);
  // 获取 Web3 支持的资产列表（根据链）
  rpc ListWeb3SupportedAssets(ListWeb3SupportedAssetsReq) returns (ListWeb3SupportedAssetsResp);
  // 获取 Web3 用户地址的 Nonce（用于构建 EVM 交易）
  rpc GetWeb3Nonce(GetWeb3NonceReq) returns (GetWeb3NonceResp);

  // 构建 Web3 TRON 交易（返回未签名的 rawData，供客户端签名）
  rpc BuildTronTransaction(BuildTronTransactionReq) returns (BuildTronTransactionResp);
  // 获取 Web3 代币详细信息（合约地址、网络、价格、市值、持有者等）
  rpc GetWeb3TokenDetail(GetWeb3TokenDetailReq) returns (GetWeb3TokenDetailResp);
}

// ============================================================================
// Web3 Swap (Business -> Swap Microservice Proxy)
// NOTE: 为避免与 swap 微服务 proto 的 Go types 冲突，这里统一使用 BusinessSwap* 前缀。
// ============================================================================

message BusinessSwapPagination {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

enum BusinessSwapTxStatus {
  BUSINESS_SWAP_TX_STATUS_UNSPECIFIED = 0;
  BUSINESS_SWAP_TX_STATUS_CREATED = 1;
  BUSINESS_SWAP_TX_STATUS_PENDING = 2;
  BUSINESS_SWAP_TX_STATUS_SUCCESS = 3;
  BUSINESS_SWAP_TX_STATUS_FAILED = 4;
}

message BusinessSwapChainInfo {
  int64 chain_id = 1;
  string name = 2;
  bool enabled = 3;
  uint64 required_confirmations = 4;
}

message BusinessSwapTokenInfo {
  string address = 1;
  string symbol = 2;
  string name = 3;
  uint32 decimals = 4;
  string logo_uri = 5;
  string min_swap_amount_usd = 6;   // 最小兑换金额（USD）
  string max_swap_amount_usd = 7;   // 最大兑换金额（USD）
}

message BusinessSwapUnsignedTransaction {
  int64 chain_id = 1;
  string from = 2;
  string to = 3;
  string data = 4;  // hex string (0x...)
  string value = 5; // wei, decimal string
  string gas = 6;   // wei, decimal string (optional)
  string gas_price = 7; // wei, decimal string (optional)
}

message BusinessSwapGetQuoteRequest {
  int64 chain_id = 1;
  string from_token_address = 2;
  string to_token_address = 3;
  string amount = 4; // amount in minimal units (wei), decimal string
  bool include_protocols = 5;
}

message BusinessSwapQuoteData {
  int64 chain_id = 1;
  BusinessSwapTokenInfo from_token = 2;
  BusinessSwapTokenInfo to_token = 3;
  string from_amount = 4; // wei, decimal string
  string to_amount = 5;   // wei, decimal string
  uint64 estimated_gas = 6;
  string provider = 7; // e.g. "1inch"
  string trade_fee = 8; // DEX 交易手续费（USD 计价，例如 "0.5"）
  string price_impact = 9; // 价格冲击百分比（例如 "0.5" 表示 0.5%）
  string gas_fee_percentage = 10; // 矿工费百分比（例如 "0.1" 表示 0.1%，相对于交易金额）
}

message BusinessSwapGetQuoteResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapQuoteData data = 3;
}

message BusinessSwapExecuteSwapRequest {
  int64 chain_id = 1;
  string wallet_address = 2; // EVM address (0x...)
  string from_token_address = 3;
  string to_token_address = 4;
  string amount = 5; // amount in minimal units (wei), decimal string
  int32 slippage_bps = 6; // 1 = 0.01%, 100 = 1%
  string recipient = 7; // optional; defaults to wallet_address
  bool check_allowance = 8;
  bool include_approve_tx = 9;
  uint64 estimated_gas = 10; // 预估 gas（询价时返回，用于执行 swap 时设置 gasLimit）
}

message BusinessSwapExecuteSwapData {
  string swap_id = 1;
  string provider = 2;
  BusinessSwapQuoteData quote = 3;
  BusinessSwapUnsignedTransaction approve_tx = 4;
  BusinessSwapUnsignedTransaction swap_tx = 5;
}

message BusinessSwapExecuteSwapResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapExecuteSwapData data = 3;
}

// BusinessSwapGetApprovalTransactionRequest 获取授权交易请求
message BusinessSwapGetApprovalTransactionRequest {
  int64 chain_id = 1;                 // 链ID
  string wallet_address = 2;          // 钱包地址
  string token_address = 3;           // 代币合约地址
  string amount = 4;                  // 授权额度（"0"表示重置授权，不填或"max"表示无限授权）
}

// BusinessSwapGetApprovalTransactionResponse 获取授权交易响应
message BusinessSwapGetApprovalTransactionResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapUnsignedTransaction tx = 3; // 未签名的授权交易
}

// BusinessSwapResetApprovalRequest 重置授权请求（广播签名后的重置授权交易）
message BusinessSwapResetApprovalRequest {
  int64 chain_id = 1;          // 链ID
  string wallet_address = 2;   // 钱包地址
  string token_address = 3;    // 代币合约地址
  string signed_tx_hex = 4;    // 必填：签名后的交易hex字符串（Web3用户提供）
}

// BusinessSwapResetApprovalData 重置授权数据（广播结果）
message BusinessSwapResetApprovalData {
  string tx_hash = 1;                                   // 交易哈希
  int64 broadcasted_at = 2;                             // 广播时间戳（Unix秒）
}

// BusinessSwapResetApprovalResponse 重置授权响应
message BusinessSwapResetApprovalResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapResetApprovalData data = 3;
}

message BusinessSwapGetSwapStatusRequest {
  int64 chain_id = 1;
  string tx_hash = 2;
  string swap_id = 3; // optional; used to bind tx_hash to a created swap record
}

message BusinessSwapStatusData {
  string swap_id = 1;
  int64 chain_id = 2;
  string tx_hash = 3;
  BusinessSwapTxStatus status = 4;
  uint64 confirmations = 5;
  uint64 required_confirmations = 6;
  bool is_confirmed = 7;
  string block_number = 8;
  string provider = 9;
}

message BusinessSwapGetSwapStatusResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapStatusData data = 3;
}

message BusinessSwapGetSwapDetailRequest {
  int64 chain_id = 1; // optional; 0 means not specified
  string tx_hash = 2; // required
}

message BusinessSwapDetailData {
  string swap_id = 1;          // swap_svc_transactions.id (snowflake) as string
  int64 api_key_id = 2;        // internal
  string project_name = 3;
  string wallet_address = 4;
  int64 chain_id = 5;
  string provider = 6;

  string from_token = 7;
  string to_token = 8;
  string from_amount = 9;
  string to_amount = 10;

  string tx_from = 11;
  string tx_to = 12;
  string tx_data = 13;
  string tx_value = 14;
  string tx_gas = 15;
  string tx_gas_price = 16;
  string tx_nonce = 17;
  string tx_signature_data = 18;

  string tx_hash = 19;
  string status = 20;
  string error_code = 21;
  string error_message = 22;
  string broadcasted_at = 23; // RFC3339; empty if null

  string created_at = 24; // RFC3339
  string updated_at = 25; // RFC3339

  // Token names from swap_configs
  string from_token_name = 26;  // 源代币名称
  string to_token_name = 27;    // 目标代币名称
}

message BusinessSwapGetSwapDetailResponse {
  bool success = 1;
  string message = 2;
  BusinessSwapDetailData data = 3;
}

message BusinessSwapGetSwapHistoryRequest {
  string wallet_address = 1;
  int64 chain_id = 2; // optional (0 means all)
  int32 page = 3;
  int32 page_size = 4;
}

message BusinessSwapHistoryItem {
  string swap_id = 1;
  int64 chain_id = 2;
  string provider = 3;
  string wallet_address = 4;
  string from_token_address = 5;
  string to_token_address = 6;
  string from_amount = 7;
  string to_amount = 8;
  string tx_hash = 9;
  BusinessSwapTxStatus status = 10;
  string created_at = 11; // RFC3339
  string updated_at = 12; // RFC3339
}

message BusinessSwapGetSwapHistoryResponse {
  bool success = 1;
  string message = 2;
  repeated BusinessSwapHistoryItem items = 3;
  BusinessSwapPagination pagination = 4;
}

message BusinessSwapGetSupportedTokensRequest {
  int64 chain_id = 1;
}

message BusinessSwapGetSupportedTokensResponse {
  bool success = 1;
  string message = 2;
  int64 chain_id = 3;
  repeated BusinessSwapTokenInfo tokens = 4;
}

message BusinessSwapGetSupportedChainsRequest {}

message BusinessSwapGetSupportedChainsResponse {
  bool success = 1;
  string message = 2;
  repeated BusinessSwapChainInfo chains = 3;
}

// SwapGetExternalSwapStatus - 获取外部交易状态（通过 OKX DEX API）
message BusinessSwapGetExternalSwapStatusRequest {
  int64 chain_id = 1;           // 链ID（例如：1 表示以太坊）
  string tx_hash = 2;           // 要查询的交易哈希
  bool is_from_my_project = 3;  // 是否仅返回当前API Key所属项目的订单
}

message BusinessSwapGetExternalSwapStatusResponse {
  bool success = 1;                                // 是否成功
  string message = 2;                              // 响应消息
  BusinessSwapChainSwapHistoryItem data = 3;       // 链上交易历史数据
}

// BusinessSwapChainSwapStatus 链上交易状态
enum BusinessSwapChainSwapStatus {
  BUSINESS_CHAIN_SWAP_STATUS_UNSPECIFIED = 0;  // 未指定
  BUSINESS_CHAIN_SWAP_STATUS_PENDING = 1;      // 待确认
  BUSINESS_CHAIN_SWAP_STATUS_SUCCESS = 2;      // 成功
  BUSINESS_CHAIN_SWAP_STATUS_FAILED = 3;       // 失败
}

// BusinessSwapTokenDetail 代币详情
message BusinessSwapTokenDetail {
  string symbol = 1;                // 代币符号
  string amount = 2;                // 代币数量（最小单位，如 wei）
  string token_address = 3;         // 代币合约地址
}

// BusinessSwapChainSwapHistoryItem 链上交易历史记录
message BusinessSwapChainSwapHistoryItem {
  string chain_index = 1;                          // 链ID（例如："1" 表示以太坊）
  string tx_hash = 2;                              // 交易哈希
  string block_height = 3;                         // 区块高度
  int64 tx_time = 4;                               // 交易时间（Unix毫秒时间戳）
  BusinessSwapChainSwapStatus status = 5;          // 交易状态
  string tx_type = 6;                              // 交易类型（Approve/Wrap/Unwrap/Swap）
  string from_address = 7;                         // 发送地址
  string dex_router = 8;                           // DEX路由合约地址
  string to_address = 9;                           // 接收地址
  repeated BusinessSwapTokenDetail from_tokens = 10;   // 源代币详情
  repeated BusinessSwapTokenDetail to_tokens = 11;     // 目标代币详情
  string referral_amount = 12;                     // 推荐奖励金额
  string error_msg = 13;                           // 错误信息（失败时）
  string gas_limit = 14;                           // Gas 上限
  string gas_used = 15;                            // 实际使用 Gas
  string gas_price = 16;                           // Gas 价格
  string tx_fee = 17;                              // 交易手续费
}

