// ==================== 生物识别（Web2，签名验签） ====================

message BiometricProof {
  string key_id = 1; // 客户端 key_id
  string challenge_id = 2; // 挑战ID（一次性）
  string signature = 3; // Base64(ASN.1 DER ECDSA signature), algorithm=SHA256withECDSA (ES256)
}

message RegisterBiometricKeyReq {
  string key_id = 1; // 客户端 key_id（用于选择密钥）
  string algorithm = 2; // 固定：ES256
  string public_key_format = 3; // SPKI_DER_BASE64 / X963_UNCOMPRESSED_BASE64（public_key 为原始字节的 Base64）
  string public_key = 4; // Base64(公钥原始字节)
  string trade_password = 5; // 交易密码（强制，用于开启生物识别前校验）
}

message RegisterBiometricKeyResp {
  bool success = 1;
  string message = 2;
  string key_id = 3;
}

message CreateBiometricChallengeResp {
  bool success = 1;
  string message = 2;
  string scene = 3; // withdraw / withdraw_audit_whitelist_bind / reset_trade_password
  string challenge_id = 4;
  string challenge = 5;
  string payload_hash = 6; // sha256 hex
  int64 expires_in = 7; // seconds
}

message CreateWithdrawBiometricChallengeReq {
  string asset = 1; // 资产代码
  string chain = 2; // 网络
  string amount = 3; // 提现金额
  string address = 4; // 提现地址
  string memo_tag = 5; // 如需Memo/Tag
}

message CreateWithdrawAuditWhitelistBindingBiometricChallengeReq {
  repeated SetMyWithdrawAuditWhitelistBindingReqItem items = 1;
}

message CreateResetTradePasswordBiometricChallengeReq {
  string new_trade_password = 1; // 新资金密码（用于构造 payload_hash，避免“签名A提交B”）
}

