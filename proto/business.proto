  string id_number = 2; // 身份证号
  string birthday = 3; // 生日
  Gender gender = 4; // 性别
  string address = 5; // 地址
  string nickname = 6; // 昵称
  string avatar_url = 7; // 头像URL
}

message UpdateUserInfoResp {
  bool success = 1; // 是否成功
  string message = 2; // 返回消息
}

// ==================== Web3 User ====================
// 创建 Web3 用户请求
message CreateWeb3UserReq {
  string device_id = 1;         // 设备ID（客户端生成）
  string platform = 2;          // 平台：ios/android/web
  string os_version = 3;        // 操作系统版本
  string app_version = 4;       // 应用版本
  string device_model = 5;      // 设备型号
  string device_name = 6;       // 设备名称
  string push_token = 7;        // 推送令牌（可选）
  string locale = 8;            // 语言区域（可选）
}

message CreateWeb3UserResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息
  string device_id = 3;         // 设备ID
  int64 user_id = 4;            // Web3 用户ID
}

// 添加 Web3 用户地址
message AddWeb3UserAddressReq {
  string device_id = 1;         // 设备ID（用于查找 Web3 用户）
  string network = 2;           // 网络名称（Ethereum/BSC/Polygon/Tron）
  int64 chain_id = 3;           // 链ID
  string address = 4;           // 钱包地址
  bool is_primary = 5;          // 是否设为主地址（默认 false）
}

message AddWeb3UserAddressResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息
  int64 address_id = 3;         // 地址ID
  string address = 4;          // 钱包地址
}

// 批量添加 Web3 用户地址请求
message BatchAddWeb3UserAddressReq {
  string device_id = 1;         // 设备ID（用于查找 Web3 用户）
  repeated Web3AddressItem addresses = 2; // 地址列表
}

// Web3 地址项
message Web3AddressItem {
  string network = 1;          // 网络名称（Ethereum/BSC/Polygon/Tron）
  int64 chain_id = 2;          // 链ID
  string address = 3;          // 钱包地址
  bool is_primary = 4;         // 是否设为主地址（默认 false）
}

// 批量添加 Web3 用户地址响应
message BatchAddWeb3UserAddressResp {
  bool success = 1;             // 是否成功（全部成功才为 true）
  string message = 2;           // 返回消息
  int32 total_count = 3;        // 总数量
  int32 success_count = 4;     // 成功数量
  int32 failed_count = 5;      // 失败数量
  repeated BatchAddressResult results = 6; // 每个地址的处理结果
}

// 批量地址处理结果
message BatchAddressResult {
  string network = 1;          // 网络名称
  int64 chain_id = 2;          // 链ID
  string address = 3;          // 钱包地址
  bool success = 4;            // 是否成功
  string message = 5;          // 错误消息（失败时）
  int64 address_id = 6;        // 地址ID（成功时）
}

// 查询 Web3 可用链列表
message ListWeb3ChainsReq {}

message ListWeb3ChainsResp {
  bool success = 1;                      // 是否成功
  string message = 2;                    // 返回消息
  repeated Web3ChainItem chains = 3;     // 链列表
}

// 链信息
message Web3ChainItem {
  string name = 1;                       // 链名称（如 ETH/BSC/TRON）
  string network = 2;                    // 网络名称
  int32 chain_id = 3;                    // 链ID
  string explorer_url = 4;               // 区块浏览器 URL
  string icon_url = 5;                   // 图标 URL
}

// 获取 Web3 用户信息
message GetWeb3UserByDeviceIdReq {
  string device_id = 1;         // 设备ID
}

message Web3UserInfo {
  int64 user_id = 1;             // Web3 用户ID
  string device_id = 2;          // 设备ID
  string platform = 3;           // 平台
  string os_version = 4;         // OS 版本
  string app_version = 5;        // 应用版本
  string device_model = 6;       // 设备型号
  string device_name = 7;        // 设备名称
  string push_token = 8;         // 推送 token
  string locale = 9;             // 语言区域
  bool two_factor_enabled = 10;  // 是否开启二次验证
  bool biometric_enabled = 11;   // 是否开启生物识别
  bool has_trade_password = 12;  // 是否已设置交易密码
  string last_security_update = 13; // 安全设置最后更新时间（RFC3339，可为空）
  string last_active_at = 14;       // 最后活跃时间（RFC3339，可为空）
  string created_at = 15;           // 创建时间（RFC3339）
  string updated_at = 16;           // 更新时间（RFC3339）
}

message GetWeb3UserByDeviceIdResp {
  bool success = 1;               // 是否成功
  string message = 2;             // 返回消息
  Web3UserInfo user = 3;          // 用户信息
}

// 获取 Web3 用户资产概览请求
message GetWeb3AssetOverviewReq {
  string address = 1;           // 钱包地址（必填，查询该地址的资产）
  string network = 2;           // 网络（可选，如 Ethereum/BSC/TRON，用于过滤特定链的资产）
}

// Web3 资产项
message Web3AssetItem {
  string asset = 1;             // 资产代码（如 BTC/ETH/USDT）
  string network = 2;           // 网络（如 Bitcoin/Ethereum/Tron）
  int64 chain_id = 3;           // 链ID
  string address = 4;           // 钱包地址
  string balance = 5;           // 余额（最小单位，按 decimals 精度计算）
  string balance_usd = 6;       // 余额折合 USD
  string icon_url = 7;          // 图标 URL
  string price_change_24h = 8;  // 24小时涨跌幅（%）
  string price_usd = 9;         // 当前 USD 价格
  repeated string sparkline = 10; // 简易K线价格数组（24h）
  bool is_primary = 11;         // 是否主地址
  int32 decimals = 12;          // 展示精度（用于界面显示，如 USDT=6），balance字段按此精度
  int32 contract_decimals = 13; // 链上合约精度（用于构造交易，如 BSC USDT=18）
  string amount = 14;           // 链上精度的 raw 值，客户端直接用于构造交易
}

message GetWeb3AssetOverviewResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息
  string address = 3;           // 钱包地址
  string total_balance_usd = 4; // 总资产（USD估值）
  repeated Web3AssetItem items = 5; // 资产列表
  int32 token_count = 6;        // 代币种类数量
}

// ==================== Web3 交易记录 ====================
// 获取 Web3 交易记录列表请求（公开查询，无需认证）
message ListWeb3TransactionsReq {
  string address = 1;           // 钱包地址（必填）
  string asset_code = 2;        // 筛选资产（可选，如 ETH/USDT）
  string tx_type = 3;           // 筛选类型（可选：receive/send/swap/contract_call/approve）
  int64 start_time = 4;         // 开始时间戳（可选）
  int64 end_time = 5;           // 结束时间戳（可选）
  int32 page = 6;               // 页码（从1开始）
  int32 page_size = 7;          // 每页数量
  string chain_code = 8;        // 筛选链（可选，如 ETH/BSC/TRON）
}

// Web3 交易记录项
message Web3TransactionItem {
  string tx_hash = 1;           // 交易哈希
  string tx_type = 2;           // 交易类型（receive/send/swap/contract_call/approve）
  string tx_type_text = 3;      // 交易类型文案（已接收/已发送/代币兑换）
  string direction = 4;         // 方向（in/out）
  string asset_code = 5;        // 资产代码
  string amount = 6;            // 金额
  string amount_display = 7;    // 显示金额（如 +9.1223 USDT）
  string amount_usd = 8;        // USD 估值
  string from_address = 9;      // 发送方地址
  string to_address = 10;       // 接收方地址
  string status = 11;           // 状态（pending/confirmed/failed）
  string status_text = 12;      // 状态文案（交易中/已完成/失败）
  int64 block_time = 13;        // 区块时间戳
  string network = 14;          // 网络名称（Ethereum/Bitcoin）
  string icon_url = 15;         // 资产图标
  int64 created_at = 16;        // 交易创建时间戳（Unix秒）
  int64 id = 17;                // 对应 web3_balance_changes.id（用于详情去歧义）
  int32 event_index = 18;        // 事件索引（同一 tx_hash 下的事件序号；广播占位为 -1）
  string fee = 19;              // 手续费金额
  string fee_asset = 20;        // 手续费币种
}

message ListWeb3TransactionsResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息
  repeated Web3TransactionItem items = 3; // 交易记录列表
  int64 total = 4;              // 总数
}

// 获取 Web3 交易详情请求（公开查询，无需认证）
message GetWeb3TransactionDetailReq {
  int64 id = 1;                 // web3_balance_changes.id（必填，用于唯一定位某个地址视角的记录）
}

// Web3 交易详情
message GetWeb3TransactionDetailResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息

  // 基本信息
  string tx_hash = 3;           // 交易哈希
  string tx_type = 4;           // 交易类型
  string tx_type_text = 5;      // 交易类型文案
  string direction = 6;         // 方向

  // 金额信息
  string asset_code = 7;        // 资产代码
  string amount = 8;            // 金额
  string amount_display = 9;    // 显示金额
  string amount_usd = 10;       // USD 估值

  // 地址信息
  string from_address = 11;     // 发送方地址
  string from_label = 12;       // 发送方标签
  string to_address = 13;       // 接收方地址
  string to_label = 14;         // 接收方标签

  // 状态信息
  string status = 15;           // 状态
  string status_text = 16;      // 状态文案
  int32 confirmations = 17;     // 当前确认数
  int32 required_confirmations = 18; // 需要的确认数

  // 网络信息
  string network = 19;          // 网络名称
  int64 chain_id = 20;          // 链ID
  int64 block_number = 21;      // 区块高度
  int64 block_time = 22;        // 区块时间戳

  // 手续费
  string fee = 23;              // 手续费金额
  string fee_asset = 24;        // 手续费币种

  // 其他
  string icon_url = 25;         // 资产图标
  string explorer_url = 26;     // 区块浏览器链接
}

// Web3 交易结果查询请求（公开查询，无需认证）
message GetWeb3TransactionResultReq {
  string tx_hash = 1;           // 交易哈希（必填）
  string network = 2;           // 网络名称（可选，如 Ethereum/BSC/TRON，用于实时查询链上状态）
}

// Web3 交易结果响应
message GetWeb3TransactionResultResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息

  // 基本信息
  string tx_hash = 3;           // 交易哈希
  string network = 4;           // 网络名称
  int64 chain_id = 5;           // 链ID

  // 状态信息
  string status = 6;            // 状态（pending/confirmed/failed）
  string status_text = 7;       // 状态文案（交易中/已完成/失败）
  bool is_success = 8;          // 是否成功（confirmed 且未失败）
  int32 confirmations = 9;      // 当前确认数
  int32 required_confirmations = 10; // 需要的确认数

  // 区块信息
  int64 block_number = 11;      // 区块高度（0 表示未确认）
  int64 block_time = 12;        // 区块时间戳（0 表示未确认）

  // 数据来源
  string data_source = 13;      // 数据来源（database/chain，表示从数据库还是链上实时查询）
}

// ==================== Web3 支持的资产列表 ====================
// 获取 Web3 支持的资产列表请求（根据链查询）
message ListWeb3SupportedAssetsReq {
  string chain_code = 1;        // 链代码（如 ETH/BSC/TRON，必填）
  int32 precision = 2;           // 精度过滤（可选，0表示不过滤，只返回指定精度的资产）
}

// Web3 支持的资产项
message Web3SupportedAssetItem {
  string asset_code = 1;        // 资产代码（如 USDT/ETH/BTC）
  string asset_name = 2;        // 资产名称
  string chain_code = 3;        // 链代码
  string chain_name = 4;        // 链名称
  string chain_id = 12;         // 链ID
  string contract_address = 5;  // 合约地址（主币为空）
  string icon_url = 6;          // 资产图标 URL
  bool deposit_enabled = 7;     // 是否支持充值
  bool withdraw_enabled = 8;    // 是否支持提现
  string min_deposit_amount = 9;  // 最小充值金额（按 precision 精度）
  string min_withdraw_amount = 10; // 最小提现金额（按 precision 精度）
  int32 precision = 11;         // 展示精度（用于界面显示金额，如 USDT=6）
  int32 contract_decimals = 13; // 链上合约精度（用于构造交易，如 BSC USDT=18, ETH USDT=6）
}

message ListWeb3SupportedAssetsResp {
  bool success = 1;             // 是否成功
  string message = 2;           // 返回消息
  string chain_code = 3;        // 链代码
  repeated Web3SupportedAssetItem items = 4; // 资产列表
}

// ==================== Web3 交易广播 ====================
// 广播 Web3 交易请求
message BroadcastWeb3TransactionReq {
  string device_id = 1;                  // 设备ID（Web3用户标识，必填）
  string signed_transaction = 2;         // 已签名交易（hex编码，必填）
  string network = 3;                    // 网络名称（Ethereum/BSC/TRON，必填）
  string from_address = 4;               // 发送方地址（必填，用于验证地址归属）
  string to_address = 5;                 // 接收方地址（可选）
  string asset_code = 6;                 // 资产代码（可选，如 ETH/USDT）
  string amount = 7;                     // 金额（可选，用于记录）
  string tx_type = 8;                    // 交易类型（可选：send/receive/swap/contract_call，默认 send）
  bool wait_for_receipt = 9;             // 是否等待交易收据（可选，默认 false）
  int32 timeout_seconds = 10;            // 超时时间（可选，默认 30秒）
  // Swap 专用字段：用于在广播后补齐 swap_svc_transactions（不影响普通转账广播）
  string swap_id = 11;                   // ExecuteSwap 返回的 swap_id（可选；tx_type=swap 时建议传）
}

// 广播 Web3 交易响应
message BroadcastWeb3TransactionResp {
  bool success = 1;                      // 是否成功
  string message = 2;                    // 返回消息
  string tx_hash = 3;                    // 交易哈希
  string status = 4;                     // 交易状态（pending/confirmed/failed）
  int64 broadcasted_at = 5;              // 广播时间戳
  string block_number = 6;               // 区块号（如果 wait_for_receipt=true）
  optional bool swap_record_ok = 7;      // Swap 场景：是否成功补齐 swap_svc_transactions（失败不影响广播成功）
}

// ==================== 获取 Web3 Nonce ====================
message GetWeb3NonceReq {
  string device_id = 1;                  // 设备ID（用于验证 Web3 用户身份）
  string address = 2;                    // 地址
  string network = 3;                    // 网络名称（ETH/BSC/TRON）
  bool pending = 4;                      // 是否查询pending状态的nonce（默认true，包含待确认交易）
}

message GetWeb3NonceResp {
  bool success = 1;                      // 是否成功
  string message = 2;                    // 返回消息
  string nonce = 3;                      // 已确认的 nonce（不包含待确认交易）
  string pending_nonce = 4;              // pending nonce（包含待确认交易，推荐用于构建交易）
}

// ==================== 构建 TRON 交易 ====================
message BuildTronTransactionReq {
  string device_id = 1;                  // 设备ID（用于验证 Web3 用户身份）
  string from_address = 2;               // 发送方地址（必填）
  string to_address = 3;                 // 接收方地址（必填）
  string amount = 4;                     // 转账金额（必填，单位：SUN（TRX）或代币最小单位（TRC20））
  string contract_address = 5;           // 代币合约地址（可选，为空则为 TRX 转账，有值则为 TRC20 代币转账）
}

message BuildTronTransactionResp {
  bool success = 1;                      // 是否成功
  string message = 2;                    // 返回消息
  string raw_data = 3;                   // 未签名的交易 rawData（hex编码的protobuf序列化数据，供客户端签名）
}

// ==================== Web3 代币详细信息 ====================
// 获取 Web3 代币详细信息请求（公开查询，无需认证）
message GetWeb3TokenDetailReq {
  string asset_code = 1;                // 资产代码（如 TRX/USDT/ETH，必填）
  string network = 2;                    // 网络名称（如 TRON/Ethereum/BSC，必填）
  string contract_address = 3;          // 合约地址（可选，系统会根据 asset_code 和 network 自动查找）
}

// Web3 代币详细信息响应
message GetWeb3TokenDetailResp {
  bool success = 1;                      // 是否成功
  string message = 2;                    // 返回消息

  // 价格信息
  string price_usd = 3;                 // 当前 USD 价格
  string price_change_24h = 4;          // 24小时涨跌幅（%，如 "+0.05"）

  // 基本信息
  string contract_address = 5;         // 合约地址（主币为空或 "~"）
  string network = 6;                    // 网络名称（如 "波场"/"Ethereum"）
  string mint_time = 7;                 // 铸造时间（可选，如 "~" 表示未知）
  string issuer_address = 8;           // 发行地址（可选，如 "~" 表示未知）

  // 概览信息
  string total_supply = 9;               // 总供应量
  string circulating_supply = 10;       // 流通供应量
  string total_market_cap = 11;         // 总市值（USD）
  string circulating_market_cap = 12;   // 流通市值（USD）
  string holders = 13;                  // 持有者数量（可选，如 "~" 表示未知）

  // 其他信息
  string symbol = 14;                    // 代币符号
  string name = 15;                     // 代币名称
  uint32 decimals = 16;                  // 精度
  string icon_url = 17;                 // 图标 URL
  int64 chain_id = 18;                  // 链ID
}
