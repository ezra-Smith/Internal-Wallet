  string total_balance_usd_raw = 5;  // 总余额USD（分，DECIMAL(65,0)）
  string pending_sweep_usd = 6;     // 待归集总额USD
  string pending_sweep_usd_raw = 7;  // 待归集总额USD（分，DECIMAL(65,0)）
  int64 last_24h_sweep_count = 8;   // 24小时归集次数
  double sweep_success_rate = 9;    // 归集成功率
}

message GetDepositAddressBalanceStatsResponse {
  bool success = 1;
  string message = 2;
  GetDepositAddressBalanceStatsData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

// UpdateDepositAddressBalance - 更新余额（ChainSync使用）
message UpdateDepositAddressBalanceRequest {
  int64 deposit_address_id = 1;     // 充值地址ID
  int64 user_id = 2;                // 用户ID
  string asset_code = 3;            // 币种
  string chain_code = 4;            // 链
  string balance = 5;               // 余额
  string balance_raw = 6;            // 余额（最小单位，DECIMAL(65,0)）
  string balance_usd = 7;           // USD估值
  string balance_usd_raw = 8;        // USD估值（分，DECIMAL(65,0)）
  string sweep_threshold_raw = 9;    // 归集阈值（DECIMAL(65,0)）
  string sync_status = 10;          // 同步状态
  string sync_error = 11;           // 同步错误（可选）
}

message UpdateDepositAddressBalanceData {
  DepositAddressBalanceItem balance = 1;
  bool marked_for_sweep = 2;        // 是否被标记为待归集
}

message UpdateDepositAddressBalanceResponse {
  bool success = 1;
  string message = 2;
  UpdateDepositAddressBalanceData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

// GetDepositAddressBalanceByAsset - 按币种统计待归集金额（币种分布）
message GetDepositAddressBalanceByAssetRequest {
  string asset_code = 1;  // 币种筛选（可选，空则返回所有币种）
}

message AssetBalanceStats {
  string asset_code = 1;           // 币种代码
  string asset_name = 2;           // 币种名称
  int64 address_count = 3;         // 地址数
  string total_balance = 4;        // 总余额
  string total_balance_raw = 5;     // 总余额（最小单位，DECIMAL(65,0)）
  string total_balance_usd = 6;    // USD估值
  string total_balance_usd_raw = 7; // USD估值（分，DECIMAL(65,0)）
  string percentage = 8;           // 占总余额的百分比
}

message GetDepositAddressBalanceByAssetData {
  repeated AssetBalanceStats assets = 1;  // 币种统计列表
  string total_balance_usd = 2;           // 所有币种总余额USD
  string total_balance_usd_raw = 3;        // 所有币种总余额USD（分，DECIMAL(65,0)）
}

message GetDepositAddressBalanceByAssetResponse {
  bool success = 1;
  string message = 2;
  GetDepositAddressBalanceByAssetData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

// ============================================================================
// Dashboard Statistics
// ============================================================================

// ==================== Dashboard Overview (Fast Stats) ====================
message GetDashboardOverviewRequest {
  bool force_refresh = 1;  // 可选：强制刷新缓存
}

message GetDashboardOverviewResponse {
  bool success = 1;
  string message = 2;
  DashboardOverviewData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

message DashboardOverviewData {
  UserStatsOverview user_stats = 1;              // Web2用户统计
  VaultBalanceOverview vault_balance = 2;        // 金库余额概览
  TransferOverview today_transfer = 3;           // 今日转账概览
  ApprovalOverview approval_stats = 4;           // 审批概览
  UserStatusDistribution user_status_dist = 5;   // 用户状态分布
  int32 supported_currencies = 6;                // 系统支持币种数
}

message UserStatsOverview {
  int64 total_users = 1;              // 总用户数
  int64 today_new_users = 2;          // 今日新增
  double growth_rate = 3;             // 增长率（对比昨日）
  int64 active_users_7d = 4;          // 近7日活跃用户
}

message VaultBalanceOverview {
  string total_balance_usd = 1;       // 总余额（USD）
  string today_change_usd = 2;        // 今日变化（简化版：可返回"0"）
  double change_rate = 3;             // 变化率
}

message TransferOverview {
  string today_amount_usd = 1;        // 今日转账金额
  int32 today_count = 2;              // 今日转账笔数
  double growth_rate = 3;             // 对比昨日增长率
}

message ApprovalOverview {
  int32 pending_count = 1;            // 待审批提现数
  int32 today_new_count = 2;          // 今日新增待审批
  int32 today_withdrawal_count = 3;   // 今日提现笔数
}

message UserStatusDistribution {
  int64 normal = 1;
  int64 frozen = 2;
  int64 terminated = 3;
  double normal_rate = 4;
  double frozen_rate = 5;
  double terminated_rate = 6;
}

// ==================== Dashboard Trends (Heavy Queries) ====================
message GetDashboardTrendsRequest {
  int32 fund_flow_months = 1;   // 资金流水月份数（默认6）
  int32 transfer_days = 2;      // 转账趋势天数（默认7）
  bool force_refresh = 3;
}

message GetDashboardTrendsResponse {
  bool success = 1;
  string message = 2;
  DashboardTrendsData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

message DashboardTrendsData {
  FundFlowTrend fund_flow_trend = 1;                     // 资金流水趋势（按月）
  TransferBatchTrend transfer_batch_trend = 2;           // 转账批次执行趋势（按日）
  WithdrawalApprovalDistribution approval_distribution = 3;  // 提现审批状态分布（饼图）
  repeated VaultCurrencyBalance vault_top_currencies = 4;    // Vault币种余额 Top 5
}

message FundFlowTrend {
  repeated FundFlowDataPoint data_points = 1;
}

message FundFlowDataPoint {
  string period = 1;              // "2024-07"
  string deposit_amount = 2;      // 充值总额
  string withdrawal_amount = 3;   // 提现总额
  string transfer_amount = 4;     // 转账总额
  string total_amount = 5;        // 总流水
}

message TransferBatchTrend {
  repeated TransferBatchDataPoint data_points = 1;
}

message TransferBatchDataPoint {
  string date = 1;                // "2024-12-25"
  int32 total_batches = 2;
  int32 completed_batches = 3;
  int32 failed_batches = 4;
  double success_rate = 5;        // 成功率（%）
}

message WithdrawalApprovalDistribution {
  int32 pending = 1;
  int32 approved = 2;
  int32 rejected = 3;
  int32 cancelled = 4;
}

message VaultCurrencyBalance {
  int32 rank = 1;
  string currency = 2;
  string balance = 3;
  string balance_usd = 4;
  double percentage = 5;          // 占总余额百分比
}

// ==================== Dashboard Activities (Frequently Refreshed) ====================
message GetDashboardActivitiesRequest {
  int32 page = 1;         // 页码（默认1）
  int32 page_size = 2;    // 每页数量（默认20）
}

message GetDashboardActivitiesResponse {
  bool success = 1;
  string message = 2;
  DashboardActivitiesData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

message DashboardActivitiesData {
  repeated RecentActivity activities = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message RecentActivity {
  string activity_type = 1;     // transfer_batch, withdrawal_approval, user_registration, vault_adjustment
  string title = 2;             // 标题（简短描述）
  string description = 3;       // 详细描述
  string related_id = 4;        // 关联记录ID
  int64 created_at = 5;         // Unix timestamp (seconds)
  string operator = 6;          // 操作人（用户UID或管理员名称）
  string status_icon = 7;       // success/warning/error/info（前端图标提示）
}

