  string asset_code = 1;
  string asset_name = 2;
  int32 status = 3; // 1=enabled 2=disabled
  CurrencyFeatureSettings settings = 4;
  int32 chain_total = 5;
  int32 chain_enabled = 6;
  string updated_at = 7;
  string icon_url = 8; // http(s) icon URL (optional)
  int32 precision = 9; // 精度（小数位数，0-30）
}

message CurrencyChainSettingItem {
  string chain_code = 1;
  string chain_name = 2;
  int32 status = 3; // 1=enabled 2=disabled
  bool deposit_enabled = 4;
  bool withdraw_enabled = 5;
  string min_withdraw_amount = 6;
  string min_deposit_amount = 7;
  string contract_address = 8; // optional, empty for native token
  google.protobuf.Int32Value token_decimals = 13; // optional, required when contract_address is set (0..30)
  google.protobuf.BoolValue web3_asset_display_enabled = 9; // optional, default true when absent
  string chain_icon_url = 10; // chain logo URL (http/https)
  int64 id = 11; // currency_chain_settings.id (0 = new)
  bool consolidation_enabled = 12; // 归集开关（1=开启 0=关闭）
}

message CurrencyWithdrawFeeRuleItem {
  int64 id = 1;
  string rule_type = 2; // fixed|percent
  string value = 3; // fixed=token amount; percent=0-100
  string min_fee = 4; // 百分比规则的手续费下限
  string max_fee = 5; // 百分比规则的手续费上限
  string min_amount = 8; // 规则适用的最小提现金额（金额区间下限）
  string max_amount = 9; // 规则适用的最大提现金额（金额区间上限，NULL=无上限）
  bool enabled = 6;
  int32 sort_order = 7;
}

message CurrencyChainFeeRules {
  string chain_code = 1;
  repeated CurrencyWithdrawFeeRuleItem rules = 2;
}

message CurrencyWithdrawAuditRuleItem {
  int64 id = 1;
  string min_amount = 2; // 区间下限（资产本位）
  string max_amount = 3; // 区间上限（资产本位，空=无上限）
  string strategy = 4;   // auto|manual_auto|manual_manual
  bool enabled = 5;
  int32 sort_order = 6;
}

message CurrencyChainAuditRules {
  string chain_code = 1;
  repeated CurrencyWithdrawAuditRuleItem rules = 2;
}

