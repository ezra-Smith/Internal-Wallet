// AdminMenu represents a menu item (admin_menu).
message AdminMenu {
  int64 id = 1;
  int64 pid = 2;
  int32 level = 3;
  string tree = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  bool hide_in_menu = 8;
  bool hide_children_in_menu = 9;
  int32 sort = 10;
  string remark = 11;
  int32 status = 12;
  string updated_at = 13;
  string created_at = 14;
  string deleted_at = 15;
  string target = 16;
  string access = 17;
  string key = 18;
  repeated AdminMenu children = 19; // used by GetMenuTree / user_menu_tree
}

// AdminPermission represents a permission (admin_permission).
message AdminPermission {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  int64 menu_id = 5; // 0 means NULL/global permission
  int32 status = 6;
  string created_at = 7;
  string updated_at = 8;
  string deleted_at = 9;
}

