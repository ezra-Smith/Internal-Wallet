}

message AdminGetAlertConfigWithStatsResponse {
  bool success = 1;
  string message = 2;
  AdminAlertConfigItem config = 3;
  AdminAlertConfigStats stats = 4;
}

message AdminAlertConfigStats {
  string current_window_amount = 1;
  int32 current_window_tx_count = 2;
  string progress_percentage = 3;
  bool is_in_cooldown = 4;
  int32 cooldown_remaining_seconds = 5;
}

// ============================================================================
// Accounting - User Transaction Records
// ============================================================================

// 用户交易记录列表查询
message AccountingListUserTransactionRecordsRequest {
  int64 user_id = 1;           // 用户ID
  int32 page = 2;              // 页码
  int32 page_size = 3;         // 每页数量
  int32 tx_type = 4;           // 交易类型（0=全部, 1=充值, 2=提现，3=内部转账）
  string asset_code = 5;       // 资产代码（可选筛选）
  string chain_code = 6;       // 链代码（可选筛选）
  string status = 7;           // 状态（可选筛选）
  int64 start_time = 8;        // 开始时间（Unix秒）
  int64 end_time = 9;          // 结束时间（Unix秒）
}

message AccountingListUserTransactionRecordsResponse {
  bool success = 1;
  string message = 2;
  int64 total = 3;
  repeated AccountingUserTransactionRecordItem items = 4;
  Pagination pagination = 5;
  string request_id = 6;
  string timestamp = 7;
}

// 用户交易记录详情查询
message AccountingGetUserTransactionRecordDetailRequest {
  int64 id = 1;  // 记录ID
}

message AccountingGetUserTransactionRecordDetailResponse {
  bool success = 1;
  string message = 2;
  AccountingUserTransactionRecordItem item = 3;
  string request_id = 4;
  string timestamp = 5;
}

// 用户交易记录项
message AccountingUserTransactionRecordItem {
  int64 id = 1;
  int64 user_id = 2;
  int32 tx_type = 3;           // 1=deposit(充值), 2=withdraw(提现), 3=internal_transfer(内部转账)
  string asset_code = 4;
  string chain_code = 5;
  string amount_decimal = 6;   // 交易金额
  string fee_decimal = 7;      // 手续费
  string status = 8;           // pending/completed/failed
  string memo = 9;             // 备注
  string from_address = 10;    // 发送地址
  string to_address = 11;      // 接收地址
  string tx_hash = 12;         // 交易哈希
  int64 timestamp = 13;        // 创建时间（Unix秒）
  int64 freeze_ledger_tx_id = 14;  // 冻结账本交易ID
  int64 settle_ledger_tx_id = 15;  // 结算账本交易ID
  int64 confirm_ledger_tx_id = 16; // 确认账本交易ID（充值时使用）
  string biz_ref = 17;             // 业务引用
  string idempotency_key = 18;     // 幂等性键
  string created_at = 19;          // 创建时间（格式：2006-01-02 15:04:05）
  string updated_at = 20;          // 更新时间（格式：2006-01-02 15:04:05）
}
