}

message AdminCreateAlertConfigResponse {
  bool success = 1;
  string message = 2;
  int64 config_id = 3;
  AdminAlertConfigItem config = 4;
}

message AdminUpdateAlertConfigRequest {
  int64 config_id = 1;
  string name = 2;
  string description = 3;
  string threshold_usd = 4;
  int32 time_window_seconds = 5;
  bool monitor_web3_withdraw = 6;
  bool monitor_web2_withdraw = 7;
  bool monitor_internal_transfer = 8;
  bool enabled = 9;
  bool test_mode = 10;
  int32 cooldown_seconds = 11;
}

message AdminUpdateAlertConfigResponse {
  bool success = 1;
  string message = 2;
  AdminAlertConfigItem config = 3;
}

message AdminDeleteAlertConfigRequest {
  int64 config_id = 1;
}

message AdminDeleteAlertConfigResponse {
  bool success = 1;
  string message = 2;
}

message AdminGetAlertConfigRequest {
  int64 config_id = 1;
}

message AdminGetAlertConfigResponse {
  bool success = 1;
  string message = 2;
  AdminAlertConfigItem config = 3;
}

message AdminToggleAlertConfigRequest {
  int64 config_id = 1;
  bool enabled = 2;
}

message AdminToggleAlertConfigResponse {
  bool success = 1;
  string message = 2;
  AdminAlertConfigItem config = 3;
}

message AdminGetAlertConfigWithStatsRequest {
