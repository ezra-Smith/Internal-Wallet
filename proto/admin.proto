message Web3DeviceInfo {
  string platform = 1; // iOS/Android
  string os_version = 2; // 系统版本（如：iOS 16.0, Android 13）
  string app_version = 3; // 应用版本（如：1.0.5）
  string device_model = 4; // 设备型号（如：iPhone 14 Pro, SM-G998B）
  string device_name = 5; // 设备名称（用户自定义）
  string push_token = 6; // 推送通知令牌
  string locale = 7; // 语言/地区（如：zh-CN, en-US）
  string last_active_at = 8; // 最后活跃时间
  string created_at = 9;     // 创建时间
}

message Web3SecurityInfo {
  bool two_factor_enabled = 1; // 双因素认证是否启用
  string two_factor_type = 2; // 双因素认证类型（如：totp, sms）
  bool biometric_enabled = 3; // 生物识别是否启用
  string biometric_type = 4; // 生物识别类型（如：face_id, touch_id, fingerprint）
  string last_security_update = 5; // 最后安全设置更新时间
}

message Web3TokenBalance {
  string currency = 1; // 代币符号（如：USDT, ETH, WBTC）
  string balance = 2; // 代币余额（原始单位）
  string balance_usd = 3; // USD 等值
}

message Web3WalletAddress {
  string network = 1; // 网络名称（如：Ethereum, BSC, Polygon）
  int64 chain_id = 2; // 链ID（如：1=Ethereum, 56=BSC）
  string address = 3; // 钱包地址
  bool is_primary = 4; // 是否为主地址
  bool enabled = 5; // 地址是否启用
  bool is_blacklisted = 6; // 是否在黑名单中
  string balance = 7; // 主币余额（如：ETH, BNB）
  string balance_usd = 8; // 主币余额的 USD 等值
  repeated Web3TokenBalance token_balances = 9; // 代币余额列表
  string created_at = 10; // 地址添加时间
  string last_transaction_at = 11; // 最后交易时间
  string blacklist_reason = 12; // 黑名单原因
  string risk_level = 13; // 风险级别（high | medium | low）
  string blacklisted_at = 14; // 加入黑名单时间
  string blacklisted_by = 15; // 加入黑名单的操作员
}

message Web3UserActivitySummary {
  int64 total_transactions = 1; // 总交易数
  string total_deposit_usd = 2; // 总充值金额（USD）
  string total_withdrawal_usd = 3; // 总提现金额（USD）
  string total_swap_usd = 4; // 总兑换金额（USD）
  string first_transaction_at = 5; // 首次交易时间
  string last_transaction_at = 6; // 最后交易时间
}

message Web3UserListItem {
  string id = 1; // web3-<id>
  string device_id = 2; // 设备ID（唯一标识）
  Web3DeviceInfo device_info = 3; // 设备信息
  int32 wallet_count = 4; // 钱包地址数量
  repeated string networks = 5; // 使用的网络列表（如：["Ethereum", "BSC"]）
  string primary_address = 6; // 主钱包地址
  string total_balance_usd = 7; // 总资产（USD）
  bool two_factor_enabled = 8; // 双因素认证是否启用
  bool biometric_enabled = 9; // 生物识别是否启用
  bool has_blacklisted_address = 10; // 是否有黑名单地址
  string last_active_at = 11; // 最后活跃时间
  string created_at = 12; // 创建时间
}

message Web3UserListSummary {
  int64 total_devices = 1; // 设备总数
  int64 total_addresses = 2; // 地址总数
  int64 blacklisted_addresses = 3; // 黑名单地址数
  string two_factor_rate = 4; // 双因素认证启用率（如：75.5%）
}

message ListWeb3UsersRequest {
  int32 page = 1;
