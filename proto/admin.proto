syntax = "proto3";

package admin;

option go_package = "./pb";

import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Zink Wallet Admin API"
    version: "v1"
    description: "Admin API (served via api-gateway)"
  }
  host: "127.0.0.1:8080"
  schemes: HTTP
  schemes: HTTPS
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Bearer Token，格式：Bearer {token}"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
};

// ============================================================================
// Admin Service - 后台管理 (仅 Admin IAM v1)
// 说明：
// - 本项目通过 api-gateway 将 HTTP 请求转发到 gRPC。
// - JSON 字段名由 proto 字段名生成（snake_case）。
// ============================================================================

service Admin {
  // ==================== Auth ====================
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // ==================== Wallet Init / Signer Unlock ====================
  rpc GetHotWalletRuntimeStatus(AdminGetHotWalletRuntimeStatusRequest) returns (AdminGetHotWalletRuntimeStatusResponse);
  rpc StartHotWalletInit(AdminStartHotWalletInitRequest) returns (AdminStartHotWalletInitResponse);
  rpc GetHotWalletMnemonicPage(AdminGetHotWalletMnemonicPageRequest) returns (AdminGetHotWalletMnemonicPageResponse);
  rpc GetHotWalletMnemonicChallenge(AdminGetHotWalletMnemonicChallengeRequest) returns (AdminGetHotWalletMnemonicChallengeResponse);
  rpc VerifyHotWalletMnemonicChallenge(AdminVerifyHotWalletMnemonicChallengeRequest) returns (AdminVerifyHotWalletMnemonicChallengeResponse);
  rpc UnlockSignerHotWallet(AdminUnlockSignerHotWalletRequest) returns (AdminUnlockSignerHotWalletResponse);

  // ==================== Admin MFA Flow (HTTP: /api/v1/admin/auth/*) ====================
  // Captcha key1 -> temp_key key2 -> password login -> auth_key key3 (2FA bind) / session_identifier (2FA verify)
  rpc AdminMFACaptchaGenerate(AdminMFACaptchaGenerateRequest) returns (AdminMFACaptchaGenerateResponse);
  rpc AdminMFACaptchaValidate(AdminMFACaptchaValidateRequest) returns (AdminMFACaptchaValidateResponse);
  rpc AdminMFALogin(AdminMFALoginRequest) returns (AdminMFALoginResponse);
  rpc AdminMFAGetTwoFAQrCode(AdminMFAGetTwoFAQrCodeRequest) returns (AdminMFAGetTwoFAQrCodeResponse);
  rpc AdminMFABindTwoFA(AdminMFABindTwoFARequest) returns (AdminMFABindTwoFAResponse);
  rpc AdminMFAVerifyTwoFA(AdminMFAVerifyTwoFARequest) returns (AdminMFAVerifyTwoFAResponse);

  // ==================== Admin Users ====================
  rpc ListAdmins(ListAdminsRequest) returns (ListAdminsResponse);
  rpc CreateAdmin(CreateAdminRequest) returns (CreateAdminResponse);
  rpc UpdateAdmin(UpdateAdminRequest) returns (UpdateAdminResponse);
  rpc DisableAdmin(DisableAdminRequest) returns (DisableAdminResponse);
  rpc ResetAdminPassword(ResetAdminPasswordRequest) returns (ResetAdminPasswordResponse);
  rpc ResetAdminTwoFA(ResetAdminTwoFARequest) returns (ResetAdminTwoFAResponse);
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse);

  // ==================== Users (Web2) ====================
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUsersStatistics(GetUsersStatisticsRequest) returns (GetUsersStatisticsResponse);
  rpc ListUserWithdrawAuditWhitelistRules(ListUserWithdrawAuditWhitelistRulesRequest) returns (ListUserWithdrawAuditWhitelistRulesResponse);
  rpc UpsertUserWithdrawAuditWhitelistRules(UpsertUserWithdrawAuditWhitelistRulesRequest) returns (UpsertUserWithdrawAuditWhitelistRulesResponse);
  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse);
  rpc FreezeUser(FreezeUserRequest) returns (FreezeUserResponse);
  rpc UnfreezeUser(UnfreezeUserRequest) returns (UnfreezeUserResponse);
  rpc TerminateUser(TerminateUserRequest) returns (TerminateUserResponse);
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
  rpc UpdateUserMemberLevel(UpdateUserMemberLevelRequest) returns (UpdateUserMemberLevelResponse);
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse);
  rpc ResetUserTradePassword(ResetUserTradePasswordRequest) returns (ResetUserTradePasswordResponse);
  rpc UnlockTradePassword(UnlockTradePasswordRequest) returns (UnlockTradePasswordResponse);
  rpc UpdateUserWithdrawAuditWhitelist(UpdateUserWithdrawAuditWhitelistRequest) returns (UpdateUserWithdrawAuditWhitelistResponse);
  rpc UnbindUserTotp(UnbindUserTotpRequest) returns (UnbindUserTotpResponse);
  rpc ListUser2FAHistory(ListUser2FAHistoryRequest) returns (ListUser2FAHistoryResponse);
  rpc AddUserNote(AddUserNoteRequest) returns (AddUserNoteResponse);
  rpc ExportUsers(ExportUsersRequest) returns (ExportUsersResponse);

  // ==================== My (Profile + RBAC) ====================
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // ==================== Security (My Account) ====================
  rpc GetMySecuritySettings(GetMySecuritySettingsRequest) returns (GetMySecuritySettingsResponse);
  rpc StartTwoFASetup(StartTwoFASetupRequest) returns (StartTwoFASetupResponse);
  rpc ConfirmTwoFASetup(ConfirmTwoFASetupRequest) returns (ConfirmTwoFASetupResponse);
  rpc StartTwoFARebind(StartTwoFARebindRequest) returns (StartTwoFARebindResponse);
  rpc DisableTwoFA(DisableTwoFARequest) returns (DisableTwoFAResponse);

  // ==================== RBAC v2 (My) ====================
  rpc GetMyRBAC(GetMyRBACRequest) returns (GetMyRBACResponse);
  // RBAC v2 (UI helpers) - for frontend permission gating (scheme B)
  rpc GetRbacPermissionMap(GetRbacPermissionMapRequest) returns (GetRbacPermissionMapResponse);

  // ==================== RBAC v2 (Menus / Permissions / Roles) ====================
  // -------- Menus --------
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuResponse);
  rpc UpdateMenu(UpdateMenuRequest) returns (UpdateMenuResponse);
  rpc DeleteMenu(DeleteMenuRequest) returns (DeleteMenuResponse);
  rpc GetMenuById(GetMenuByIdRequest) returns (GetMenuByIdResponse);
  rpc ListMenus(ListMenusRequest) returns (ListMenusResponse);
  rpc GetMenuTree(GetMenuTreeRequest) returns (GetMenuTreeResponse);

  // -------- Permissions --------
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse);
  rpc UpdatePermission(UpdatePermissionRequest) returns (UpdatePermissionResponse);
  rpc DeletePermission(DeletePermissionRequest) returns (DeletePermissionResponse);
  rpc GetPermissionById(GetPermissionByIdRequest) returns (GetPermissionByIdResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc GetPermissionsByMenuId(GetPermissionsByMenuIdRequest) returns (GetPermissionsByMenuIdResponse);

  // -------- Roles --------
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc GetRoleById(GetRoleByIdRequest) returns (GetRoleByIdResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignMenusToRole(AssignMenusToRoleRequest) returns (AssignMenusToRoleResponse);
  rpc AssignPermissionsToRole(AssignPermissionsToRoleRequest) returns (AssignPermissionsToRoleResponse);
  rpc AssignRolesToUser(AssignRolesToUserRequest) returns (AssignRolesToUserResponse);
  rpc GetRoleMenus(GetRoleMenusRequest) returns (GetRoleMenusResponse);
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse);
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);

  // ==================== System Settings ====================
  rpc GetSystemConfig(GetSystemConfigRequest) returns (GetSystemConfigResponse);
  rpc UpdateSystemConfig(UpdateSystemConfigRequest) returns (UpdateSystemConfigResponse);
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse);

  // ==================== Alert Configs ====================
  rpc ListAlertConfigs(AdminListAlertConfigsRequest) returns (AdminListAlertConfigsResponse);
  rpc CreateAlertConfig(AdminCreateAlertConfigRequest) returns (AdminCreateAlertConfigResponse);
  rpc UpdateAlertConfig(AdminUpdateAlertConfigRequest) returns (AdminUpdateAlertConfigResponse);
  rpc DeleteAlertConfig(AdminDeleteAlertConfigRequest) returns (AdminDeleteAlertConfigResponse);
  rpc GetAlertConfig(AdminGetAlertConfigRequest) returns (AdminGetAlertConfigResponse);
  rpc ToggleAlertConfig(AdminToggleAlertConfigRequest) returns (AdminToggleAlertConfigResponse);
  rpc GetAlertConfigWithStats(AdminGetAlertConfigWithStatsRequest) returns (AdminGetAlertConfigWithStatsResponse);

  // ==================== Audit Logs ====================
  rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);

  // ==================== Swap Configuration (Simplified Architecture) ====================
  // API Key 管理（用于项目接入Swap服务）
  rpc CreateSwapApiKey(AdminCreateSwapApiKeyRequest) returns (AdminCreateSwapApiKeyResponse);
  rpc RevokeSwapApiKey(AdminRevokeSwapApiKeyRequest) returns (AdminRevokeSwapApiKeyResponse);
  rpc ListSwapApiKeys(AdminListSwapApiKeysRequest) returns (AdminListSwapApiKeysResponse);

  // Provider管理
  rpc ListSwapProvidersForDropdown(AdminListSwapProvidersForDropdownRequest) returns (AdminListSwapProvidersForDropdownResponse);
  rpc ListSwapProviders(AdminListSwapProvidersRequest) returns (AdminListSwapProvidersResponse);
  rpc GetSwapProviderDetail(AdminGetSwapProviderDetailRequest) returns (AdminGetSwapProviderDetailResponse);
  rpc CreateSwapProvider(AdminCreateSwapProviderRequest) returns (AdminCreateSwapProviderResponse);
  rpc UpdateSwapProvider(AdminUpdateSwapProviderRequest) returns (AdminUpdateSwapProviderResponse);
  rpc DeleteSwapProvider(AdminDeleteSwapProviderRequest) returns (AdminDeleteSwapProviderResponse);
  rpc EnableSwapProvider(AdminEnableSwapProviderRequest) returns (AdminEnableSwapProviderResponse);
  rpc DisableSwapProvider(AdminDisableSwapProviderRequest) returns (AdminDisableSwapProviderResponse);

  // Config管理
  rpc ListSwapConfigs(AdminListSwapConfigsRequest) returns (AdminListSwapConfigsResponse);
  rpc GetSwapConfigDetail(AdminGetSwapConfigDetailRequest) returns (AdminGetSwapConfigDetailResponse);
  rpc CreateSwapConfig(AdminCreateSwapConfigRequest) returns (AdminCreateSwapConfigResponse);
  rpc UpdateSwapConfigDetail(AdminUpdateSwapConfigDetailRequest) returns (AdminUpdateSwapConfigDetailResponse);
  rpc DeleteSwapConfig(AdminDeleteSwapConfigRequest) returns (AdminDeleteSwapConfigResponse);
  rpc ListProjectSwapConfigs(AdminListProjectSwapConfigsRequest) returns (AdminListProjectSwapConfigsResponse);
  rpc EnableSwapConfigForProject(AdminEnableSwapConfigForProjectRequest) returns (AdminEnableSwapConfigForProjectResponse);
  rpc DisableSwapConfigForProject(AdminDisableSwapConfigForProjectRequest) returns (AdminDisableSwapConfigForProjectResponse);
  rpc ListSwapTransactions(AdminListSwapTransactionsRequest) returns (AdminListSwapTransactionsResponse);

  // ==================== Wallet Assets ====================
  // -------- Currencies (Business Assets) --------
  // 获取币种总览
  rpc GetCurrencyOverview(GetCurrencyOverviewRequest) returns (GetCurrencyOverviewResponse);
  rpc CreateCurrency(CreateCurrencyRequest) returns (CreateCurrencyResponse);
  rpc UpdateCurrency(UpdateCurrencyRequest) returns (UpdateCurrencyResponse);
  rpc GetCurrency(GetCurrencyRequest) returns (GetCurrencyResponse);
  rpc ListCurrencies(ListCurrenciesRequest) returns (ListCurrenciesResponse);
  rpc GetCurrencyConfig(GetCurrencyConfigRequest) returns (GetCurrencyConfigResponse);
  rpc UpdateCurrencyConfig(UpdateCurrencyConfigRequest) returns (UpdateCurrencyConfigResponse);
  rpc UpdateCurrencyStatus(UpdateCurrencyStatusRequest) returns (UpdateCurrencyStatusResponse);
  rpc GetCurrencyGlobalWithdrawFee(GetCurrencyGlobalWithdrawFeeRequest) returns (GetCurrencyGlobalWithdrawFeeResponse);
  rpc UpdateCurrencyGlobalWithdrawFee(UpdateCurrencyGlobalWithdrawFeeRequest) returns (UpdateCurrencyGlobalWithdrawFeeResponse);
  rpc GetCurrencyGlobalWithdrawAudit(GetCurrencyGlobalWithdrawAuditRequest) returns (GetCurrencyGlobalWithdrawAuditResponse);
  rpc UpdateCurrencyGlobalWithdrawAudit(UpdateCurrencyGlobalWithdrawAuditRequest) returns (UpdateCurrencyGlobalWithdrawAuditResponse);
  rpc GetCurrencyGlobalTransferAudit(GetCurrencyGlobalTransferAuditRequest) returns (GetCurrencyGlobalTransferAuditResponse);
  rpc UpdateCurrencyGlobalTransferAudit(UpdateCurrencyGlobalTransferAuditRequest) returns (UpdateCurrencyGlobalTransferAuditResponse);

  // -------- Chains --------
  rpc ListChains(ListChainsRequest) returns (ListChainsResponse);
  rpc UpdateChainIcon(UpdateChainIconRequest) returns (UpdateChainIconResponse);

  // -------- Accounting (Ledger) --------
  rpc AccountingListAccountTypes(AccountingListAccountTypesRequest) returns (AccountingListAccountTypesResponse);
  rpc AccountingCreateAccountType(AccountingCreateAccountTypeRequest) returns (AccountingCreateAccountTypeResponse);
  rpc AccountingUpdateAccountType(AccountingUpdateAccountTypeRequest) returns (AccountingUpdateAccountTypeResponse);
  rpc AccountingDeleteAccountType(AccountingDeleteAccountTypeRequest) returns (AccountingDeleteAccountTypeResponse);
  rpc AccountingSetAccountTypeAssets(AccountingSetAccountTypeAssetsRequest) returns (AccountingSetAccountTypeAssetsResponse);

  rpc AccountingEnsureUserSetup(AccountingEnsureUserSetupRequest) returns (AccountingEnsureUserSetupResponse);
  rpc AccountingGetUserBalances(AccountingGetUserBalancesRequest) returns (AccountingGetUserBalancesResponse);
  rpc AccountingEnsureSystemAccounts(AccountingEnsureSystemAccountsRequest) returns (AccountingEnsureSystemAccountsResponse);
  rpc AccountingListLedgerTx(AccountingListLedgerTxRequest) returns (AccountingListLedgerTxResponse);
  rpc AccountingGetLedgerTxDetail(AccountingGetLedgerTxDetailRequest) returns (AccountingGetLedgerTxDetailResponse);
  rpc AccountingListUserTransactionRecords(AccountingListUserTransactionRecordsRequest) returns (AccountingListUserTransactionRecordsResponse);
  rpc AccountingGetUserTransactionRecordDetail(AccountingGetUserTransactionRecordDetailRequest) returns (AccountingGetUserTransactionRecordDetailResponse);

  // -------- Deposit Addresses --------
  rpc ListDepositAddresses(ListDepositAddressesRequest) returns (ListDepositAddressesResponse);
  rpc ListDepositAddressesWithBalance(ListDepositAddressesWithBalanceRequest) returns (ListDepositAddressesWithBalanceResponse);
  rpc GetDepositAddress(GetDepositAddressRequest) returns (GetDepositAddressResponse);
  rpc CreateDepositAddress(CreateDepositAddressRequest) returns (CreateDepositAddressResponse);
  rpc UpdateDepositAddress(UpdateDepositAddressRequest) returns (UpdateDepositAddressResponse);
  rpc DeleteDepositAddress(DeleteDepositAddressRequest) returns (DeleteDepositAddressResponse);
  rpc InitializeUserWallet(InitializeUserWalletRequest) returns (InitializeUserWalletResponse);

  // -------- Deposit Address Balances --------
  // 获取地址余额列表
  rpc ListDepositAddressBalances(ListDepositAddressBalancesRequest) returns (ListDepositAddressBalancesResponse);
  // 获取地址余额
  rpc GetDepositAddressBalance(GetDepositAddressBalanceRequest) returns (GetDepositAddressBalanceResponse);
  // 获取地址余额统计
  rpc GetDepositAddressBalanceStats(GetDepositAddressBalanceStatsRequest) returns (GetDepositAddressBalanceStatsResponse);
  // 按币种统计待归集金额（币种分布）
  rpc GetDepositAddressBalanceByAsset(GetDepositAddressBalanceByAssetRequest) returns (GetDepositAddressBalanceByAssetResponse);
  // 更新地址余额
  rpc UpdateDepositAddressBalance(UpdateDepositAddressBalanceRequest) returns (UpdateDepositAddressBalanceResponse);

  // -------- Consolidation (New module; independent from Sweep Tasks) --------
  rpc ListConsolidationTasks(AdminListConsolidationTasksRequest) returns (AdminListConsolidationTasksResponse);
  rpc GetConsolidationTask(AdminGetConsolidationTaskRequest) returns (AdminGetConsolidationTaskResponse);
  rpc RetryConsolidationTask(AdminRetryConsolidationTaskRequest) returns (AdminRetryConsolidationTaskResponse);
  rpc CancelConsolidationTask(AdminCancelConsolidationTaskRequest) returns (AdminCancelConsolidationTaskResponse);
  rpc TriggerConsolidation(AdminTriggerConsolidationRequest) returns (AdminTriggerConsolidationResponse);
  rpc GetConsolidationStats(AdminGetConsolidationStatsRequest) returns (AdminGetConsolidationStatsResponse);
  rpc ListConsolidationLogs(AdminListConsolidationLogsRequest) returns (AdminListConsolidationLogsResponse);
  rpc ListConsolidationTopupRecords(AdminListConsolidationTopupRecordsRequest) returns (AdminListConsolidationTopupRecordsResponse);
  rpc ListEnergyRentalRecords(AdminListEnergyRentalRecordsRequest) returns (AdminListEnergyRentalRecordsResponse);
  rpc GetEnergyRentalRecord(AdminGetEnergyRentalRecordRequest) returns (AdminGetEnergyRentalRecordResponse);

  // -------- Deposits --------
  rpc ListDeposits(ListDepositsRequest) returns (ListDepositsResponse);
  rpc GetDeposit(GetDepositRequest) returns (GetDepositResponse);
  rpc CreateDeposit(CreateDepositRequest) returns (CreateDepositResponse);
  rpc UpdateDeposit(UpdateDepositRequest) returns (UpdateDepositResponse);
  rpc CancelDeposit(CancelDepositRequest) returns (CancelDepositResponse);

  // -------- Withdrawals --------
  rpc CreateCurrencyWithdrawal(CreateCurrencyWithdrawalRequest) returns (CreateCurrencyWithdrawalResponse);
  rpc GetCurrencyWithdrawal(GetCurrencyWithdrawalRequest) returns (GetCurrencyWithdrawalResponse);
  rpc ListCurrencyWithdrawals(ListCurrencyWithdrawalsRequest) returns (ListCurrencyWithdrawalsResponse);
  rpc ApproveCurrencyWithdrawal(ApproveCurrencyWithdrawalRequest) returns (ApproveCurrencyWithdrawalResponse);
  rpc RejectCurrencyWithdrawal(RejectCurrencyWithdrawalRequest) returns (RejectCurrencyWithdrawalResponse);
  rpc CancelCurrencyWithdrawal(CancelCurrencyWithdrawalRequest) returns (CancelCurrencyWithdrawalResponse);
  rpc UpdateCurrencyWithdrawal(UpdateCurrencyWithdrawalRequest) returns (UpdateCurrencyWithdrawalResponse);
  rpc ListCurrencyWithdrawalEvents(ListCurrencyWithdrawalEventsRequest) returns (ListCurrencyWithdrawalEventsResponse);

  // -------- Internal Transfers (User-to-User) --------
  rpc ListInternalTransfers(ListInternalTransfersRequest) returns (ListInternalTransfersResponse);
  rpc GetInternalTransfer(GetInternalTransferRequest) returns (GetInternalTransferResponse);
  rpc ApproveInternalTransfer(ApproveInternalTransferRequest) returns (ApproveInternalTransferResponse);
  rpc RejectInternalTransfer(RejectInternalTransferRequest) returns (RejectInternalTransferResponse);
  rpc CancelInternalTransfer(CancelInternalTransferRequest) returns (CancelInternalTransferResponse);

  // ==================== Transfer (Batch Payout) ====================
  rpc ListTransferBatches(ListTransferBatchesRequest) returns (ListTransferBatchesResponse);
  rpc ImportTransferBatch(ImportTransferBatchRequest) returns (ImportTransferBatchResponse);
  rpc GetTransferBatch(GetTransferBatchRequest) returns (GetTransferBatchResponse);
  rpc SubmitTransferBatch(SubmitTransferBatchRequest) returns (SubmitTransferBatchResponse);
  rpc ApproveTransferBatch(ApproveTransferBatchRequest) returns (ApproveTransferBatchResponse);
  rpc CancelTransferBatch(CancelTransferBatchRequest) returns (CancelTransferBatchResponse);
  rpc ExecuteTransferBatch(ExecuteTransferBatchRequest) returns (ExecuteTransferBatchResponse);
  rpc RetryTransferBatch(RetryTransferBatchRequest) returns (RetryTransferBatchResponse);

  // ==================== Web3 Users ====================
  rpc ListWeb3Users(ListWeb3UsersRequest) returns (ListWeb3UsersResponse);
  rpc GetWeb3User(GetWeb3UserRequest) returns (GetWeb3UserResponse);
  rpc GetWeb3UsersPageList(GetWeb3UsersPageListRequest) returns (GetWeb3UsersPageListResponse);
  rpc GetWeb3UsersSummary(GetWeb3UsersSummaryRequest) returns (GetWeb3UsersSummaryResponse);
  rpc ListWeb3UserTransactions(ListWeb3UserTransactionsRequest) returns (ListWeb3UserTransactionsResponse);
  rpc BlacklistWeb3Address(BlacklistWeb3AddressRequest) returns (BlacklistWeb3AddressResponse);
  rpc UnblacklistWeb3Address(UnblacklistWeb3AddressRequest) returns (UnblacklistWeb3AddressResponse);
  rpc BatchWeb3AddressBlacklist(BatchWeb3AddressBlacklistRequest) returns (BatchWeb3AddressBlacklistResponse);
  rpc GetWeb3UserStatistics(GetWeb3UserStatisticsRequest) returns (GetWeb3UserStatisticsResponse);
  rpc ExportWeb3Users(ExportWeb3UsersRequest) returns (ExportWeb3UsersResponse);
  rpc ListWeb3UserAddresses(ListWeb3UserAddressesRequest) returns (ListWeb3UserAddressesResponse);

  // ==================== Blacklist (Sensitive Addresses) ====================
  rpc ListBlacklistAddresses(ListBlacklistAddressesRequest) returns (ListBlacklistAddressesResponse);
  rpc CreateBlacklistAddress(CreateBlacklistAddressRequest) returns (CreateBlacklistAddressResponse);
  rpc BatchCreateBlacklistAddresses(BatchCreateBlacklistAddressesRequest) returns (BatchCreateBlacklistAddressesResponse);
  rpc UpdateBlacklistAddressMonitorStatus(UpdateBlacklistAddressMonitorStatusRequest) returns (UpdateBlacklistAddressMonitorStatusResponse);
  rpc DeleteBlacklistAddress(DeleteBlacklistAddressRequest) returns (DeleteBlacklistAddressResponse);
  rpc ExportBlacklistAddresses(ExportBlacklistAddressesRequest) returns (ExportBlacklistAddressesResponse);

  // ==================== Vault Funds Management ====================
  // 获取资金概览
  rpc GetVaultOverview(GetVaultOverviewRequest) returns (GetVaultOverviewResponse);
  // 获取某个链的详细信息
  rpc GetVaultDetail(GetVaultDetailRequest) returns (GetVaultDetailResponse);
  // 创建资金调整
  rpc CreateVaultAdjustment(CreateVaultAdjustmentRequest) returns (CreateVaultAdjustmentResponse);
  rpc ListVaultAdjustments(ListVaultAdjustmentsRequest) returns (ListVaultAdjustmentsResponse);
  // 审批资金调整
  rpc ApproveVaultAdjustment(ApproveVaultAdjustmentRequest) returns (ApproveVaultAdjustmentResponse);
  // 更新预警阈值
  rpc UpdateVaultThresholds(UpdateVaultThresholdsRequest) returns (UpdateVaultThresholdsResponse);
  // 刷新余额
  rpc SyncVault(SyncVaultRequest) returns (SyncVaultResponse);

  // ==================== Vault Address Management ====================
  // 添加 Vault 地址
  rpc AddVaultAddress(AddVaultAddressRequest) returns (AddVaultAddressResponse);
  // 查看地址列表
  rpc ListVaultAddresses(ListVaultAddressesRequest) returns (ListVaultAddressesResponse);
  // 修改地址状态
  rpc UpdateVaultAddressStatus(UpdateVaultAddressStatusRequest) returns (UpdateVaultAddressStatusResponse);
  // 删除地址
  rpc DeleteVaultAddress(DeleteVaultAddressRequest) returns (DeleteVaultAddressResponse);
  // 获取地址余额
  rpc GetVaultAddressBalances(GetVaultAddressBalancesRequest) returns (GetVaultAddressBalancesResponse);
  // 检查热钱包余额是否足够（用于提现前验证）
  rpc CheckHotWalletBalance(CheckHotWalletBalanceRequest) returns (CheckHotWalletBalanceResponse);


  // ==================== Dashboard Statistics ====================
  // 获取仪表板核心概览数据
  rpc GetDashboardOverview(GetDashboardOverviewRequest) returns (GetDashboardOverviewResponse);
  // 获取仪表板趋势图表数据
  rpc GetDashboardTrends(GetDashboardTrendsRequest) returns (GetDashboardTrendsResponse);
  // 获取最近操作动态
  rpc GetDashboardActivities(GetDashboardActivitiesRequest) returns (GetDashboardActivitiesResponse);

}

// ============================================================================
// Common
// ============================================================================

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int64 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

// ============================================================================
// Consolidation (Admin module; independent from Sweep Tasks)
// ============================================================================

message AdminConsolidationTaskItem {
  string task_id = 1;
  string chain = 2;           // TRON/ETH/BSC
  string asset_symbol = 3;    // TRX/ETH/BNB/USDT/USDC
  string token_contract = 4;  // empty for native
  string from_address = 5;
  string to_address = 6;
  string amount = 7;          // smallest unit
  string estimated_fee = 8;
  string actual_fee = 9;
  int32 status = 10;          // matches consolidation_tasks.status
  string tx_hash = 11;
  int32 retry_count = 12;
  string error_message = 13;
  string started_at = 14;     // RFC3339 (UTC)
  string confirmed_at = 15;   // RFC3339 (UTC)
  string next_attempt_at = 16;// RFC3339 (UTC)
  string claimed_by = 17;
  string claimed_until = 18;  // RFC3339 (UTC)
  int64 energy_rental_id = 19;
  int32 energy_order_count = 20;
  int64 energy_total_cost_sun = 21;
  string created_at = 22;     // RFC3339 (UTC)
  string updated_at = 23;     // RFC3339 (UTC)
  // Human-readable values converted from smallest unit.
  string amount_readable = 24;
  string estimated_fee_readable = 25;
  string actual_fee_readable = 26;
}

message AdminListConsolidationTasksRequest {
  int32 page = 1;
  int32 page_size = 2;
  string chain = 3;           // optional
  string asset_symbol = 4;    // optional
  int32 status = 5;           // optional (0=all)
  int64 created_at_from = 6;  // optional unix seconds
  int64 created_at_to = 7;    // optional unix seconds
  string task_id = 8;         // optional
  string from_address = 9;    // optional
  string to_address = 10;     // optional
  string tx_hash = 11;        // optional
}

message AdminListConsolidationTasksData {
  repeated AdminConsolidationTaskItem tasks = 1;
}

message AdminListConsolidationTasksResponse {
  bool success = 1;
  string message = 2;
  AdminListConsolidationTasksData data = 3;
  Pagination pagination = 4;
  string request_id = 5;
  string timestamp = 6;
}

message AdminGetConsolidationTaskRequest {
  string task_id = 1;
}

message AdminGetConsolidationTaskData {
  AdminConsolidationTaskItem task = 1;
}

message AdminGetConsolidationTaskResponse {
  bool success = 1;
  string message = 2;
  AdminGetConsolidationTaskData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

message AdminRetryConsolidationTaskRequest {
  string task_id = 1;
}

message AdminRetryConsolidationTaskResponse {
  bool success = 1;
  string message = 2;
  string request_id = 3;
  string timestamp = 4;
}

message AdminCancelConsolidationTaskRequest {
  string task_id = 1;
}

message AdminCancelConsolidationTaskResponse {
  bool success = 1;
  string message = 2;
  string request_id = 3;
  string timestamp = 4;
}

message AdminTriggerConsolidationRequest {
  string chain = 1;        // optional
  string asset_symbol = 2; // optional
  string from_address = 3; // optional
  bool dry_run = 4;        // optional
}

message AdminTriggerConsolidationData {
  int64 total_candidates = 1;
  int64 total_tasks_created = 2;
  repeated AdminConsolidationTaskItem tasks = 3;
}

message AdminTriggerConsolidationResponse {
  bool success = 1;
  string message = 2;
  AdminTriggerConsolidationData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

message AdminGetConsolidationStatsRequest {
  string chain = 1;        // optional
  string asset_symbol = 2; // optional
  int64 from_ts = 3;       // optional unix seconds
  int64 to_ts = 4;         // optional unix seconds
}

message AdminConsolidationStats {
  int64 total = 1;
  int64 confirmed = 2;
  int64 failed = 3;
  double success_rate = 4;
  string total_amount = 5;
  string total_estimated_fee = 6;
  string total_actual_fee = 7;
  // Human-readable values converted from smallest unit.
  // Only meaningful when request specifies a single asset_symbol.
  string total_amount_readable = 8;
  string total_estimated_fee_readable = 9;
  string total_actual_fee_readable = 10;
}

message AdminGetConsolidationStatsData {
  AdminConsolidationStats stats = 1;
}

message AdminGetConsolidationStatsResponse {
  bool success = 1;
  string message = 2;
  AdminGetConsolidationStatsData data = 3;
  string request_id = 4;
