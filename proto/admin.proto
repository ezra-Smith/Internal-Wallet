  string period = 1;
  SwapStatisticsSummary summary = 2;
  repeated SwapStatisticsByNetworkItem by_network = 3;
  repeated SwapStatisticsByPairItem by_pair = 4;
  repeated SwapStatisticsTrendItem trend = 5;
}

message GetSwapStatisticsRequest {
  string period = 1;       // 统计周期: 7d, 30d, 90d (如果 start_date/end_date 为空则使用此参数)
  string group_by = 2;     // 分组方式 (保留字段)
  string network = 3;      // 网络过滤 (保留字段)
  string start_date = 4;   // 开始日期 (YYYY-MM-DD, optional, 优先级高于 period)
  string end_date = 5;     // 结束日期 (YYYY-MM-DD, optional, 优先级高于 period)
}

message GetSwapStatisticsResponse {
  bool success = 1;
  string message = 2;
  SwapStatisticsData data = 3;
  string request_id = 4;
  string timestamp = 5;
}

// ============================================================================
// Swap Configuration (Simplified Architecture)
//
// 注意：goctl 生成 rpc 代码时，service 的 request/response message 需要在同一个 proto 文件中定义。
// 因此这里不能直接复用 swap.proto 的 message，需要在 admin.proto 中定义同构结构，以保持 HTTP JSON shape 不变。
// ============================================================================

// -------- 全局配置 CRUD --------
// AdminSwapConfigItem Swap配置项
message AdminSwapConfigItem {
