  bool web2_transfer_enabled = 3;
  bool web3_deposit_enabled = 4;
  bool web3_withdraw_enabled = 5;
  bool web3_swap_enabled = 6;
  bool use_global_withdraw_fee = 7;
  bool use_global_withdraw_audit = 8;
  bool use_global_transfer_audit = 9;
}

