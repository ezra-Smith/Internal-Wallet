  int64 created_at = 13;
  int64 updated_at = 14;
}

message AdminCreateAlertConfigRequest {
  string name = 1;
  string description = 2;
  string threshold_usd = 3;
  int32 time_window_seconds = 4;
  bool monitor_web3_withdraw = 5;
  bool monitor_web2_withdraw = 6;
