  int64 id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  int32 status = 5;
  string created_at = 6;
  string updated_at = 7;
  string deleted_at = 8;
  repeated AdminMenu menus = 9;               // optional for GetRoleById
  repeated AdminPermission permissions = 10;  // optional for GetRoleById
}

