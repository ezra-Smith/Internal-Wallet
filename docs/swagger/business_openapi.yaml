        tags:
          - Notifications
        summary: "资产页-消息通知"
        description: "删除单条通知"

    - method: business.Business.ClearAllNotifications
      option:
        tags:
          - Notifications
        summary: "资产页-消息通知"
        description: "清空所有通知"

    - method: business.Business.RegisterDevice
      option:
        tags:
          - Notifications
        summary: "设备注册（Web3用户）"
        description: "注册设备，绑定设备ID和极光registration_id，用于推送通知"

    - method: business.Business.SendPushNotificationByAlias
