openapiOptions:
  method:
    - method: business.Business.GetCountryCodes
      option:
        tags:
          - Auth
        summary: "获取支持的国家/地区区号"
        description: "返回系统支持的手机号国家/地区区号列表（E.164，带 + 前缀）"

    - method: business.Business.SendSMSCode
      option:
        tags:
          - Auth
        summary: "发送手机验证码"
        description: "向手机号发送验证码"

    - method: business.Business.SendEmailCode
      option:
        tags:
          - Auth
        summary: "发送邮箱验证码"
        description: "向邮箱发送验证码（请求体需提供 email）"

    - method: business.Business.LoginByEmailCode
      option:
        tags:
          - Auth
        summary: "邮箱验证码登录/注册"
        description: "使用邮箱与验证码登录，首次使用自动注册"

    - method: business.Business.LoginByPhoneCode
      option:
        tags:
          - Auth
        summary: "手机验证码登录/注册"
        description: "使用手机号（country_code + phone）与验证码登录，首次使用自动注册"

    - method: business.Business.LoginByGoogle
      option:
        tags:
          - Auth
        summary: "Google OAuth 登录"
        description: "使用 Google OAuth ID Token 登录或注册，支持自动注册新用户"

    - method: business.Business.RefreshToken
      option:
        tags:
          - Auth
        summary: "刷新令牌"
        description: "使用刷新令牌获取新的访问令牌"

    - method: business.Business.ForgotPasswordByEmail
      option:
        tags:
          - Auth
        summary: "忘记密码（邮箱）"
        description: "通过邮箱验证码重置登录密码"

    - method: business.Business.ForgotPasswordByPhone
      option:
        tags:
          - Auth
        summary: "忘记密码（手机）"
        description: "通过短信验证码重置登录密码"

    - method: business.Business.ValidateGeetest
      option:
        tags:
          - Auth
        summary: "Geetest 验证"
        description: "校验 Geetest v4 验证参数"

    - method: business.Business.Logout
      option:
        tags:
          - Auth
        summary: "登出"
        description: "销毁会话并使令牌失效"

    - method: business.Business.GetMyOverview
      option:
        tags:
          - Me
        summary: "我的页"
        description: "获取我的页面概览信息"

    - method: business.Business.GetAssetOverview
      option:
        tags:
          - Assets
        summary: "资产页"
        description: "获取用户资产概览"

    - method: business.Business.GetAssetDetail
      option:
        tags:
          - Assets
        summary: "资产页-详情"
        description: "获取资产详情与交易记录"

    - method: business.Business.GetAssetConfig
      option:
        tags:
          - Assets
        summary: "获取所有资产配置"
        description: "获取所有资产配置信息（包含精度、状态等）"

    - method: business.Business.ListTransactionRecords
      option:
        tags:
          - Assets
        summary: "资产页-交易记录"
        description: "分页获取资产相关的交易记录"

    - method: business.Business.GetTransactionRecordDetail
      option:
        tags:
          - Assets
        summary: "资产页-交易记录-详情"
        description: "获取交易记录的详细信息"

    - method: business.Business.GetDepositInfo
      option:
        tags:
          - Assets
        summary: "资产-充值"
        description: "获取可充值资产与网络信息"

    - method: business.Business.CreateDeposit
      option:
        tags:
          - Assets
        summary: "CreateDeposit"

    - method: business.Business.ListDepositRecords
      option:
        tags:
          - Assets
        summary: "资产-充值记录"
        description: "分页获取充值记录"

    - method: business.Business.GetDepositDetail
      option:
        tags:
          - Assets
        summary: "资产-充值详情"
        description: "获取指定充值记录详情"

    - method: business.Business.ListDepositAddressBook
      option:
        tags:
          - Assets
        summary: "资产-充值地址簿列表"
        description: "获取用户充值地址簿（支持同链多地址，按链/币种统计）"

    - method: business.Business.CreateDepositAddressBook
      option:
        tags:
          - Assets
        summary: "资产-新增充值地址"
        description: "为指定链生成新的充值地址（可设为默认）"

    - method: business.Business.GetDepositAddressBookDetail
      option:
        tags:
          - Assets
        summary: "资产-充值地址详情"
        description: "获取单个充值地址详情（含累计收款统计）"

    - method: business.Business.UpdateDepositAddressBook
      option:
        tags:
          - Assets
        summary: "资产-更新充值地址备注"
        description: "更新充值地址的标签/备注"

    - method: business.Business.DeleteDepositAddressBook
      option:
        tags:
          - Assets
        summary: "资产-删除充值地址"
        description: "删除充值地址（校验是否存在待确认充值、以及同链至少保留一个地址）"

    - method: business.Business.SetDefaultDepositAddressBook
      option:
        tags:
          - Assets
        summary: "资产-设置默认充值地址"
        description: "设置同链默认充值地址（自动取消同链其他默认）"

    - method: business.Business.ListDepositAddressBookDeposits
      option:
        tags:
          - Assets
        summary: "资产-充值地址收款记录"
        description: "获取指定充值地址的充值记录列表"

    - method: business.Business.ListWithdrawRecords
      option:
        tags:
          - Assets
        summary: "资产-提现记录"
        description: "分页获取提现记录"

    - method: business.Business.ListActionAssets
      option:
        tags:
          - Assets
        summary: "资产页-币种列表"
        description: "获取充值/提现相关资产列表"

    - method: business.Business.ListActionNetworks
      option:
        tags:
          - Assets
        summary: "资产页-网络列表"
        description: "获取指定资产的可用网络及费用"

    - method: business.Business.GetAssetWithdrawFeeConfig
      option:
        tags:
          - Assets
        summary: "资产页-获取指定代币的可提现区间金额"
        description: "获取指定代币的可提现区间金额（包含最小值、最大值）"

    - method: business.Business.GetExchangeRate
      option:
        tags:
          - Assets
        summary: "资产页-汇率查询"
        description: "查询两个币种之间的实时汇率（从 market 服务获取价格数据）"

    - method: business.Business.ListFiatRates
      option:
        tags:
          - Assets
        summary: "资产页-法币汇率列表"
        description: "查询 1 USDT = n 法币汇率列表（支持传入多个法币过滤；未命中返回 missing 列表）"

    - method: business.Business.GetWithdrawInfo
      option:
        tags:
          - Assets
        summary: "资产页-提币"
        description: "获取可提现资产与网络信息"

    - method: business.Business.EstimateWithdrawFee
      option:
        tags:
          - Assets
        summary: "Web2 提币手续费预估"
        description: "仅按后端提币手续费规则（fixed/percent）预估手续费，不构建链上交易，不使用 Web3 gas 接口"

    - method: business.Business.CalcWithdrawFee
      option:
        tags:
          - Assets
        summary: "Web2 提币手续费计算"
        description: "校验资产/网络/余额后按后端规则计算手续费，返回 fee/min_withdraw_amount/required_amount"

    - method: business.Business.CreateWithdraw
      option:
        tags:
          - Assets
        summary: "资产页-提币"
        description: "创建提现请求"

    - method: business.Business.GetWithdrawAuditStatus
      option:
        tags:
          - Assets
        summary: "资产页-提币审核状态"
        description: "查询提现审核状态"

    - method: business.Business.GetWithdrawDetail
      option:
        tags:
          - Assets
        summary: "资产页-提现详情"
        description: "获取提现记录详情"

    - method: business.Business.ListNotifications
      option:
        tags:
          - Notifications
        summary: "资产页-消息通知"
        description: "获取通知列表"

    - method: business.Business.MarkNotificationRead
      option:
        tags:
          - Notifications
        summary: "资产页-消息通知"
        description: "标记单条通知为已读"

    - method: business.Business.MarkAllNotificationsRead
      option:
        tags:
          - Notifications
