# Air - live reloading for admin-rpc (dev only).
#
# Usage (inside repo root):
#   cd services/admin/rpc
#   air -c .air.toml
#
# In `deploy/admin/docker-compose.yml`, the container generates `/tmp/admin.yaml` then runs air.

root = "../../.."
tmp_dir = ".air"

[build]
  cmd = "go build -o .air/admin-rpc ./services/admin/rpc"
  bin = ".air/admin-rpc"
  full_bin = ".air/admin-rpc -f /tmp/admin.yaml"
  include_ext = ["go", "yaml", "yml"]
  include_dir = ["services/admin/rpc", "common", "proto"]
  exclude_dir = [".air", ".git", ".cache", ".gocache", ".gomodcache", "web"]
  delay = 300
  stop_on_error = false

[log]
  time = false

[misc]
  clean_on_exit = true
